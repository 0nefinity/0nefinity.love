<!DOCTYPE html>
<html lang="de">
<head>
  <!--#include virtual="/includes/something-in-the-head.html" -->
<meta charset="UTF-8">
<title>gespiegeltes Mandelbrot</title>
<style>
#feld { touch-action: none; cursor: grab; }
#feld:active { cursor: grabbing; }
#feld canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
#deko { pointer-events: none; }
#feld #lupe {
  inset: auto;
  /* below the menu and back buttons in the top corners */
  top: 64px;
  right: 12px;
  width: 132px;
  height: 132px;
  border-radius: 50%;
  border: 1px solid var(--text-color);
  background: var(--bg-color);
  touch-action: none;
  cursor: grab;
}
#feld #lupe:active { cursor: grabbing; }
#feld #lupe.links { right: auto; left: 12px; }
#feld #lupe[hidden] { display: none; }

#wert {
  margin: 0 0 0.3rem;
  text-align: center;
  font-family: var(--font-libertinus-math);
  font-size: 1.125rem;
  line-height: 1.6;
  font-variant-numeric: tabular-nums;
  color: var(--text-color);
  white-space: nowrap;
  text-shadow: none;
}

#fehler {
  position: fixed;
  top: 5rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  margin: 0;
  padding: 0.4rem 0.75rem;
  border-radius: 6px;
  background: var(--ui-surface-strong);
  color: #e0a4a4;
  font-size: 0.875rem;
}
#fehler[hidden] { display: none; }

@media (max-width: 420px) {
  #wert { font-size: 1rem; }
}
</style>
</head>
<body>
<div id="feld" class="_018-canvas">
  <canvas id="bild" aria-label="Mandelbrot-Menge, innen echt, außen am Kreis gespiegelt; Spiegelpunkt verschiebbar"></canvas>
  <canvas id="deko" aria-hidden="true"></canvas>
  <canvas id="lupe" aria-hidden="true" hidden></canvas>
</div>
<p id="wert" aria-live="off"></p>
<p id="fehler" role="alert" hidden></p>
<script>
"use strict";
(() => {
  const feld = document.getElementById("feld");
  const bild = document.getElementById("bild");
  const deko = document.getElementById("deko");
  const dctx = deko.getContext("2d");
  const lupe = document.getElementById("lupe");
  const lctx = lupe.getContext("2d");
  const wert = document.getElementById("wert");
  const fehler = document.getElementById("fehler");

  const fail = (msg) => {
    console.error(msg);
    fehler.textContent = msg;
    fehler.hidden = false;
  };

  // the start: a Misiurewicz point from the Forschungsheft, section (h)
  const START = { c: [-0.7214150803581202, 0.25918596703287955], r: 1.5 };

  // state: mirror point cM, radius r; view in the w-plane: center (vx, vy), sw = w units per CSS pixel.
  // cMx/cMy and vx/vy are double shadows of the exact values cH and vH (fixed point, below)
  let cMx = START.c[0], cMy = START.c[1], r = START.r;
  let vx = 0, vy = 0, sw = 0;
  let snapOn = true;
  let cssW = 1, cssH = 1, dpr = 1, quality = 1;
  // zoom stops where doubles stop: about 290 decades in, 290 out
  const SW_MIN = 1e-290, SW_MAX = 1e290;

  // ---- exact numbers: BigInt fixed point, value = b / 2^PB ----
  // Deep views need the view center and the reference orbit far below double resolution.
  let PB = 128, PBn = 128n;
  const bitLen = (b) => (b < 0n ? -b : b).toString(16).length * 4;
  function ldexp(x, n) {
    while (n > 1000) { x *= 2 ** 1000; n -= 1000; }
    while (n < -1000) { x *= 2 ** -1000; n += 1000; }
    return x * 2 ** n;
  }
  // double -> fixed point (exact)
  function H(x) {
    if (x === 0 || !Number.isFinite(x)) return 0n;
    const e = Math.floor(Math.log2(Math.abs(x))) - 60;
    const m = BigInt(Math.round(ldexp(x, -e)));
    const k = e + PB;
    return k >= 0 ? m << BigInt(k) : m >> BigInt(-k);
  }
  // fixed point -> double, divided by 2^e
  function N(b, e = 0) {
    let k = PB + e;
    const drop = Math.min(k, bitLen(b) - 64);
    if (drop > 0) { b >>= BigInt(drop); k -= drop; }
    return ldexp(Number(b), -k);
  }
  const mul = (a, b) => (a * b) >> PBn;
  // decimal string (also 1.5e-7) -> fixed point
  function fromDec(str) {
    const m = /^\s*([+-]?)(\d*)\.?(\d*)(?:e([+-]?\d+))?\s*$/i.exec(str);
    if (!m || !(m[2] + m[3])) return null;
    const ex = (Number(m[4]) || 0) - m[3].length;
    let b = BigInt(m[2] + m[3]) << PBn;
    b = ex >= 0 ? b * 10n ** BigInt(ex) : b / 10n ** BigInt(-ex);
    return m[1] === "-" ? -b : b;
  }
  // fixed point -> decimal string with n fraction digits
  function toDec(b, n) {
    const neg = b < 0n;
    if (neg) b = -b;
    const ip = b >> PBn;
    const fp = (((b - (ip << PBn)) * 10n ** BigInt(n)) >> PBn).toString().padStart(n, "0").replace(/0+$/, "");
    return (neg ? "-" : "") + ip + (fp ? "." + fp : "");
  }

  let cH = [0n, 0n], vH = [0n, 0n];
  // cM as an exact Misiurewicz point: preperiod k, period p (null when cM is just where the finger left it)
  let mis = null;
  // reference orbit currently in the texture
  let ref = null;

  function setPB(n) {
    if (n === PB) return;
    const sh = (b) => (n > PB ? b << BigInt(n - PB) : b >> BigInt(PB - n));
    cH = cH.map(sh);
    vH = vH.map(sh);
    PB = n;
    PBn = BigInt(n);
    ref = null;
    if (mis) cH = misRefine(cH[0], cH[1], mis.k, mis.p) || cH;
  }
  // bits for the finest c-pixel of the current view, plus 64 to spare
  function ensurePB() {
    const half = Math.hypot(cssW, cssH) / 2 * sw;
    const wmax = Math.hypot(vx, vy) + half;
    const pc = Math.max(1e-300, Math.max(r, 1e-9) * sw / Math.max(1, wmax * wmax));
    const need = Math.max(128, Math.ceil((64 + Math.max(0, -Math.log2(pc), -Math.log2(sw))) / 64) * 64);
    if (need > PB || need < PB - 128) setPB(need);
  }
  function setV(hx, hy) {
    vH = [hx, hy];
    vx = N(hx);
    vy = N(hy);
  }
  const panBy = (dx, dy) => setV(vH[0] + H(dx), vH[1] + H(dy));
  // exact: look for the Misiurewicz point this double is the rounding of (start, URL)
  function setC(x, y, exact) {
    cMx = x;
    cMy = y;
    mis = null;
    cH = [H(x), H(y)];
    if (!exact) return;
    const m = misFind(x, y, 1e-12 * (1 + Math.hypot(x, y)));
    if (m) {
      mis = { k: m.k, p: m.p };
      cH = m.e;
    }
  }

  // ---- Misiurewicz points: z_{k+p} = z_k for the orbit of 0, k >= 1 ----
  // Only these mirror into a pattern without end; any other point closes up when zoomed out far enough.
  function misNewton(cx, cy, k, p) {
    for (let it = 0; it < 40; it++) {
      let zx = 0, zy = 0, dx = 0, dy = 0, ax = 0, ay = 0, bx = 0, by = 0;
      for (let n = 1; n <= k + p; n++) {
        const t = 2 * (zx * dx - zy * dy) + 1;
        dy = 2 * (zx * dy + zy * dx);
        dx = t;
        const u = zx * zx - zy * zy + cx;
        zy = 2 * zx * zy + cy;
        zx = u;
        if (n === k) { ax = zx; ay = zy; bx = dx; by = dy; }
      }
      const gx = zx - ax, gy = zy - ay, hx = dx - bx, hy = dy - by;
      const h2 = hx * hx + hy * hy;
      if (!(h2 > 0)) return null;
      const sx = (gx * hx + gy * hy) / h2, sy = (gy * hx - gx * hy) / h2;
      cx -= sx;
      cy -= sy;
      if (!(Math.abs(cx) < 4 && Math.abs(cy) < 4)) return null;
      if (Math.hypot(sx, sy) < 1e-14 * (1 + Math.hypot(cx, cy))) return [cx, cy];
    }
    return null;
  }
  // pairs (k, p) whose Newton step from c is shorter than R: near c lies a root of
  // z_{k+p} = z_k about that far away. Smallest k first.
  function misCandidates(cx, cy, R) {
    const zs = [], ds = [];
    let zx = 0, zy = 0, dx = 0, dy = 0;
    for (let n = 1; n <= 2000; n++) {
      const t = 2 * (zx * dx - zy * dy) + 1;
      dy = 2 * (zx * dy + zy * dx);
      dx = t;
      const u = zx * zx - zy * zy + cx;
      zy = 2 * zx * zy + cy;
      zx = u;
      if (!(zx * zx + zy * zy < 1e6 && Math.abs(dx) + Math.abs(dy) < 1e150)) break;
      zs.push(zx, zy);
      ds.push(dx, dy);
    }
    const L = zs.length / 2, out = [];
    for (let k = 1; k < L; k++)
      for (let p = 1; p <= 8 && k + p <= L; p++) {
        const i = 2 * (k - 1), j = 2 * (k + p - 1);
        const gx = zs[j] - zs[i], gy = zs[j + 1] - zs[i + 1], hx = ds[j] - ds[i], hy = ds[j + 1] - ds[i + 1];
        const h2 = hx * hx + hy * hy;
        if (h2 > 0 && (gx * gx + gy * gy) / h2 < R * R) out.push({ k, p });
      }
    return out;
  }
  const ab = (b) => (b < 0n ? -b : b);
  // exact check of a refined root: the next Newton step is below half the working
  // precision, and the cycle repels (a centre has 0 on its cycle and attracts: finite).
  // Barely repelling cycles are endless too, but grow so slowly per turn that far out
  // the iteration limit runs out first and the view goes flat: at least 1/16 bit per step.
  function misVerify(cx, cy, k, p) {
    const one = 1n << PBn, s1 = PBn - 1n;
    let zx = 0n, zy = 0n, dx = 0n, dy = 0n, ax = 0n, ay = 0n, bx = 0n, by = 0n, lam = 0;
    for (let n = 1; n <= k + p; n++) {
      if (n > k) lam += Math.log2(2 * Math.hypot(N(zx), N(zy)));
      const t = ((zx * dx - zy * dy) >> s1) + one;
      dy = (zx * dy + zy * dx) >> s1;
      dx = t;
      const u = ((zx * zx - zy * zy) >> PBn) + cx;
      zy = ((zx * zy) >> s1) + cy;
      zx = u;
      if (ab(zx) + ab(zy) > 8n << PBn) return false;
      if (n === k) { ax = zx; ay = zy; bx = dx; by = dy; }
    }
    const gx = zx - ax, gy = zy - ay, hx = dx - bx, hy = dy - by;
    const h2 = (hx * hx + hy * hy) >> PBn;
    if (h2 === 0n || !(lam >= p / 16)) return false;
    const sx = ((gx * hx + gy * hy) >> PBn << PBn) / h2, sy = ((gy * hx - gx * hy) >> PBn << PBn) / h2;
    return N(ab(sx) + ab(sy)) < 2 ** (-PB / 2);
  }
  // a verified Misiurewicz point within R of c (double in, exact out), smallest preperiod first
  function misFind(cx, cy, R) {
    const h0 = [H(cx), H(cy)];
    let tries = 0;
    for (const { k, p } of misCandidates(cx, cy, R)) {
      if (++tries > 64) break;
      const c = misNewton(cx, cy, k, p) || [cx, cy];
      if (Math.hypot(c[0] - cx, c[1] - cy) > 2 * R) continue;
      const e = misRefine(H(c[0]), H(c[1]), k, p);
      if (!e || Math.hypot(N(e[0] - h0[0]), N(e[1] - h0[1])) > R || !misVerify(e[0], e[1], k, p)) continue;
      return { c: [N(e[0]), N(e[1])], e, k, p };
    }
    return null;
  }
  // Newton in fixed point, quadratic from the double root; null if the orbit escapes
  function misRefine(cx, cy, k, p) {
    const one = 1n << PBn, s1 = PBn - 1n, esc = 8n << PBn;
    for (let it = 0; it < 40; it++) {
      let zx = 0n, zy = 0n, dx = 0n, dy = 0n, ax = 0n, ay = 0n, bx = 0n, by = 0n;
      for (let n = 1; n <= k + p; n++) {
        const t = ((zx * dx - zy * dy) >> s1) + one;
        dy = (zx * dy + zy * dx) >> s1;
        dx = t;
        const u = ((zx * zx - zy * zy) >> PBn) + cx;
        zy = ((zx * zy) >> s1) + cy;
        zx = u;
        if (ab(zx) + ab(zy) > esc) return null;
        if (n === k) { ax = zx; ay = zy; bx = dx; by = dy; }
      }
      const gx = zx - ax, gy = zy - ay, hx = dx - bx, hy = dy - by;
      const h2 = (hx * hx + hy * hy) >> PBn;
      if (h2 === 0n) break;
      const sx = ((gx * hx + gy * hy) >> PBn << PBn) / h2, sy = ((gy * hx - gx * hy) >> PBn << PBn) / h2;
      cx -= sx;
      cy -= sy;
      if ((sx < 0n ? -sx : sx) + (sy < 0n ? -sy : sy) < 256n) break;
    }
    return [cx, cy];
  }

  // ---- WebGL ----
  const gl = bild.getContext("webgl2", { antialias: false, preserveDrawingBuffer: true });
  if (!gl) { fail("WebGL 2 fehlt in diesem Browser."); return; }

  const VS = `#version 300 es
in vec2 p;
void main() { gl_Position = vec4(p, 0.0, 1.0); }`;

  // Perturbation around an exact reference orbit (texture), with rebasing (Zhuoran):
  // pixels iterate only dz = z - Z. Inside |w| <= 1: c = cM + r w; outside:
  // c = cM + r / conj(w) (circle inversion, continuous on |w| = 1).
  // Every pixel gets its dc as mantissa * 2^ec. While dz is below float range it is
  // carried the same way (dz = w 2^E, rescaled by 2^16 steps), so depth is not bound
  // by float32; once |dz| > 2^-100 the loop runs on plain floats.
  // Mode 0 (origin in view): reference cM, u = w / s.
  // Mode 1: reference near the view center vc; pixel offsets relative to vc, with
  // D0I / D0O = c(vc) - cRef on the inner / outer branch, done exactly in JS.
  const FS = `#version 300 es
precision highp float;
precision highp int;
uniform sampler2D uRef;
uniform int uRefLen;
uniform int uMaxit;
uniform vec2 uRes;
uniform int uMode;
uniform vec2 uU0;
uniform float uInvS2;
uniform float uKI;
uniform int uEI;
uniform float uKO;
uniform int uEO;
uniform float uH;
uniform vec2 uVn;
uniform float uEps;
uniform vec2 uE;
uniform vec2 uA;
uniform vec2 uD0I;
uniform vec2 uD0O;
out vec4 o;

vec2 cmul(vec2 a, vec2 b) { return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x); }
vec2 cdiv(vec2 a, vec2 b) {
  float m = max(abs(b.x), abs(b.y));
  vec2 bb = b / m;
  return vec2(a.x * bb.x + a.y * bb.y, a.y * bb.x - a.x * bb.y) / (dot(bb, bb) * m);
}
vec2 invConj(vec2 w) {
  float m = max(abs(w.x), abs(w.y));
  vec2 u = w / m;
  return u / (dot(u, u) * m);
}
vec2 refAt(int m) { return texelFetch(uRef, ivec2(m & 4095, m >> 12), 0).rg; }

void main() {
  vec2 p = gl_FragCoord.xy - 0.5 * uRes;
  // dc = dcm 2^ec; pcm 2^ec = |dc/dp|, the size of this pixel in the c-plane
  vec2 dcm;
  float pcm;
  int ec;
  if (uMode == 0) {
    vec2 u = uU0 + p;
    if (dot(u, u) > uInvS2) {
      vec2 iu = invConj(u);
      dcm = uKO * iu;
      pcm = uKO * dot(iu, iu);
      ec = uEO;
    } else {
      dcm = uKI * u;
      pcm = uKI;
      ec = uEI;
    }
  } else {
    // |vc + s p|^2 > 1, divided by s |vc|
    if (uH + 2.0 * dot(uVn, p) + uEps * dot(p, p) > 0.0) {
      vec2 q1 = vec2(1.0, 0.0) + cmul(uE, p);
      vec2 q = cdiv(p, q1);
      dcm = uD0O - cmul(uA, vec2(q.x, -q.y));
      pcm = length(uA) / dot(q1, q1);
      ec = uEO;
    } else {
      dcm = uD0I + uKI * p;
      pcm = uKI;
      ec = uEI;
    }
  }

  // D = dz/dc * |dc/dp|: the derivative in pixels, so neither it nor the pixel size overflows
  vec2 dz = vec2(0.0), D = vec2(0.0), z = vec2(0.0), dc = vec2(0.0);
  float pc = 0.0;
  int E = ec;
  bool scaled = ec < -100;
  float se = exp2(float(E)), sc = 1.0;
  if (!scaled) {
    dc = dcm * exp2(float(ec));
    pc = pcm * exp2(float(ec));
  }
  int m = 0;
  bool esc = false;
  float zz = 0.0;
  for (int i = 0; i < 100000; i++) {
    if (i >= uMaxit) break;
    vec2 Z = refAt(m);
    if (scaled) {
      // dz and D carried as mantissas of 2^E; dz is negligible next to Z here
      D = 2.0 * cmul(Z, D) + vec2(pcm * sc, 0.0);
      dz = 2.0 * cmul(Z, dz) + se * cmul(dz, dz) + dcm * sc;
      m++;
      if (max(max(abs(dz.x), abs(dz.y)), max(abs(D.x), abs(D.y))) > 65536.0) {
        dz *= 1.0 / 65536.0;
        D *= 1.0 / 65536.0;
        E += 16;
        se = exp2(float(E));
        sc = exp2(float(ec - E));
      }
      if (E <= -100 && m < uRefLen - 1) {
        z = refAt(m);
        zz = dot(z, z);
        if (zz > 1.0e6) { esc = true; break; }
        continue;
      }
      dz *= se;
      D *= se;
      dc = dcm * exp2(float(ec));
      pc = pcm * exp2(float(ec));
      scaled = false;
    } else {
      z = Z + dz;
      D = 2.0 * cmul(z, D) + vec2(pc, 0.0);
      dz = 2.0 * cmul(Z, dz) + cmul(dz, dz) + dc;
      m++;
    }
    z = refAt(m) + dz;
    zz = dot(z, z);
    if (zz > 1.0e6) { esc = true; break; }
    if (zz < dot(dz, dz) || m >= uRefLen - 1) { dz = z; m = 0; }
  }
  float g = 18.0;
  if (esc) {
    float az = sqrt(zz);
    if (scaled) D *= se;
    // scale before squaring (float max 3.4e38)
    float dm = max(max(abs(D.x), abs(D.y)), 1.0e-30);
    float d = az * log(az) / (dm * length(D / dm));
    float t = max(0.0, 1.0 - log2(1.0 + d) / 7.0);
    g = 6.0 + 240.0 * t * t * t;
  }
  o = vec4(vec3(g / 255.0), 1.0);
}`;

  function shader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  let prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  } catch (e) {
    fail("Shader-Fehler: " + e.message);
    return;
  }
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = {};
  for (const n of ["uRef", "uRefLen", "uMaxit", "uRes", "uMode", "uU0", "uInvS2", "uKI", "uEI", "uKO", "uEO", "uH", "uVn", "uEps", "uE", "uA", "uD0I", "uD0O"]) U[n] = gl.getUniformLocation(prog, n);
  const tex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.uniform1i(U.uRef, 0);
  gl.getExtension("EXT_color_buffer_float");

  // reference orbit Z_0 = 0, Z_{m+1} = Z_m^2 + c, exact in fixed point (in doubles while
  // the finest pixel is coarser than 1e-12); stops after escape
  function orbit(cx, cy, maxit, exact) {
    const L = maxit + 2;
    const data = new Float32Array(4096 * Math.ceil(L / 4096) * 2);
    let n = 1;
    if (exact) {
      const s1 = PBn - 1n, d = PBn - 60n, f = 2 ** -60;
      let zx = 0n, zy = 0n;
      for (; n < L; n++) {
        const xx = (zx * zx) >> PBn, yy = (zy * zy) >> PBn;
        zy = ((zx * zy) >> s1) + cy;
        zx = xx - yy + cx;
        const x = Number(zx >> d) * f, y = Number(zy >> d) * f;
        data[2 * n] = x;
        data[2 * n + 1] = y;
        if (x * x + y * y > 1e6) { n++; break; }
      }
    } else {
      const x0 = N(cx), y0 = N(cy);
      let zx = 0, zy = 0;
      for (; n < L; n++) {
        const t = zx * zx - zy * zy + x0;
        zy = 2 * zx * zy + y0;
        zx = t;
        data[2 * n] = zx;
        data[2 * n + 1] = zy;
        if (zx * zx + zy * zy > 1e6) { n++; break; }
      }
    }
    return { cx, cy, data, L: n, maxit, escaped: n < L, PB };
  }
  function useRef(o) {
    ref = o;
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RG32F, 4096, o.data.length / 8192, 0, gl.RG, gl.FLOAT, o.data);
  }

    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const [hx, hy] = toScreen(0, 0);
    // the ring may be tiny, the spot to grab stays finger sized at every zoom
    if (pts.size === 1 && Math.hypot(x - hx, y - hy) <= 30) {
      // zoomed in the point follows the finger exactly; zoomed out it moves as in the start view
      dragging = { id: e.pointerId, x: e.clientX, y: e.clientY, cx: cMx, cy: cMy, k: r * Math.min(sw, fitSw()) };
      if (!lupe.hidden) ausweichen(x, y);
      drawDeko();
    } else if (dragging) {
      dragging = null;
    }
  });
  feld.addEventListener("pointermove", (e) => {
    const p = pts.get(e.pointerId);
    if (!p) return;
    const b = feld.getBoundingClientRect();
    if (dragging && dragging.id === e.pointerId) {
      ziehe(e);
      if (!lupe.hidden) ausweichen(e.clientX - b.left, e.clientY - b.top);
      p.x = e.clientX; p.y = e.clientY;
      return;
    }
    if (pts.size === 1) {
      rubberPan(-(e.clientX - p.x) * sw, (e.clientY - p.y) * sw);
    } else if (pts.size === 2) {
      const [a, c] = [...pts.values()];
      const before = Math.hypot(a.x - c.x, a.y - c.y);
      p.x = e.clientX; p.y = e.clientY;
      const after = Math.hypot(a.x - c.x, a.y - c.y);
      if (before > 0 && after > 0) zoomAt(before / after, (a.x + c.x) / 2 - b.left, (a.y + c.y) / 2 - b.top);
    }
    p.x = e.clientX; p.y = e.clientY;
    request(true);
  });
  const up = (e) => {
    pts.delete(e.pointerId);
    if (dragging && dragging.id === e.pointerId) lasseLos();
    if (!pts.size) springBack();
  };
  // M slides under the fixed mirror: the point under the finger moves with it,
  // out of M only until the circle holds nothing
  function ziehe(e) {
    const [nx, ny, amRand] = bisZumNichts(cMx, cMy,
      dragging.cx - dragging.k * (e.clientX - dragging.x), dragging.cy + dragging.k * (e.clientY - dragging.y));
    // held at the edge, the finger starts over from here: turning back moves the point at once
    if (amRand) Object.assign(dragging, { x: e.clientX, y: e.clientY, cx: nx, cy: ny });
    setC(nx, ny, false);
    showValues();
    request(true);
  }
  function lasseLos() {
    dragging = null;
    if (snapOn) {
      snapC();
      showValues();
    }
    request(false);
  }
  feld.addEventListener("pointerup", up);
  feld.addEventListener("pointercancel", up);
  feld.addEventListener("dblclick", (e) => {
    if (e.target === lupe) return;
    fitView();
    request(false);
  });

  // in the lupe: its middle is the mirror point and moves it, at the lupe's scale;
  // anywhere else the lupe itself is moved by hand. The field underneath stays put
  let lupeZug = null;
  lupe.addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    lupe.setPointerCapture(e.pointerId);
    const lb = lupe.getBoundingClientRect();
    const Lc = lb.width;
    if (Math.hypot(e.clientX - lb.left - Lc / 2, e.clientY - lb.top - Lc / 2) <= 24) {
      dragging = { id: e.pointerId, x: e.clientX, y: e.clientY, cx: cMx, cy: cMy, k: r * LUPE_FIT / Lc };
      drawDeko();
      return;
    }
    lupeZug = { id: e.pointerId, dx: e.clientX - lb.left, dy: e.clientY - lb.top };
  });
  lupe.addEventListener("pointermove", (e) => {
    if (dragging && dragging.id === e.pointerId) {
      e.stopPropagation();
      ziehe(e);
      return;
    }
    if (!lupeZug || lupeZug.id !== e.pointerId) return;
    e.stopPropagation();
    const fb = feld.getBoundingClientRect();
    setLupePos({ x: e.clientX - fb.left - lupeZug.dx, y: e.clientY - fb.top - lupeZug.dy });
  });
  const lupeLos = (e) => {
    if (dragging && dragging.id === e.pointerId) {
      e.stopPropagation();
      lasseLos();
      return;
    }
    if (!lupeZug || lupeZug.id !== e.pointerId) return;
    e.stopPropagation();
    lupeZug = null;
    lupeNebenPanel();
  };
  lupe.addEventListener("pointerup", lupeLos);
  lupe.addEventListener("pointercancel", lupeLos);

  // ---- panel (tools/controls.js); code values are the start state the reset returns to ----
  const panel = Controls.createPanel({ position: "left" });
  panel
    .addSlider("r", {
      label: "𝑟", min: 0, max: 4, step: 0.01, decimals: 2, grow: true,
      value: START.r,
      onChange: (v) => {
        r = Math.max(0, Number(v) || 0);
        showValues();
        request(true);
      },
    })
    .addToggle("rasten", {
      label: "einrasten",
      value: true,
      onChange: (on) => {
        snapOn = !!on;
        if (snapOn) snapC();
        showValues();
        request(false);
      },
    })
    .addToggle("lupe", {
      label: "Lupe",
      value: true,
      onChange: (on) => {
        lupeOn = !!on;
        showValues();
        request(false);
      },
    })
    .addButton("ran", { label: "ran zoomen", onClick: ranZoomen })
    .addResetButton({
      // the panel already put r and rasten back; the rest of the start state is the
      // start point in the fitted view, with no trace left in the URL
      afterReset: () => {
        const vorher = { cMx, cMy, r, sw, snapOn, lupeOn, cH, vH, mis, PB, lupePos };
        lupeOn = !!panel.get("lupe");
        setLupePos(null);
        fitView();
        setC(START.c[0], START.c[1], true);
        showValues();
        zeichneJetzt();
        const u = new URL(location.href);
        for (const k of ["c", "r", "w", "s", "rasten", "lupe", "frei"]) u.searchParams.delete(k);
        history.replaceState(history.state, "", u);
        return () => {
          ({ cMx, cMy, r, sw, snapOn, lupeOn, cH, mis } = vorher);
          setLupePos(vorher.lupePos);
          PB = vorher.PB;
          PBn = BigInt(PB);
          ref = null;
          setV(...vorher.vH);
          showValues();
          zeichneJetzt();
        };
      },
    });
  panel.bodyEl.prepend(wert);

  // full-quality frame now, without the delayed saveUrl of request()
  function zeichneJetzt() {
    clearTimeout(idle);
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    quality = 1;
    draw();
  }

  function fitSw() { return (2 * 1.6) / Math.min(cssW, cssH); }
  function fitView() {
    sw = fitSw();
    setV(0n, 0n);
    ensurePB();
  }
  // back to the start view, the mirror point stays: the zoom glides in decades,
  // so 1e50 takes no longer than 1e2
  let ranZug = 0;
  function ranZoomen() {
    cancelAnimationFrame(ranZug);
    const s0 = Math.log(sw), s1 = Math.log(fitSw()), v0 = vH, P0 = PB, t0 = performance.now();
    const dauer = Math.min(900, 250 + 25 * Math.abs(s1 - s0) / Math.LN10);
    const step = (t) => {
      if (pts.size) return;
      const a = Math.min(1, (t - t0) / dauer), e = a < 0.5 ? 4 * a * a * a : 1 - (-2 * a + 2) ** 3 / 2;
      if (a >= 1) {
        fitView();
        request(false);
        return;
      }
      sw = Math.exp(s0 + (s1 - s0) * e);
      ensurePB();
      const F = BigInt(Math.round((1 - e) * 2 ** 40));
      const sh = (b) => (PB > P0 ? b << BigInt(PB - P0) : b >> BigInt(P0 - PB));
      setV(sh(v0[0] * F >> 40n), sh(v0[1] * F >> 40n));
      request(true);
      ranZug = requestAnimationFrame(step);
    };
    ranZug = requestAnimationFrame(step);
  }

  function resize() {
    dpr = Math.min(1.5, window.devicePixelRatio || 1);
    const b = feld.getBoundingClientRect();
    const old = Math.min(cssW, cssH);
    cssW = Math.max(1, b.width);
    cssH = Math.max(1, b.height);
    if (sw > 0) sw *= old / Math.min(cssW, cssH);
    if (lupePos) setLupePos(lupePos);
    request(false);
  }
  // the field also changes size without a window resize (controls.js sets
  // --controls-mobile-occlusion after the panel is built or dragged)
  new ResizeObserver(resize).observe(feld);

  bild.addEventListener("webglcontextlost", (e) => { e.preventDefault(); fail("Grafikkontext verloren, Seite neu laden."); });

  const b0 = feld.getBoundingClientRect();
  cssW = Math.max(1, b0.width);
  cssH = Math.max(1, b0.height);
  dpr = Math.min(1.5, window.devicePixelRatio || 1);
  fitView();
  // URL > page defaults (control-defaults) > code values; the panel holds the latter two
  r = panel.get("r");
  snapOn = !!panel.get("rasten");
  lupeOn = !!panel.get("lupe");
  setC(cMx, cMy, true);
  loadUrl();
  showValues();
  quality = 1;
  draw();
  saveUrl();
})();
</script>

<!DOCTYPE html>
<html lang="de">
<head>
  <!--#include virtual="/includes/something-in-the-head.html" -->
<meta charset="UTF-8">
<title>gespiegeltes Mandelbrot</title>
<style>
#feld { touch-action: none; cursor: grab; }
#feld:active { cursor: grabbing; }
#feld canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
#deko { pointer-events: none; }

#wert {
  margin: 0 0 0.3rem;
  text-align: center;
  font-family: var(--font-libertinus-math);
  font-size: 1.125rem;
  line-height: 1.6;
  font-variant-numeric: tabular-nums;
  color: var(--text-color);
  white-space: nowrap;
  text-shadow: none;
}
.ctrl-button[aria-pressed="true"] {
  background: var(--text-color);
  color: var(--bg-color);
}

#fehler {
  position: fixed;
  top: 5rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  margin: 0;
  padding: 0.4rem 0.75rem;
  border-radius: 6px;
  background: var(--ui-surface-strong);
  color: #e0a4a4;
  font-size: 0.875rem;
}
#fehler[hidden] { display: none; }

@media (max-width: 420px) {
  #wert { font-size: 1rem; }
}
</style>
</head>
<body>
<div id="feld" class="_018-canvas">
  <canvas id="bild" aria-label="Mandelbrot-Menge, innen echt, außen am Kreis gespiegelt; Spiegelpunkt verschiebbar"></canvas>
  <canvas id="deko" aria-hidden="true"></canvas>
</div>
<p id="wert" aria-live="off"></p>
<p id="fehler" role="alert" hidden></p>
<script>
"use strict";
(() => {
  const feld = document.getElementById("feld");
  const bild = document.getElementById("bild");
  const deko = document.getElementById("deko");
  const dctx = deko.getContext("2d");
  const wert = document.getElementById("wert");
  const fehler = document.getElementById("fehler");

  const fail = (msg) => {
    console.error(msg);
    fehler.textContent = msg;
    fehler.hidden = false;
  };

  // Misiurewicz points from the Forschungsheft, section (g) and (h)
  const PRESETS = [
    { c: [-0.7214150803581202, 0.25918596703287955], r: 1.5 },
    { c: [0.37213770544957649, 0.090398233158172877], r: 2.5 },
    { c: [0, 1], r: 2.5 },
  ];

  // state: mirror point cM, radius r; view in the w-plane: center (vx, vy), sw = w units per CSS pixel.
  // cMx/cMy and vx/vy are double shadows of the exact values cH and vH (fixed point, below)
  let cMx = PRESETS[0].c[0], cMy = PRESETS[0].c[1], r = PRESETS[0].r;
  let vx = 0, vy = 0, sw = 0;
  let snapOn = false;
  let cssW = 1, cssH = 1, dpr = 1, quality = 1;
  // zoom stops where doubles stop: about 290 decades in, 290 out
  const SW_MIN = 1e-290, SW_MAX = 1e290;

  // ---- exact numbers: BigInt fixed point, value = b / 2^PB ----
  // Deep views need the view center and the reference orbit far below double resolution.
  let PB = 128, PBn = 128n;
  const bitLen = (b) => (b < 0n ? -b : b).toString(16).length * 4;
  function ldexp(x, n) {
    while (n > 1000) { x *= 2 ** 1000; n -= 1000; }
    while (n < -1000) { x *= 2 ** -1000; n += 1000; }
    return x * 2 ** n;
  }
  // double -> fixed point (exact)
  function H(x) {
    if (x === 0 || !Number.isFinite(x)) return 0n;
    const e = Math.floor(Math.log2(Math.abs(x))) - 60;
    const m = BigInt(Math.round(ldexp(x, -e)));
    const k = e + PB;
    return k >= 0 ? m << BigInt(k) : m >> BigInt(-k);
  }
  // fixed point -> double, divided by 2^e
  function N(b, e = 0) {
    let k = PB + e;
    const drop = Math.min(k, bitLen(b) - 64);
    if (drop > 0) { b >>= BigInt(drop); k -= drop; }
    return ldexp(Number(b), -k);
  }
  const mul = (a, b) => (a * b) >> PBn;
  // decimal string (also 1.5e-7) -> fixed point
  function fromDec(str) {
    const m = /^\s*([+-]?)(\d*)\.?(\d*)(?:e([+-]?\d+))?\s*$/i.exec(str);
    if (!m || !(m[2] + m[3])) return null;
    const ex = (Number(m[4]) || 0) - m[3].length;
    let b = BigInt(m[2] + m[3]) << PBn;
    b = ex >= 0 ? b * 10n ** BigInt(ex) : b / 10n ** BigInt(-ex);
    return m[1] === "-" ? -b : b;
  }
  // fixed point -> decimal string with n fraction digits
  function toDec(b, n) {
    const neg = b < 0n;
    if (neg) b = -b;
    const ip = b >> PBn;
    const fp = (((b - (ip << PBn)) * 10n ** BigInt(n)) >> PBn).toString().padStart(n, "0").replace(/0+$/, "");
    return (neg ? "-" : "") + ip + (fp ? "." + fp : "");
  }

  let cH = [0n, 0n], vH = [0n, 0n];
  // cM as an exact Misiurewicz point: preperiod k, period p (null when cM is just where the finger left it)
  let mis = null;
  // reference orbit currently in the texture
  let ref = null;

  function setPB(n) {
    if (n === PB) return;
    const sh = (b) => (n > PB ? b << BigInt(n - PB) : b >> BigInt(PB - n));
    cH = cH.map(sh);
    vH = vH.map(sh);
    PB = n;
    PBn = BigInt(n);
    ref = null;
    if (mis) cH = misRefine(cH[0], cH[1], mis.k, mis.p);
  }
  // bits for the finest c-pixel of the current view, plus 64 to spare
  function ensurePB() {
    const half = Math.hypot(cssW, cssH) / 2 * sw;
    const wmax = Math.hypot(vx, vy) + half;
    const pc = Math.max(1e-300, Math.max(r, 1e-9) * sw / Math.max(1, wmax * wmax));
    const need = Math.max(128, Math.ceil((64 + Math.max(0, -Math.log2(pc), -Math.log2(sw))) / 64) * 64);
    if (need > PB || need < PB - 128) setPB(need);
  }
  function setV(hx, hy) {
    vH = [hx, hy];
    vx = N(hx);
    vy = N(hy);
  }
  const panBy = (dx, dy) => setV(vH[0] + H(dx), vH[1] + H(dy));
  // exact: look for the Misiurewicz point this double is the rounding of (presets, URL)
  function setC(x, y, exact) {
    cMx = x;
    cMy = y;
    mis = null;
    cH = [H(x), H(y)];
    if (!exact) return;
    const m = misSearch(x, y, 1e-12 * (1 + Math.hypot(x, y)), 0);
    if (m) {
      mis = { k: m.k, p: m.p };
      cH = misRefine(H(m.c[0]), H(m.c[1]), m.k, m.p);
    }
  }

  // ---- Misiurewicz points: z_{k+p} = z_k for the orbit of 0, k >= 1 ----
  // Only these mirror into a pattern without end; any other point closes up when zoomed out far enough.
  function misNewton(cx, cy, k, p) {
    for (let it = 0; it < 40; it++) {
      let zx = 0, zy = 0, dx = 0, dy = 0, ax = 0, ay = 0, bx = 0, by = 0;
      for (let n = 1; n <= k + p; n++) {
        const t = 2 * (zx * dx - zy * dy) + 1;
        dy = 2 * (zx * dy + zy * dx);
        dx = t;
        const u = zx * zx - zy * zy + cx;
        zy = 2 * zx * zy + cy;
        zx = u;
        if (n === k) { ax = zx; ay = zy; bx = dx; by = dy; }
      }
      const gx = zx - ax, gy = zy - ay, hx = dx - bx, hy = dy - by;
      const h2 = hx * hx + hy * hy;
      if (!(h2 > 0)) return null;
      const sx = (gx * hx + gy * hy) / h2, sy = (gy * hx - gx * hy) / h2;
      cx -= sx;
      cy -= sy;
      if (!(Math.abs(cx) < 4 && Math.abs(cy) < 4)) return null;
      if (Math.hypot(sx, sy) < 1e-14 * (1 + Math.hypot(cx, cy))) return [cx, cy];
    }
    return null;
  }
  // minimal preperiod and period of a root; null for centres (0 on the cycle)
  function misKind(cx, cy, k, p) {
    const zs = [[0, 0]];
    let zx = 0, zy = 0;
    for (let n = 1; n <= k + p; n++) {
      const t = zx * zx - zy * zy + cx;
      zy = 2 * zx * zy + cy;
      zx = t;
      if (Math.hypot(zx, zy) < 1e-7) return null;
      zs.push([zx, zy]);
    }
    for (let kk = 1; kk <= k; kk++)
      for (let pp = 1; pp <= p; pp++)
        if (Math.hypot(zs[kk + pp][0] - zs[kk][0], zs[kk + pp][1] - zs[kk][1]) < 1e-7) return { k: kk, p: pp };
    return null;
  }
  // nearest root found from a (2g+1)^2 grid of starts with spacing tol, k <= 64, p <= 4
  function misSearch(cx, cy, tol, g) {
    let best = null;
    for (let i = -g; i <= g; i++)
      for (let j = -g; j <= g; j++)
        for (let k = 1; k <= 64; k++) {
          for (let p = 1; p <= 4; p++) {
            const c = misNewton(cx + i * tol, cy + j * tol, k, p);
            if (!c) continue;
            const d = Math.hypot(c[0] - cx, c[1] - cy);
            if (best && d >= best.d) continue;
            const kind = misKind(c[0], c[1], k, p);
            if (kind) best = { c, d, ...kind };
          }
          if (best && best.d < tol) break;
        }
    return best && best.d < (g ? Infinity : tol) ? best : null;
  }
  // Newton in fixed point, quadratic from the double root
  function misRefine(cx, cy, k, p) {
    const one = 1n << PBn, s1 = PBn - 1n;
    for (let it = 0; it < 40; it++) {
      let zx = 0n, zy = 0n, dx = 0n, dy = 0n, ax = 0n, ay = 0n, bx = 0n, by = 0n;
      for (let n = 1; n <= k + p; n++) {
        const t = ((zx * dx - zy * dy) >> s1) + one;
        dy = (zx * dy + zy * dx) >> s1;
        dx = t;
        const u = ((zx * zx - zy * zy) >> PBn) + cx;
        zy = ((zx * zy) >> s1) + cy;
        zx = u;
        if (n === k) { ax = zx; ay = zy; bx = dx; by = dy; }
      }
      const gx = zx - ax, gy = zy - ay, hx = dx - bx, hy = dy - by;
      const h2 = (hx * hx + hy * hy) >> PBn;
      if (h2 === 0n) break;
      const sx = ((gx * hx + gy * hy) >> PBn << PBn) / h2, sy = ((gy * hx - gx * hy) >> PBn << PBn) / h2;
      cx -= sx;
      cy -= sy;
      if ((sx < 0n ? -sx : sx) + (sy < 0n ? -sy : sy) < 256n) break;
    }
    return [cx, cy];
  }

  // ---- WebGL ----
  const gl = bild.getContext("webgl2", { antialias: false, preserveDrawingBuffer: true });
  if (!gl) { fail("WebGL 2 fehlt in diesem Browser."); return; }

  const VS = `#version 300 es
in vec2 p;
void main() { gl_Position = vec4(p, 0.0, 1.0); }`;

  // Perturbation around an exact reference orbit (texture), with rebasing (Zhuoran):
  // pixels iterate only dz = z - Z. Inside |w| <= 1: c = cM + r w; outside:
  // c = cM + r / conj(w) (circle inversion, continuous on |w| = 1).
  // Every pixel gets its dc as mantissa * 2^ec. While dz is below float range it is
  // carried the same way (dz = w 2^E, rescaled by 2^16 steps), so depth is not bound
  // by float32; once |dz| > 2^-100 the loop runs on plain floats.
  // Mode 0 (origin in view): reference cM, u = w / s.
  // Mode 1: reference near the view center vc; pixel offsets relative to vc, with
  // D0I / D0O = c(vc) - cRef on the inner / outer branch, done exactly in JS.
  const FS = `#version 300 es
precision highp float;
precision highp int;
uniform sampler2D uRef;
uniform int uRefLen;
uniform int uMaxit;
uniform vec2 uRes;
uniform int uMode;
uniform vec2 uU0;
uniform float uInvS2;
uniform float uKI;
uniform int uEI;
uniform float uKO;
uniform int uEO;
uniform float uH;
uniform vec2 uVn;
uniform float uEps;
uniform vec2 uE;
uniform vec2 uA;
uniform vec2 uD0I;
uniform vec2 uD0O;
out vec4 o;

vec2 cmul(vec2 a, vec2 b) { return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x); }
vec2 cdiv(vec2 a, vec2 b) {
  float m = max(abs(b.x), abs(b.y));
  vec2 bb = b / m;
  return vec2(a.x * bb.x + a.y * bb.y, a.y * bb.x - a.x * bb.y) / (dot(bb, bb) * m);
}
vec2 invConj(vec2 w) {
  float m = max(abs(w.x), abs(w.y));
  vec2 u = w / m;
  return u / (dot(u, u) * m);
}
vec2 refAt(int m) { return texelFetch(uRef, ivec2(m & 4095, m >> 12), 0).rg; }

void main() {
  vec2 p = gl_FragCoord.xy - 0.5 * uRes;
  // dc = dcm 2^ec; pcm 2^ec = |dc/dp|, the size of this pixel in the c-plane
  vec2 dcm;
  float pcm;
  int ec;
  if (uMode == 0) {
    vec2 u = uU0 + p;
    if (dot(u, u) > uInvS2) {
      vec2 iu = invConj(u);
      dcm = uKO * iu;
      pcm = uKO * dot(iu, iu);
      ec = uEO;
    } else {
      dcm = uKI * u;
      pcm = uKI;
      ec = uEI;
    }
  } else {
    // |vc + s p|^2 > 1, divided by s |vc|
    if (uH + 2.0 * dot(uVn, p) + uEps * dot(p, p) > 0.0) {
      vec2 q1 = vec2(1.0, 0.0) + cmul(uE, p);
      vec2 q = cdiv(p, q1);
      dcm = uD0O - cmul(uA, vec2(q.x, -q.y));
      pcm = length(uA) / dot(q1, q1);
      ec = uEO;
    } else {
      dcm = uD0I + uKI * p;
      pcm = uKI;
      ec = uEI;
    }
  }

  // D = dz/dc * |dc/dp|: the derivative in pixels, so neither it nor the pixel size overflows
  vec2 dz = vec2(0.0), D = vec2(0.0), z = vec2(0.0), dc = vec2(0.0);
  float pc = 0.0;
  int E = ec;
  bool scaled = ec < -100;
  float se = exp2(float(E)), sc = 1.0;
  if (!scaled) {
    dc = dcm * exp2(float(ec));
    pc = pcm * exp2(float(ec));
  }
  int m = 0;
  bool esc = false;
  float zz = 0.0;
  for (int i = 0; i < 100000; i++) {
    if (i >= uMaxit) break;
    vec2 Z = refAt(m);
    if (scaled) {
      // dz and D carried as mantissas of 2^E; dz is negligible next to Z here
      D = 2.0 * cmul(Z, D) + vec2(pcm * sc, 0.0);
      dz = 2.0 * cmul(Z, dz) + se * cmul(dz, dz) + dcm * sc;
      m++;
      if (max(max(abs(dz.x), abs(dz.y)), max(abs(D.x), abs(D.y))) > 65536.0) {
        dz *= 1.0 / 65536.0;
        D *= 1.0 / 65536.0;
        E += 16;
        se = exp2(float(E));
        sc = exp2(float(ec - E));
      }
      if (E <= -100 && m < uRefLen - 1) {
        z = refAt(m);
        zz = dot(z, z);
        if (zz > 1.0e6) { esc = true; break; }
        continue;
      }
      dz *= se;
      D *= se;
      dc = dcm * exp2(float(ec));
      pc = pcm * exp2(float(ec));
      scaled = false;
    } else {
      z = Z + dz;
      D = 2.0 * cmul(z, D) + vec2(pc, 0.0);
      dz = 2.0 * cmul(Z, dz) + cmul(dz, dz) + dc;
      m++;
    }
    z = refAt(m) + dz;
    zz = dot(z, z);
    if (zz > 1.0e6) { esc = true; break; }
    if (zz < dot(dz, dz) || m >= uRefLen - 1) { dz = z; m = 0; }
  }
  float g = 18.0;
  if (esc) {
    float az = sqrt(zz);
    if (scaled) D *= se;
    // scale before squaring (float max 3.4e38)
    float dm = max(max(abs(D.x), abs(D.y)), 1.0e-30);
    float d = az * log(az) / (dm * length(D / dm));
    float t = max(0.0, 1.0 - log2(1.0 + d) / 7.0);
    g = 6.0 + 240.0 * t * t * t;
  }
  o = vec4(vec3(g / 255.0), 1.0);
}`;

  function shader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  let prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  } catch (e) {
    fail("Shader-Fehler: " + e.message);
    return;
  }
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = {};
  for (const n of ["uRef", "uRefLen", "uMaxit", "uRes", "uMode", "uU0", "uInvS2", "uKI", "uEI", "uKO", "uEO", "uH", "uVn", "uEps", "uE", "uA", "uD0I", "uD0O"]) U[n] = gl.getUniformLocation(prog, n);
  const tex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.uniform1i(U.uRef, 0);
  gl.getExtension("EXT_color_buffer_float");

  // reference orbit Z_0 = 0, Z_{m+1} = Z_m^2 + c, exact in fixed point (in doubles while
  // the finest pixel is coarser than 1e-12); stops after escape
  function orbit(cx, cy, maxit, exact) {
    const L = maxit + 2;
    const data = new Float32Array(4096 * Math.ceil(L / 4096) * 2);
    let n = 1;
    if (exact) {
      const s1 = PBn - 1n, d = PBn - 60n, f = 2 ** -60;
      let zx = 0n, zy = 0n;
      for (; n < L; n++) {
        const xx = (zx * zx) >> PBn, yy = (zy * zy) >> PBn;
        zy = ((zx * zy) >> s1) + cy;
        zx = xx - yy + cx;
        const x = Number(zx >> d) * f, y = Number(zy >> d) * f;
        data[2 * n] = x;
        data[2 * n + 1] = y;
        if (x * x + y * y > 1e6) { n++; break; }
      }
    } else {
      const x0 = N(cx), y0 = N(cy);
      let zx = 0, zy = 0;
      for (; n < L; n++) {
        const t = zx * zx - zy * zy + x0;
        zy = 2 * zx * zy + y0;
        zx = t;
        data[2 * n] = zx;
        data[2 * n + 1] = zy;
        if (zx * zx + zy * zy > 1e6) { n++; break; }
      }
    }
    return { cx, cy, data, L: n, maxit, escaped: n < L, PB };
  }
  function useRef(o) {
    ref = o;
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RG32F, 4096, o.data.length / 8192, 0, gl.RG, gl.FLOAT, o.data);
  }
  // c of a w-plane point, exact: inner branch cM + r w, outer branch cM + r / conj(w)
  function cIn(wx, wy, rH) { return [cH[0] + mul(rH, wx), cH[1] + mul(rH, wy)]; }
  function cOut(wx, wy, rH) {
    const d2 = (wx * wx + wy * wy) >> PBn;
    if (d2 === 0n) return [cH[0], cH[1]];
    return [cH[0] + mul(rH, (wx << PBn) / d2), cH[1] + mul(rH, (wy << PBn) / d2)];
  }
  // mantissa and exponent of x > 0 (exponent 0 when x >= 1: such scales stay plain floats)
  function split(x) {
    if (!(x < 1)) return [Math.min(x, 3e38), 0];
    const e = Math.floor(Math.log2(x));
    return [ldexp(x, -e), e];
  }
  const f32 = (x) => Math.max(-3e38, Math.min(3e38, x));

  function draw() {
    const W = Math.max(1, Math.round(cssW * dpr * quality));
    const Hc = Math.max(1, Math.round(cssH * dpr * quality));
    if (bild.width !== W || bild.height !== Hc) { bild.width = W; bild.height = Hc; }
    gl.viewport(0, 0, W, Hc);
    ensurePB();
    const s = sw * cssW / W;   // w units per canvas pixel
    const hd = Math.hypot(W, Hc) / 2;

    const half = hd * s;
    const vAbs = Math.hypot(vx, vy);
    const wmax = vAbs + half;
    const pcMin = Math.max(1e-300, r * s / Math.max(1, wmax * wmax));
    const maxit = Math.round(Math.min(50000, Math.max(250, 250 + 45 * Math.log2(1 / pcMin))));
    const exact = pcMin < 1e-12;
    // orbits are computed a bit longer than needed, so zooming reuses them for a while
    const want = (o) => o && o.PB === PB && (o.maxit >= maxit || o.escaped) && (o.L > 2 || o.escaped);
    const longer = Math.min(50000, Math.ceil(maxit * 1.25 / 256) * 256);

    gl.uniform2f(U.uRes, W, Hc);
    gl.uniform1i(U.uMaxit, maxit);
    if (vAbs <= half) {
      // origin in view: reference cM itself, u = w / s in pixels
      if (!want(ref) || ref.mode !== 0 || ref.cx !== cH[0] || ref.cy !== cH[1] || ref.exact !== exact) {
        const o = orbit(cH[0], cH[1], longer, exact);
        o.mode = 0;
        o.exact = exact;
        useRef(o);
      }
      const [kI, eI] = split(r * s), [kO, eO] = split(r / s);
      gl.uniform1i(U.uMode, 0);
      gl.uniform2f(U.uU0, vx / s, vy / s);
      gl.uniform1f(U.uInvS2, f32(1 / (s * s)));
      gl.uniform1f(U.uKI, kI);
      gl.uniform1i(U.uEI, eI);
      gl.uniform1f(U.uKO, kO);
      gl.uniform1i(U.uEO, eO);
    } else {
      // view center away from the origin: everything relative to vc, exact where it cancels
      const vcOut = vAbs > 1;
      const rH = H(r);
      const ci = cIn(vH[0], vH[1], rH), co = cOut(vH[0], vH[1], rH);
      const target = vcOut ? co : ci;
      const lrs = Math.log2(r * s), lv = Math.log2(vAbs);
      const eb = Math.floor(lrs - (vcOut ? 2 * lv : 0));
      const kI = f32(2 ** (lrs - eb)), aM = 2 ** (lrs - 2 * lv - eb);
      const vnx = vx / vAbs, vny = vy / vAbs;
      const scale = vcOut ? aM : kI;
      const far = (o) => Math.hypot(N(target[0] - o.cx, eb), N(target[1] - o.cy, eb)) / scale > 64 * hd;
      if (!want(ref) || ref.mode !== 1 || ref.exact !== exact || far(ref)) {
        let o = orbit(target[0], target[1], longer, exact);
        // an orbit that escapes early leaves later pixels without reference:
        // take the longest of a few points around the view instead
        for (let k = 0; o.escaped && o.L < maxit && k < 8; k++) {
          const a = k * Math.PI / 4, dx = H(0.5 * half * Math.cos(a)), dy = H(0.5 * half * Math.sin(a));
          const wx = vH[0] + dx, wy = vH[1] + dy;
          const c = N((wx * wx + wy * wy) >> PBn) > 1 ? cOut(wx, wy, rH) : cIn(wx, wy, rH);
          const q = orbit(c[0], c[1], longer, exact);
          if (q.L > o.L) o = q;
        }
        o.mode = 1;
        o.exact = exact;
        useRef(o);
      }
      const h = (vH[0] * vH[0] + vH[1] * vH[1] >> PBn) - (1n << PBn);
      gl.uniform1i(U.uMode, 1);
      gl.uniform1f(U.uH, f32(N(h) / (s * vAbs)));
      gl.uniform2f(U.uVn, vnx, vny);
      gl.uniform1f(U.uEps, s / vAbs);
      gl.uniform2f(U.uE, s / vAbs * vnx, -s / vAbs * vny);
      gl.uniform2f(U.uA, aM * (vnx * vnx - vny * vny), aM * 2 * vnx * vny);
      gl.uniform1f(U.uKI, kI);
      gl.uniform1i(U.uEI, eb);
      gl.uniform1i(U.uEO, eb);
      gl.uniform2f(U.uD0I, f32(N(ci[0] - ref.cx, eb)), f32(N(ci[1] - ref.cy, eb)));
      gl.uniform2f(U.uD0O, f32(N(co[0] - ref.cx, eb)), f32(N(co[1] - ref.cy, eb)));
    }
    gl.uniform1i(U.uRefLen, ref.L);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    drawDeko();
  }

  // w -> CSS pixel
  const toScreen = (wx, wy) => [cssW / 2 + (wx - vx) / sw, cssH / 2 - (wy - vy) / sw];
  const toW = (x, y) => [vx + (x - cssW / 2) * sw, vy - (y - cssH / 2) * sw];

  function drawDeko() {
    deko.width = Math.round(cssW * dpr);
    deko.height = Math.round(cssH * dpr);
    dctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const [ox, oy] = toScreen(0, 0);
    const rad = 1 / sw;
    if (rad > 4 && rad < 1e6) {
      dctx.beginPath();
      dctx.arc(ox, oy, rad, 0, 2 * Math.PI);
      dctx.lineWidth = 1;
      dctx.strokeStyle = "rgba(255, 255, 255, 0.28)";
      dctx.stroke();
    }
    dctx.beginPath();
    dctx.arc(ox, oy, 11, 0, 2 * Math.PI);
    dctx.lineWidth = 2;
    dctx.strokeStyle = dragging ? "rgba(255, 255, 255, 1)" : "rgba(255, 255, 255, 0.85)";
    dctx.stroke();
    dctx.beginPath();
    dctx.arc(ox, oy, 2, 0, 2 * Math.PI);
    dctx.fillStyle = "rgba(255, 255, 255, 0.85)";
    dctx.fill();
  }

  // ---- scheduling: low resolution while moving, full resolution when idle ----
  let raf = 0, idle = 0;
  function request(moving) {
    if (moving) quality = 0.5;
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); });
    clearTimeout(idle);
    idle = setTimeout(() => { quality = 1; draw(); saveUrl(); }, moving ? 160 : 0);
  }

  // ---- readout and URL ----
  const fmt = (x, n) => (x < 0 ? "−" : "") + Math.abs(x).toFixed(n).replace(".", ",");
  function showValues() {
    wert.textContent = `𝑐 = ${fmt(cMx, 6)} ${cMy < 0 ? "−" : "+"} ${fmt(Math.abs(cMy), 6)} 𝑖`;
    if (panel.get("r") !== r) panel.set("r", r);
    if (panel.get("rasten") !== snapOn) panel.set("rasten", snapOn);
    const i = PRESETS.findIndex((p) => p.c[0] === cMx && p.c[1] === cMy && p.r === r);
    panel.bodyEl.querySelectorAll("[data-button-key]").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.buttonKey === i)));
  }
  function saveUrl() {
    const u = new URL(location.href);
    u.searchParams.set("c", cMx + "," + cMy);
    u.searchParams.set("r", String(r));
    // deep views need more digits than a double has
    const dig = Math.ceil(-Math.log10(sw)) + 6;
    u.searchParams.set("w", sw < 1e-10 ? toDec(vH[0], dig) + "," + toDec(vH[1], dig) : vx + "," + vy);
    u.searchParams.set("s", String(sw));
    u.searchParams.delete("frei");
    if (snapOn) u.searchParams.set("rasten", "1"); else u.searchParams.delete("rasten");
    history.replaceState(null, "", u);
  }
  function loadUrl() {
    const q = new URL(location.href).searchParams;
    const pair = (k) => {
      const v = (q.get(k) || "").split(",").map(Number);
      return v.length === 2 && v.every(Number.isFinite) ? v : null;
    };
    const c = pair("c"), w = pair("w");
    const rr = Number(q.get("r")), ss = Number(q.get("s"));
    if (rr > 0 && Number.isFinite(rr)) r = rr;
    if (ss > 0 && Number.isFinite(ss)) sw = Math.min(SW_MAX, Math.max(SW_MIN, ss));
    if (w) {
      vx = w[0];
      vy = w[1];
      ensurePB();
      const [a, b] = q.get("w").split(",").map(fromDec);
      setV(a ?? H(w[0]), b ?? H(w[1]));
    }
    ensurePB();
    if (c) setC(c[0], c[1], true);
    snapOn = q.get("rasten") === "1";
  }

  // ---- snap to the boundary of M (doubles) ----
  function probe(cx, cy) {
    let zx = 0, zy = 0, dx = 0, dy = 0;
    for (let n = 0; n < 20000; n++) {
      const ndx = 2 * (zx * dx - zy * dy) + 1;
      dy = 2 * (zx * dy + zy * dx);
      dx = ndx;
      const t = zx * zx - zy * zy + cx;
      zy = 2 * zx * zy + cy;
      zx = t;
      const a = zx * zx + zy * zy;
      if (a > 1e12) {
        const az = Math.sqrt(a), ad = Math.hypot(dx, dy);
        // direction of growing potential: conj(dz / z)
        const qx = (dx * zx + dy * zy) / a, qy = -(dy * zx - dx * zy) / a;
        const qa = Math.hypot(qx, qy);
        return { d: az * Math.log(az) / ad, gx: qx / qa, gy: qy / qa };
      }
    }
    return null;
  }
  function snap(cx, cy, tol) {
    let p = probe(cx, cy);
    if (!p) {
      search:
      for (let rho = tol; rho < 4; rho *= 1.5) {
        for (let k = 0; k < 48; k++) {
          const a = (k / 48) * 2 * Math.PI;
          const q = probe(cx + rho * Math.cos(a), cy + rho * Math.sin(a));
          if (q) { cx += rho * Math.cos(a); cy += rho * Math.sin(a); p = q; break search; }
        }
      }
      if (!p) return [cx, cy];
    }
    for (let i = 0; i < 400 && p.d > tol; i++) {
      const nx = cx - p.d * p.gx, ny = cy - p.d * p.gy;
      const q = probe(nx, ny);
      if (!q) {
        // stepped into M: bisect between the last outside point and this one
        let ax = cx, ay = cy, bx = nx, by = ny;
        for (let j = 0; j < 60 && Math.hypot(bx - ax, by - ay) > tol; j++) {
          const mx = (ax + bx) / 2, my = (ay + by) / 2;
          if (probe(mx, my)) { ax = mx; ay = my; } else { bx = mx; by = my; }
        }
        return [ax, ay];
      }
      cx = nx; cy = ny; p = q;
    }
    return [cx, cy];
  }

  // after the boundary snap: the nearest Misiurewicz point, if close, so the
  // mirror point is exact and the pattern outside goes on without end
  function snapC() {
    const tol = Math.max(1e-15, r * sw);
    const [x, y] = snap(cMx, cMy, tol * 0.25);
    const m = misSearch(x, y, tol, 2);
    setC(x, y, false);
    if (m && m.d < 8 * tol) {
      setC(m.c[0], m.c[1], false);
      mis = { k: m.k, p: m.p };
      cH = misRefine(H(m.c[0]), H(m.c[1]), m.k, m.p);
    }
  }

  // ---- input ----
  const pts = new Map();
  let dragging = null;

  function zoomAt(f, x, y) {
    const old = sw;
    sw = Math.min(SW_MAX, Math.max(SW_MIN, sw * f));
    ensurePB();
    panBy((x - cssW / 2) * (old - sw), -(y - cssH / 2) * (old - sw));
  }

  // Far out everything lies near the origin. Beyond |v| = L (half the view) the view
  // goes stiff the further it gets, and springs back on release: the origin stays in reach.
  const reach = () => Math.min(cssW, cssH) / 2 * sw;
  function rubberPan(dx, dy) {
    const L = reach(), o = Math.hypot(vx, vy);
    if (L <= 1 || Math.hypot(vx + dx, vy + dy) <= Math.max(o, L)) return panBy(dx, dy);
    const k = (1 - Math.min(1, Math.max(0, o - L) / (0.5 * L))) ** 2;
    panBy(dx * k, dy * k);
  }
  function springBack() {
    const L = reach(), n = Math.hypot(vx, vy);
    if (L <= 1 || n <= L) return;
    const fx = vx, fy = vy, t0 = performance.now();
    const step = (t) => {
      if (pts.size) return;
      const a = Math.min(1, (t - t0) / 200), f = 1 - (1 - L / n) * (1 - (1 - a) ** 3);
      setV(H(fx * f), H(fy * f));
      request(a < 1);
      if (a < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  feld.addEventListener("wheel", (e) => {
    e.preventDefault();
    const b = feld.getBoundingClientRect();
    zoomAt(Math.exp(e.deltaY * 0.0015), e.clientX - b.left, e.clientY - b.top);
    request(true);
  }, { passive: false });

  feld.addEventListener("pointerdown", (e) => {
    feld.setPointerCapture(e.pointerId);
    const b = feld.getBoundingClientRect();
    const x = e.clientX - b.left, y = e.clientY - b.top;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const [hx, hy] = toScreen(0, 0);
    if (pts.size === 1 && Math.hypot(x - hx, y - hy) <= 30) {
      dragging = { id: e.pointerId, x: e.clientX, y: e.clientY, cx: cMx, cy: cMy };
      drawDeko();
    } else if (dragging) {
      dragging = null;
    }
  });
  feld.addEventListener("pointermove", (e) => {
    const p = pts.get(e.pointerId);
    if (!p) return;
    const b = feld.getBoundingClientRect();
    if (dragging && dragging.id === e.pointerId) {
      // M slides under the fixed mirror: the point under the finger moves with it
      setC(dragging.cx - r * (e.clientX - dragging.x) * sw, dragging.cy + r * (e.clientY - dragging.y) * sw, false);
      p.x = e.clientX; p.y = e.clientY;
      showValues();
      request(true);
      return;
    }
    if (pts.size === 1) {
      rubberPan(-(e.clientX - p.x) * sw, (e.clientY - p.y) * sw);
    } else if (pts.size === 2) {
      const [a, c] = [...pts.values()];
      const before = Math.hypot(a.x - c.x, a.y - c.y);
      p.x = e.clientX; p.y = e.clientY;
      const after = Math.hypot(a.x - c.x, a.y - c.y);
      if (before > 0 && after > 0) zoomAt(before / after, (a.x + c.x) / 2 - b.left, (a.y + c.y) / 2 - b.top);
    }
    p.x = e.clientX; p.y = e.clientY;
    request(true);
  });
  const up = (e) => {
    pts.delete(e.pointerId);
    if (dragging && dragging.id === e.pointerId) {
      dragging = null;
      if (snapOn) {
        snapC();
        showValues();
      }
      request(false);
    }
    if (!pts.size) springBack();
  };
  feld.addEventListener("pointerup", up);
  feld.addEventListener("pointercancel", up);
  feld.addEventListener("dblclick", () => { fitView(); request(false); });

  // ---- panel (tools/controls.js); code values are the start state the reset returns to ----
  const panel = Controls.createPanel({ position: "left" });
  panel
    .addButtonGroup("spiegelpunkte", {
      buttons: ["Seepferdchen", "Elefanten", "𝑐 = 𝑖"].map((label, i) => ({
        key: String(i),
        label,
        onClick: () => {
          const p = PRESETS[i];
          r = p.r;
          setC(p.c[0], p.c[1], true);
          fitView();
          showValues();
          request(false);
        },
      })),
    })
    .addSlider("r", {
      label: "𝑟", min: 0, max: 4, step: 0.01, decimals: 2, grow: true,
      value: PRESETS[0].r,
      onChange: (v) => {
        r = Math.max(0, Number(v) || 0);
        showValues();
        request(true);
      },
    })
    .addToggle("rasten", {
      label: "einrasten",
      value: false,
      onChange: (on) => {
        snapOn = !!on;
        if (snapOn) snapC();
        showValues();
        request(false);
      },
    })
    .addResetButton({
      // the panel already put r and rasten back; the rest of the start state is the
      // first preset in the fitted view, with no trace left in the URL
      afterReset: () => {
        const vorher = { cMx, cMy, r, sw, snapOn, cH, vH, mis, PB };
        fitView();
        setC(PRESETS[0].c[0], PRESETS[0].c[1], true);
        showValues();
        zeichneJetzt();
        const u = new URL(location.href);
        for (const k of ["c", "r", "w", "s", "rasten", "frei"]) u.searchParams.delete(k);
        history.replaceState(history.state, "", u);
        return () => {
          ({ cMx, cMy, r, sw, snapOn, cH, mis } = vorher);
          PB = vorher.PB;
          PBn = BigInt(PB);
          ref = null;
          setV(...vorher.vH);
          showValues();
          zeichneJetzt();
        };
      },
    });
  panel.bodyEl.prepend(wert);

  // full-quality frame now, without the delayed saveUrl of request()
  function zeichneJetzt() {
    clearTimeout(idle);
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    quality = 1;
    draw();
  }

  function fitView() {
    sw = (2 * 1.6) / Math.min(cssW, cssH);
    setV(0n, 0n);
    ensurePB();
  }

  function resize() {
    dpr = Math.min(1.5, window.devicePixelRatio || 1);
    const b = feld.getBoundingClientRect();
    const old = Math.min(cssW, cssH);
    cssW = Math.max(1, b.width);
    cssH = Math.max(1, b.height);
    if (sw > 0) sw *= old / Math.min(cssW, cssH);
    request(false);
  }
  // the field also changes size without a window resize (controls.js sets
  // --controls-mobile-occlusion after the panel is built or dragged)
  new ResizeObserver(resize).observe(feld);

  bild.addEventListener("webglcontextlost", (e) => { e.preventDefault(); fail("Grafikkontext verloren, Seite neu laden."); });

  const b0 = feld.getBoundingClientRect();
  cssW = Math.max(1, b0.width);
  cssH = Math.max(1, b0.height);
  dpr = Math.min(1.5, window.devicePixelRatio || 1);
  fitView();
  // URL > page defaults (control-defaults) > code values; the panel holds the latter two
  r = panel.get("r");
  snapOn = !!panel.get("rasten");
  setC(cMx, cMy, true);
  loadUrl();
  showValues();
  quality = 1;
  draw();
  saveUrl();
})();
</script>

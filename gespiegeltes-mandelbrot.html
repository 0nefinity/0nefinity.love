<!DOCTYPE html>
<html lang="de">
<head>
  <!--#include virtual="/includes/something-in-the-head.html" -->
<meta charset="UTF-8">
<title>gespiegeltes Mandelbrot</title>
<style>
html, body { touch-action: pan-x pan-y; }
#feld { touch-action: none; cursor: grab; }
#feld:active { cursor: grabbing; }
#feld canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
#feld #lupe {
  inset: auto;
  /* below the menu and back buttons in the top corners */
  top: 64px;
  right: 12px;
  width: 132px;
  height: 132px;
  border-radius: 50%;
  border: 1px solid var(--text-color);
  background: var(--bg-color);
  touch-action: none;
  cursor: grab;
}
#feld #lupe:active { cursor: grabbing; }
#feld #lupe.links { right: auto; left: 12px; }
#feld #lupe[hidden] { display: none; }

#wert {
  margin: 0 0 0.3rem;
  text-align: center;
  font-family: var(--font-libertinus-math);
  font-size: 1.125rem;
  line-height: 1.6;
  font-variant-numeric: tabular-nums;
  color: var(--text-color);
  white-space: nowrap;
  text-shadow: none;
}

#fehler {
  position: fixed;
  top: 5rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  margin: 0;
  padding: 0.4rem 0.75rem;
  border-radius: 6px;
  background: var(--ui-surface-strong);
  color: #e0a4a4;
  font-size: 0.875rem;
}
#fehler[hidden] { display: none; }

@media (max-width: 420px) {
  #wert { font-size: 1rem; }
}
/* the speed slider has no label: its track takes the whole width of the panel */
.ctrl-panel:not(.bar-mode) .ctrl-row[data-key="tempo"] { grid-template-columns: minmax(0, 1fr); }
.ctrl-row[data-key="tempo"] .ctrl-label { display: none; }
/* the number beside the track keeps one width (controls.js sizes it to the digits shown, and the track would breathe with every digit) */
.ctrl-panel:not(.bar-mode) .ctrl-row[data-key="tempo"] .ctrl-slider-group { grid-column: 1; }
</style>
</head>
<body>
<div id="feld" class="_018-canvas">
  <canvas id="bild" aria-label="Mandelbrot-Menge, innen echt, außen am Kreis gespiegelt; Spiegelpunkt verschiebbar"></canvas>
  <canvas id="lupe" aria-hidden="true" hidden></canvas>
</div>
<p id="wert" aria-live="off"></p>
<p id="fehler" role="alert" hidden></p>
<script src="/tools/workers/gespiegeltes-mandelbrot-bahn.js"></script>
<script>
"use strict";
(() => {
  const feld = document.getElementById("feld");
  const bild = document.getElementById("bild");
  const lupe = document.getElementById("lupe");
  const lctx = lupe.getContext("2d");
  const wert = document.getElementById("wert");
  const fehler = document.getElementById("fehler");

  const fail = (msg) => {
    console.error(msg);
    fehler.textContent = msg;
    fehler.hidden = false;
  };

  // the start: a Misiurewicz point from the Forschungsheft, section (h)
  // Further mirrors from Forschungsheft (i), chosen by URL only: ?spiegel=a2 | b1 | c2.
  // Without it kind stays 0 and nothing below this line changes (the shader is the same text).
  const KINDS = { a2: 2, b1: 3, c2: 4 };
  const SPIEGEL = new URLSearchParams(location.search).get("spiegel");
  const kind = SPIEGEL ? KINDS[SPIEGEL] || 0 : 0;
  if (SPIEGEL && !kind) console.error("spiegel: unbekannter Wert " + SPIEGEL);
  const START = kind === 2 ? { c: [-0.75, 0], r: 1.2 }
    : kind === 3 ? { c: [0.37458872600429492, 0.08835724479480638], r: 0.0045 }
    : kind === 4 ? { c: [0, 1], r: 0.05 }
    : { c: [-0.7214150803581202, 0.25918596703287955], r: 1.5 };

  // state: mirror point cM, radius r; view in the w-plane: center vH (exact, below), scale ls.
  // cMx/cMy are double shadows of the exact cH. The view center is known as log2|v| (lv)
  // and direction (vnx, vny), so far out, where |v| is no double any more, nothing overflows.
  let cMx = START.c[0], cMy = START.c[1], r = START.r;
  let lv = -Infinity, vnx = 0, vny = 0;
  // ls = log2(sw), sw = w units per CSS pixel. The zoom lives in ls: here the 1 is the 0,
  // and 0 and ∞ are the two ends of the same line, both out of reach, neither a wall.
  // sw itself is only a shadow and may round to 0 or ∞.
  let ls = NaN, sw = NaN;
  const setS = (l) => { ls = l; sw = 2 ** l; };
  let snapOn = true;
  let cssW = 1, cssH = 1, dpr = 1;

  // ---- exact numbers: BigInt fixed point, value = b / 2^PB ----
  // Deep views need the view center and the reference orbit far below double resolution.
  let PB = 128, PBn = 128n;
  const bitLen = (b) => (b < 0n ? -b : b).toString(16).length * 4;
  function ldexp(x, n) {
    while (n > 1000) { x *= 2 ** 1000; n -= 1000; }
    while (n < -1000) { x *= 2 ** -1000; n += 1000; }
    return x * 2 ** n;
  }
  // double times 2^sh -> fixed point (exact)
  function H(x, sh = 0) {
    if (x === 0 || !Number.isFinite(x)) return 0n;
    const e = Math.floor(Math.log2(Math.abs(x))) - 60;
    const m = BigInt(Math.round(ldexp(x, -e)));
    const k = e + PB + sh;
    return k >= 0 ? m << BigInt(k) : m >> BigInt(-k);
  }
  // x 2^l -> fixed point, l need not be whole
  const Hl = (x, l) => { const li = Math.floor(l); return H(x * 2 ** (l - li), li); };
  // fixed point -> double, divided by 2^e (e need not be whole); 0 or ±∞ where doubles end
  function N(b, e = 0) {
    if (b === 0n) return 0;
    const drop = Math.max(0, bitLen(b) - 64);
    return ldexp(Number(drop ? b >> BigInt(drop) : b), drop - PB - e);
  }
  // log2 |b|, for any size
  function lg2(b) {
    if (b === 0n) return -Infinity;
    if (b < 0n) b = -b;
    const drop = Math.max(0, bitLen(b) - 64);
    return Math.log2(Number(b >> BigInt(drop))) + drop - PB;
  }
  const logadd = (a, b) => {
    const m = Math.max(a, b);
    return m === -Infinity ? m : m + Math.log2(2 ** (a - m) + 2 ** (b - m));
  };
  // b from fixed point with `from` bits to the current PB
  const zuPB = (b, from) => (PB >= from ? b << BigInt(PB - from) : b >> BigInt(from - PB));
  const mul = (a, b) => (a * b) >> PBn;
  // decimal string (also 1.5e-7) -> fixed point
  function fromDec(str) {
    const m = /^\s*([+-]?)(\d*)\.?(\d*)(?:e([+-]?\d+))?\s*$/i.exec(str);
    if (!m || !(m[2] + m[3])) return null;
    const ex = (Number(m[4]) || 0) - m[3].length;
    let b = BigInt(m[2] + m[3]) << PBn;
    b = ex >= 0 ? b * 10n ** BigInt(ex) : b / 10n ** BigInt(-ex);
    return m[1] === "-" ? -b : b;
  }
  // fixed point -> decimal string with n fraction digits
  function toDec(b, n) {
    const neg = b < 0n;
    if (neg) b = -b;
    const ip = b >> PBn;
    const fp = (((b - (ip << PBn)) * 10n ** BigInt(n)) >> PBn).toString().padStart(n, "0").replace(/0+$/, "");
    return (neg ? "-" : "") + ip + (fp ? "." + fp : "");
  }
  // fixed point (|b| >= 1) -> decimal with n significant digits, exponent of any size
  function toSci(b, n) {
    const neg = b < 0n;
    if (neg) b = -b;
    const ip = (b >> PBn).toString(), fp = ip.slice(1, n).replace(/0+$/, "");
    return (neg ? "-" : "") + ip[0] + (fp ? "." + fp : "") + "e" + (ip.length - 1);
  }

  let cH = [0n, 0n], vH = [0n, 0n];
  // cM as an exact Misiurewicz point: preperiod k, period p (null when cM is just where the finger left it)
  let mis = null;

  // Fewer bits cut the centre (and c) off at the new width. Zoomed back in, those bits are
  // what the view stood on: out and in again must land on the same spot. So the values from
  // before the cut are kept while the centre (c) is still the cut version of them, and put
  // back when the width grows again.
  let verlust = null;
  const schnitt = (b, von, auf) => (auf > von ? b << BigInt(auf - von) : b >> BigInt(von - auf));
  function setPB(n) {
    if (n === PB) return;
    const sh = (b) => schnitt(b, PB, n);
    let nv = vH.map(sh), nc = cH.map(sh);
    if (n < PB) {
      const treu = verlust && vH.every((b, i) => b === schnitt(verlust.vH[i], verlust.PB, PB))
        && (mis || cH.every((b, i) => b === schnitt(verlust.cH[i], verlust.PB, PB)));
      if (!treu) verlust = { PB, vH, cH };
    } else if (verlust) {
      const vP = verlust.PB;
      if (vH.every((b, i) => b === schnitt(verlust.vH[i], vP, PB))) nv = verlust.vH.map((b) => schnitt(b, vP, n));
      if (!mis && cH.every((b, i) => b === schnitt(verlust.cH[i], vP, PB))) nc = verlust.cH.map((b) => schnitt(b, vP, n));
      if (n >= vP) verlust = null;
    }
    vH = nv;
    cH = nc;
    PB = n;
    PBn = BigInt(n);
    if (mis) cH = misRefine(cH[0], cH[1], mis.k, mis.p) || cH;
  }
  // bits for the finest c-pixel of the current view, plus 64 to spare
  function ensurePB() {
    const lw = logadd(lv, Math.log2(Math.hypot(cssW, cssH) / 2) + ls);
    const lpc = Math.log2(Math.max(r, 1e-9)) + ls - (kind ? 0 : 2 * Math.max(0, lw));
    const need = Math.max(128, Math.ceil((64 + Math.max(0, -lpc, -ls)) / 64) * 64);
    if (need > PB || need < PB - 128) setPB(need);
  }
  function setV(hx, hy) {
    vH = [hx, hy];
    const lx = lg2(hx), ly = lg2(hy), m = Math.max(lx, ly);
    if (m === -Infinity) { lv = -Infinity; vnx = vny = 0; return; }
    const ax = 2 ** (lx - m), ay = 2 ** (ly - m), h = Math.hypot(ax, ay);
    lv = m + Math.log2(h);
    vnx = (hx < 0n ? -ax : ax) / h;
    vny = (hy < 0n ? -ay : ay) / h;
  }
  // move the view by (px, py) CSS pixels, y up
  const panPx = (px, py) => setV(vH[0] + Hl(px, ls), vH[1] + Hl(py, ls));
  // exact: look for the Misiurewicz point this double is the rounding of (start, URL)
  function setC(x, y, exact) {
    cMx = x;
    cMy = y;
    mis = null;
    cGenau = false;
    cH = [H(x), H(y)];
    if (!exact) return;
    const m = misFind(x, y, 1e-12 * (1 + Math.hypot(x, y)));
    if (m) {
      mis = { k: m.k, p: m.p };
      cH = m.e;
    }
  }

  // c exactly at h, below what a double resolves (dragged deep down); m: Misiurewicz point
  let cGenau = false;
  function setCH(h, m) {
    cH = h;
    mis = m;
    cMx = N(h[0]);
    cMy = N(h[1]);
    cGenau = true;
  }

  // ---- Misiurewicz points: z_{k+p} = z_k for the orbit of 0, k >= 1 ----
  // Only these mirror into a pattern without end; any other point closes up when zoomed out far enough.
  function misNewton(cx, cy, k, p) {
    for (let it = 0; it < 40; it++) {
      let zx = 0, zy = 0, dx = 0, dy = 0, ax = 0, ay = 0, bx = 0, by = 0;
      for (let n = 1; n <= k + p; n++) {
        const t = 2 * (zx * dx - zy * dy) + 1;
        dy = 2 * (zx * dy + zy * dx);
        dx = t;
        const u = zx * zx - zy * zy + cx;
        zy = 2 * zx * zy + cy;
        zx = u;
        if (n === k) { ax = zx; ay = zy; bx = dx; by = dy; }
      }
      const gx = zx - ax, gy = zy - ay, hx = dx - bx, hy = dy - by;
      const h2 = hx * hx + hy * hy;
      if (!(h2 > 0)) return null;
      const sx = (gx * hx + gy * hy) / h2, sy = (gy * hx - gx * hy) / h2;
      cx -= sx;
      cy -= sy;
      if (!(Math.abs(cx) < 4 && Math.abs(cy) < 4)) return null;
      if (Math.hypot(sx, sy) < 1e-14 * (1 + Math.hypot(cx, cy))) return [cx, cy];
    }
    return null;
  }
  // pairs (k, p) whose Newton step from c is shorter than R: near c lies a root of
  // z_{k+p} = z_k about that far away. Smallest k first.
  function misCandidates(cx, cy, R) {
    const zs = [], ds = [];
    let zx = 0, zy = 0, dx = 0, dy = 0;
    for (let n = 1; n <= 2000; n++) {
      const t = 2 * (zx * dx - zy * dy) + 1;
      dy = 2 * (zx * dy + zy * dx);
      dx = t;
      const u = zx * zx - zy * zy + cx;
      zy = 2 * zx * zy + cy;
      zx = u;
      if (!(zx * zx + zy * zy < 1e6 && Math.abs(dx) + Math.abs(dy) < 1e150)) break;
      zs.push(zx, zy);
      ds.push(dx, dy);
    }
    const L = zs.length / 2, out = [];
    for (let k = 1; k < L; k++)
      for (let p = 1; p <= 8 && k + p <= L; p++) {
        const i = 2 * (k - 1), j = 2 * (k + p - 1);
        const gx = zs[j] - zs[i], gy = zs[j + 1] - zs[i + 1], hx = ds[j] - ds[i], hy = ds[j + 1] - ds[i + 1];
        const h2 = hx * hx + hy * hy;
        if (h2 > 0 && (gx * gx + gy * gy) / h2 < R * R) out.push({ k, p });
      }
    return out;
  }
  const ab = (b) => (b < 0n ? -b : b);
  // exact check of a refined root: the next Newton step is below half the working
  // precision, and the cycle repels (a centre has 0 on its cycle and attracts: finite).
  // Barely repelling cycles are endless too, but grow so slowly per turn that far out
  // the iteration limit runs out first and the view goes flat: at least 1/16 bit per step.
  function misVerify(cx, cy, k, p) {
    const one = 1n << PBn, s1 = PBn - 1n;
    let zx = 0n, zy = 0n, dx = 0n, dy = 0n, ax = 0n, ay = 0n, bx = 0n, by = 0n, lam = 0;
    for (let n = 1; n <= k + p; n++) {
      if (n > k) lam += Math.log2(2 * Math.hypot(N(zx), N(zy)));
      const t = ((zx * dx - zy * dy) >> s1) + one;
      dy = (zx * dy + zy * dx) >> s1;
      dx = t;
      const u = ((zx * zx - zy * zy) >> PBn) + cx;
      zy = ((zx * zy) >> s1) + cy;
      zx = u;
      if (ab(zx) + ab(zy) > 8n << PBn) return false;
      if (n === k) { ax = zx; ay = zy; bx = dx; by = dy; }
    }
    const gx = zx - ax, gy = zy - ay, hx = dx - bx, hy = dy - by;
    const h2 = (hx * hx + hy * hy) >> PBn;
    if (h2 === 0n || !(lam >= p / 16)) return false;
    const sx = ((gx * hx + gy * hy) >> PBn << PBn) / h2, sy = ((gy * hx - gx * hy) >> PBn << PBn) / h2;
    // in log2: 2^(-PB/2) itself is 0 as a double from PB = 2150 on
    return lg2(ab(sx) + ab(sy)) < -PB / 2;
  }
  // a verified Misiurewicz point within R of c (double in, exact out), smallest preperiod first
  function misFind(cx, cy, R) {
    const h0 = [H(cx), H(cy)];
    let tries = 0;
    for (const { k, p } of misCandidates(cx, cy, R)) {
      if (++tries > 64) break;
      const c = misNewton(cx, cy, k, p) || [cx, cy];
      if (Math.hypot(c[0] - cx, c[1] - cy) > 2 * R) continue;
      const e = misRefine(H(c[0]), H(c[1]), k, p);
      if (!e || Math.hypot(N(e[0] - h0[0]), N(e[1] - h0[1])) > R || !misVerify(e[0], e[1], k, p)) continue;
      return { c: [N(e[0]), N(e[1])], e, k, p };
    }
    return null;
  }
  // Newton in fixed point, quadratic from the double root; null if the orbit escapes
  function misRefine(cx, cy, k, p) {
    const one = 1n << PBn, s1 = PBn - 1n, esc = 8n << PBn;
    for (let it = 0; it < 40; it++) {
      let zx = 0n, zy = 0n, dx = 0n, dy = 0n, ax = 0n, ay = 0n, bx = 0n, by = 0n;
      for (let n = 1; n <= k + p; n++) {
        const t = ((zx * dx - zy * dy) >> s1) + one;
        dy = (zx * dy + zy * dx) >> s1;
        dx = t;
        const u = ((zx * zx - zy * zy) >> PBn) + cx;
        zy = ((zx * zy) >> s1) + cy;
        zx = u;
        if (ab(zx) + ab(zy) > esc) return null;
        if (n === k) { ax = zx; ay = zy; bx = dx; by = dy; }
      }
      const gx = zx - ax, gy = zy - ay, hx = dx - bx, hy = dy - by;
      const h2 = (hx * hx + hy * hy) >> PBn;
      if (h2 === 0n) break;
      const sx = ((gx * hx + gy * hy) >> PBn << PBn) / h2, sy = ((gy * hx - gx * hy) >> PBn << PBn) / h2;
      cx -= sx;
      cy -= sy;
      if ((sx < 0n ? -sx : sx) + (sy < 0n ? -sy : sy) < 256n) break;
    }
    return [cx, cy];
  }

  // ---- WebGL ----
  const gl = bild.getContext("webgl2", { antialias: false, preserveDrawingBuffer: true });
  if (!gl) { fail("WebGL 2 fehlt in diesem Browser."); return; }

  const VS = `#version 300 es
in vec2 p;
void main() { gl_Position = vec4(p, 0.0, 1.0); }`;

  // Perturbation around an exact reference orbit (texture), with rebasing (Zhuoran):
  // pixels iterate only dz = z - Z. Inside |w| <= 1: c = cM + r w; outside:
  // c = cM + r / conj(w) (circle inversion, continuous on |w| = 1).
  // Every pixel gets its dc as mantissa * 2^ec. While dz is below float range it is
  // carried the same way (dz = w 2^E, the exponent an int without bound), so depth is not
  // bound by float32; once |dz| > 2^-100 the loop runs on plain floats.
  // BLA: where dz is small enough, 2^l steps of the orbit at once as dz -> A dz + B dc
  // (tables per reference, built below); the loop counts n in orbit steps either way.
  // Mode 0 (origin near the view): reference cM, u = w / s.
  // Mode 1: reference near the view center vc; pixel offsets relative to vc, with
  // D0I / D0O = c(vc) - cRef on the inner / outer branch, done exactly in JS.
  const FS = `#version 300 es
precision highp float;
precision highp int;
uniform sampler2D uRef;
uniform sampler2D uBlaAB;
uniform sampler2D uBlaR;
uniform int uBlaOff[28];
uniform int uBlaCnt[28];
uniform int uBlaTop;
uniform float uLc;
uniform int uRefLen;
uniform int uMaxit;
uniform bool uRoh;
uniform vec2 uRes;
uniform int uMode;
uniform vec2 uU0;
uniform float uInvS2;
uniform float uKI;
uniform int uEI;
uniform float uKO;
uniform int uEO;
uniform float uH;
uniform vec2 uVn;
uniform float uEps;
uniform vec2 uE;
uniform vec2 uA;
uniform vec2 uD0I;
uniform vec2 uD0O;
uniform vec2 uMu0;
uniform vec2 uMp0;
uniform vec2 uS0;
uniform float uEb;
#ifdef KIND
uniform vec4 uSt[82];
uniform vec2 uBe, uXs, uJw, uUW;
uniform vec3 uW0, uUc;
uniform float uRE, uIEs, uEsc, uA0;
#endif
out vec4 o;

vec2 cmul(vec2 a, vec2 b) { return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x); }
vec2 cdiv(vec2 a, vec2 b) {
  float m = max(abs(b.x), abs(b.y));
  vec2 bb = b / m;
  return vec2(a.x * bb.x + a.y * bb.y, a.y * bb.x - a.x * bb.y) / (dot(bb, bb) * m);
}
vec2 invConj(vec2 w) {
  float m = max(abs(w.x), abs(w.y));
  vec2 u = w / m;
  return u / (dot(u, u) * m);
}
#ifdef KIND
// principal square root, without the cancellation of the textbook form
vec2 csqrt(vec2 z) {
  float m = length(z);
  if (z.x >= 0.0) {
    float a = sqrt(0.5 * (m + z.x));
    return a > 0.0 ? vec2(a, z.y / (2.0 * a)) : vec2(0.0);
  }
  float b = sqrt(0.5 * (m - z.x));
  return vec2(abs(z.y) / (2.0 * b), z.y < 0.0 ? -b : b);
}
vec2 cconj(vec2 z) { return vec2(z.x, -z.y); }
vec2 cexp(vec2 z) { return exp(z.x) * vec2(cos(z.y), sin(z.y)); }
float em1(float a) { return abs(a) < 1.0e-3 ? a * (1.0 + a * (0.5 + a / 6.0)) : exp(a) - 1.0; }
#endif
ivec2 at(int i) { return ivec2(i & 4095, i >> 12); }
vec2 refAt(int m) { return texelFetch(uRef, at(m), 0).rg; }

void main() {
  vec2 p = gl_FragCoord.xy - 0.5 * uRes;
  // dc = dcm 2^ec; pcm 2^ec = |dc/dp|, the size of this pixel in the c-plane
  vec2 dcm;
  float pcm;
  int ec;
#ifdef KIND
  bool dead = false, weg = false;
#endif
  if (uMode == 0) {
    vec2 u = uU0 + p;
    if (dot(u, u) > uInvS2) {
      vec2 iu = invConj(u);
      dcm = uKO * iu;
      pcm = uKO * dot(iu, iu);
      ec = uEO;
    } else {
      dcm = uKI * u;
      pcm = uKI;
      ec = uEI;
    }
#ifdef KIND
  } else if (uMode == 2) {
    // A2: Schwarz reflection at the main cardioid. mu = 1 - sqrt(1 - 4c); inside |mu| < 1 the pixel
    // shows c' = mu'(2 - mu')/4 with mu' = 1/conj(mu). Everything relative to the view center
    // (mu0, s0): differences are formed without subtracting near equal numbers.
    vec2 d = uKI * p;

      meldeOrt(tx, ty);
      if (aufSchiene(tx, ty)) {
        showValues();
        request(true);
        return;
      }
    }
    const [nx, ny, amRand] = bisZumNichts(cMx, cMy,
      dragging.cx - dragging.k * (e.clientX - dragging.x), dragging.cy + dragging.k * (e.clientY - dragging.y));
    // held at the edge, the finger starts over from here: turning back moves the point at once
    if (amRand) Object.assign(dragging, { x: e.clientX, y: e.clientY, cx: nx, cy: ny });
    setC(nx, ny, false);
    showValues();
    request(true);
  }
  function lasseLos() {
    const { lk } = dragging;
    dragging = null;
    if (snapOn) {
      snapC(lk);
      showValues();
    }
    request(false);
  }

  // ---- deep down: Misiurewicz points near the finger, found exactly ----
  // Below double resolution (c-pixel under 2^TIEF) the rails are far too coarse and doubles
  // cannot even say where the finger is. The finger's target is then the exact start point
  // plus its pixels, and a worker looks for a Misiurewicz point near it (nahe in the bahn
  // file). The point stays where it sits until one turns up nearer to the finger than it
  // is. One search at a time; the newest finger position waits for it.
  const TIEF = -45;
  const proPixel = () => Math.log2(r) + Math.min(ls, Math.log2(fitSw()));
  function zielH(e) {
    const { lk } = dragging, h = dragging.h.map((b) => zuPB(b, dragging.PB));
    return [h[0] - Hl(e.clientX - dragging.x, lk), h[1] + Hl(e.clientY - dragging.y, lk)];
  }
  const abstand = (a, b) => logadd(2 * lg2(a[0] - b[0]), 2 * lg2(a[1] - b[1])) / 2;
  let sucheW = null, sucheLauf = null, sucheNext = null;
  // look within 2^lR of t; wackelt: shake if nothing turns up and the point is still free
  function sucheNahe(t, lR, wackelt) {
    const auftrag = { t, lR, wackelt, PB };
    if (sucheLauf) { sucheNext = auftrag; return; }
    if (!sucheW) {
      sucheW = new Worker("/tools/workers/gespiegeltes-mandelbrot-bahn.js");
      sucheW.onerror = (e) => { e.preventDefault(); fail("Such-Worker: " + (e.message || "Fehler")); };
      sucheW.onmessage = (e) => {
        const a = sucheLauf, m = a.verworfen ? null : e.data.nahe;
        sucheLauf = null;
        // same bits still, and nearer to where the finger is now than the point is
        const ziel = sucheNext ? sucheNext.t : a.t;
        if (m && m.PB === PB && (!mis || abstand(m.e, ziel) < abstand(cH, ziel))) {
          setCH(m.e, { k: m.k, p: m.p });
          showValues();
          request(!!dragging);
        } else if (!m && !a.verworfen && a.wackelt && !mis && !sucheNext) {
          wackeln();
        }
        if (sucheNext) {
          const n = sucheNext;
          sucheNext = null;
          if (n.PB === PB) sucheNahe(n.t, n.lR, n.wackelt);
        }
      };
    }
    sucheLauf = auftrag;
    sucheW.postMessage({ nahe: { tx: t[0], ty: t[1], lR, PB } });
  }
  feld.addEventListener("pointerup", up);
  feld.addEventListener("pointercancel", up);
  feld.addEventListener("dblclick", (e) => {
    if (e.target === lupe) return;
    fitView();
    request(false);
  });

  // in the lupe: its middle is the mirror point and moves it, at the lupe's scale;
  // anywhere else the lupe itself is moved by hand. The field underneath stays put
  let lupeZug = null;
  lupe.addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    lupe.setPointerCapture(e.pointerId);
    const lb = lupe.getBoundingClientRect();
    const Lc = lb.width;
    if (Math.hypot(e.clientX - lb.left - Lc / 2, e.clientY - lb.top - Lc / 2) <= 24) {
      dragging = { id: e.pointerId, x: e.clientX, y: e.clientY, cx: cMx, cy: cMy, k: r * LUPE_FIT / Lc, lk: Math.log2(r * LUPE_FIT / Lc), h: cH, PB, mis, cGenau, lupe: true };
      zeige();
      return;
    }
    lupeZug = { id: e.pointerId, dx: e.clientX - lb.left, dy: e.clientY - lb.top };
  });
  lupe.addEventListener("pointermove", (e) => {
    if (dragging && dragging.id === e.pointerId) {
      e.stopPropagation();
      ziehe(e);
      return;
    }
    if (!lupeZug || lupeZug.id !== e.pointerId) return;
    e.stopPropagation();
    const fb = feld.getBoundingClientRect();
    setLupePos({ x: e.clientX - fb.left - lupeZug.dx, y: e.clientY - fb.top - lupeZug.dy });
  });
  const lupeLos = (e) => {
    if (dragging && dragging.id === e.pointerId) {
      e.stopPropagation();
      lasseLos();
      return;
    }
    if (!lupeZug || lupeZug.id !== e.pointerId) return;
    e.stopPropagation();
    lupeZug = null;
    lupeNebenPanel();
  };
  lupe.addEventListener("pointerup", lupeLos);
  lupe.addEventListener("pointercancel", lupeLos);

  // ---- panel (tools/controls.js); code values are the start state the reset returns to ----
  const panel = Controls.createPanel({ position: "left" });
  panel
    .addSlider("r", {
      label: "𝑟", min: 0, max: 4, step: 0.01, decimals: 2, grow: true,
      value: START.r,
      onChange: (v) => {
        r = Math.max(0, Number(v) || 0);
        showValues();
        request(true);
      },
    })
    .addToggle("rasten", {
      label: "einrasten",
      value: !kind,
      onChange: (on) => {
        snapOn = !!on;
        if (snapOn) snapC();
        showValues();
        request(false);
      },
    })
    .addToggle("lupe", {
      label: "Lupe",
      value: true,
      onChange: (on) => {
        lupeOn = !!on;
        showValues();
        request(false);
      },
      details: (p) => p.addSlider("lupeG", {
        label: "Größe", min: 0, max: 2 * LUPE_G, step: 1, grow: true,
        value: LUPE_G,
        onChange: (v) => {
          setLupeG(Number(v) || 0);
          request(false);
        },
      }),
    })
    .addButton("ran", { label: "ran zoomen", onClick: ranZoomen })
    .addResetButton({
      // the panel already put r and rasten back; the rest of the start state is the
      // start point in the fitted view, with no trace left in the URL
      afterReset: () => {
        const vorher = { cMx, cMy, r, ls, snapOn, lupeOn, cH, vH, mis, PB, lupePos, cGenau };
        lupeOn = !!panel.get("lupe");
        setLupePos(null);
        fitView();
        setC(START.c[0], START.c[1], true);
        showValues();
        zeichneJetzt();
        const u = new URL(location.href);
        for (const k of ["c", "r", "w", "s", "rasten", "lupe", "frei"]) u.searchParams.delete(k);
        history.replaceState(history.state, "", u);
        return () => {
          ({ cMx, cMy, r, snapOn, lupeOn, cH, mis, cGenau } = vorher);
          setS(vorher.ls);
          setLupePos(vorher.lupePos);
          PB = vorher.PB;
          PBn = BigInt(PB);
          setV(...vorher.vH);
          showValues();
          zeichneJetzt();
        };
      },
    });
  panel.bodyEl.prepend(wert);

  // ---- tempo slider (#416): right zooms in, left out, until it is set back to 0. The
  // slider goes from -1 over 0 to 1 and no further, what 1 means is set in its menu ("how fast is 1",
  // octaves per second, any number). The thumb stands for u, the speed is EINS * u^3: slow
  // speeds sit wide apart, near 0, and the far end is reached with a small step. Typed in,
  // anything past 1 stays 1. 0 is rest, 1 is EINS, and the way to infinity is the slider. ----
  const EINS = 1000;
  const tempoSkala = {
    toSliderValue(v, cfg) {
      const lim = v > 0 ? cfg.max : -cfg.min;
      if (!v || !(lim > 0)) return 0;
      return Math.sign(v) * lim * Math.min(1, Math.cbrt(Math.abs(v) / lim));
    },
    fromSliderValue(x, cfg) {
      const lim = x > 0 ? cfg.max : -cfg.min;
      const u = Math.min(1, Math.abs(x) / lim);
      // a small dead zone round the middle: rest is easy to find
      return !(lim > 0) || u < 0.02 ? 0 : Math.sign(x) * lim * u ** 3;
    },
    formatDisplayValue(v, decs, cfg) {
      const lim = v > 0 ? cfg.max : -cfg.min;
      return String(!v || !(lim > 0) ? 0 : +(Math.sign(v) * Math.min(1, Math.cbrt(Math.abs(v) / lim))).toFixed(3));
    },
    parseDisplayValue(text, cfg) {
      const n = Number(String(text).trim().replace(",", "."));
      if (!Number.isFinite(n)) return NaN;
      const u = Math.max(-1, Math.min(1, n));
      return Math.sign(u) * (u > 0 ? cfg.max : -cfg.min) * Math.abs(u) ** 3;
    },
  };
  panel.addSlider("tempo", {
    label: "", min: -EINS, max: EINS, step: 0.01, decimals: 12, transform: tempoSkala, symmetric: "how fast is 1",
    value: 0,
    onChange: (v) => tempo(-(Number(v) || 0)),
  });
  panel.bodyEl.querySelector('[data-key="r"]').after(panel.bodyEl.querySelector('[data-key="tempo"]'));

  // full-quality frame now, without the delayed saveUrl of request()
  function zeichneJetzt() {
    clearTimeout(idle);
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    lauf++;
    wechsel++;
    draw(1, false);
  }

  function fitSw() { return (2 * 1.6) / Math.min(cssW, cssH); }
  function fitView() {
    setS(Math.log2(fitSw()));
    setV(0n, 0n);
    ensurePB();
  }
  // back to the start view, the mirror point stays: the zoom glides in decades,
  // so 1e50 takes no longer than 1e2.
  // The flight is one similarity: the point that sits at the same screen spot in both
  // views stays put, the scale runs in logarithms. If that point lies off screen
  // (panned far away), the camera takes the van Wijk-Nuij arc instead: out, over, in.
  let ranZug = 0;
  const lncosh = (x) => Math.abs(x) + Math.log1p(Math.exp(-2 * Math.abs(x))) - Math.LN2;
  const lnsinh = (x) => x + Math.log1p(-Math.exp(-2 * x)) - Math.LN2;
  function ranZoomen() {
    cancelAnimationFrame(ranZug);
    // lengths in units of the start scale s0 = 2^l0, so no depth overflows them
    const l0 = ls, l1 = Math.log2(fitSw()), b = l1 - l0, v0 = vH, P0 = PB, u1 = 2 ** (lv - l0);
    const D = Math.min(cssW, cssH);
    const sh = (q) => (PB > P0 ? q << BigInt(PB - P0) : q >> BigInt(P0 - PB));
    // where the fixed point sits on screen, in pixels from the centre
    const fest = u1 / Math.abs(2 ** b - 1);
    let pose = null, weg;
    if (fest > D / 2 && u1 > 0) {
      const R = Math.SQRT2, R2 = 2, w0 = D, w1 = D * 2 ** b;
      const r0 = -Math.asinh((w1 * w1 - w0 * w0 + R2 * R2 * u1 * u1) / (2 * w0 * R2 * u1));
      const r1 = -Math.asinh((w1 * w1 - w0 * w0 - R2 * R2 * u1 * u1) / (2 * w1 * R2 * u1));
      const S = (r1 - r0) / R;
      if (Number.isFinite(S) && S > 0) {
        weg = S * R;
        const ux = -vnx, uy = -vny, lc0 = lncosh(r0);
        pose = (e) => {
          const x = R * S * e;
          setS(l0 + (lc0 - lncosh(x + r0)) / Math.LN2);
          ensurePB();
          const u = x > 0 ? Math.exp(Math.log(w0) - Math.log(R2) + lnsinh(x) - lncosh(x + r0)) : 0;
          setV(sh(v0[0]) + Hl(u * ux, l0),sh(v0[1]) + Hl(u * uy, l0));
        };
      }
    }
    if (!pose) {
      weg = Math.abs(b) * Math.LN2;
      pose = (e) => {
        setS(l0 + b * e);
        ensurePB();
        // v = v0 (s1 - sw) / (s1 - s0), with the shrinking part kept to 60 bits
        const a = ls - l0;
        const g = b > 0 ? (2 ** (a - b) - 2 ** -b) / (1 - 2 ** -b) : (1 - 2 ** a) / (1 - 2 ** b);
        if (!(g > 0)) return setV(sh(v0[0]), sh(v0[1]));
        const E = 60 - Math.floor(Math.log2(g)), G = BigInt(Math.round(ldexp(g, E))), En = BigInt(E);
        setV(sh(v0[0] - ((v0[0] * G) >> En)), sh(v0[1] - ((v0[1] * G) >> En)));
      };
    }
    const dauer = Math.min(900, 250 + 25 * weg / Math.LN10);
    // a slow frame advances the flight by at most 1/30 s, so no frame skips ahead
    let a = 0, tz = performance.now();
    const step = (t) => {
      if (pts.size) return;
      a = Math.min(1, a + Math.min(t - tz, 1000 / 30) / dauer);
      tz = t;
      if (a >= 1) {
        fitView();
        request(false);
        return;
      }
      pose(a < 0.5 ? 4 * a * a * a : 1 - (-2 * a + 2) ** 3 / 2);
      request(true);
      ranZug = requestAnimationFrame(step);
    };
    ranZug = requestAnimationFrame(step);
  }

  let resizeT = 0, resizeN = 0;
  function resize() {
    resizeT = performance.now();
    resizeN++;
    dpr = Math.min(1.5, window.devicePixelRatio || 1);
    const b = feld.getBoundingClientRect();
    const old = Math.min(cssW, cssH);
    cssW = Math.max(1, b.width);
    cssH = Math.max(1, b.height);
    if (Number.isFinite(ls)) setS(ls + Math.log2(old / Math.min(cssW, cssH)));
    if (lupePos) setLupePos(lupePos);
    request(false);
  }
  // the field also changes size without a window resize (controls.js sets
  // --controls-mobile-occlusion after the panel is built or dragged)
  new ResizeObserver(resize).observe(feld);

  // ?diag: small print of what the device reports, for hunting phone-only glitches; nothing without the parameter
  if (new URLSearchParams(location.search).has("diag")) {
    const dg = document.createElement("pre");
    dg.id = "diag";
    dg.style.cssText = "position:fixed;left:4px;top:4px;margin:0;padding:2px 4px;font:9px/1.15 monospace;color:#fff;background:rgba(0,0,0,.55);pointer-events:none;z-index:99999;white-space:pre";
    document.body.appendChild(dg);
    const modus = () => (dragging ? (dragging.lupe ? "lupe" : "punkt") : pts.size >= 2 ? "pinch" : pts.size === 1 ? "pan" : lupeZug ? "lupe" : "-");
    const tick = () => {
      const vv = window.visualViewport;
      dg.textContent = [
        `mode ${modus()} fingers ${pts.size}`,
        `dpr ${window.devicePixelRatio} used ${dpr}`,
        `canvas ${bild.width}x${bild.height} px, css ${cssW.toFixed(1)}x${cssH.toFixed(1)}`,
        `inner ${window.innerWidth}x${window.innerHeight} vv ${vv ? vv.width.toFixed(1) + "x" + vv.height.toFixed(1) + " scale " + vv.scale : "-"}`,
        `resize #${resizeN} ${resizeN ? ((performance.now() - resizeT) / 1000).toFixed(1) + "s ago" : "-"}`,
        `ls ${ls.toFixed(4)} sw ${sw} c ${cMx.toFixed(6)},${cMy.toFixed(6)}`,
        `v ${N(vH[0])},${N(vH[1])}`,
      ].join("\n");
      requestAnimationFrame(tick);
    };
    tick();
  }

  bild.addEventListener("webglcontextlost", (e) => { e.preventDefault(); fail("Grafikkontext verloren, Seite neu laden."); });

  const b0 = feld.getBoundingClientRect();
  cssW = Math.max(1, b0.width);
  cssH = Math.max(1, b0.height);
  dpr = Math.min(1.5, window.devicePixelRatio || 1);
  fitView();
  // URL > page defaults (control-defaults) > code values; the panel holds the latter two
  r = panel.get("r");
  snapOn = !!panel.get("rasten");
  lupeOn = !!panel.get("lupe");
  setLupeG(panel.get("lupeG"));
  setC(cMx, cMy, true);
  loadUrl();
  showValues();
  request(false);
  requestAnimationFrame(() => setTimeout(ladeRasten, 0));
})();
</script>

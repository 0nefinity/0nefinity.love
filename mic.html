<!DOCTYPE html>
<html lang="de">
<head>
  <!--#include virtual="/includes/something-in-the-head.html" -->
<meta charset="UTF-8">
<title>mic</title>
<style>
#mic {
  display: flex;
  flex-direction: column;
  white-space: normal;
  touch-action: none;
  font-size: 0;
  box-sizing: border-box;
  padding-top: 4.4rem;
}
#mic * { white-space: normal; text-shadow: none; }
#mic canvas { display: block; width: 100%; flex: 0 0 auto; touch-action: none; }
#welle { height: 15%; cursor: crosshair; }
#mod   { height: 9%;  cursor: pointer; }
#sg    { flex: 1 1 auto !important; min-height: 0; cursor: pointer; }
#spek  { height: 16%; }
#leiste {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.5rem 0.75rem;
  font-family: var(--font-family);
  font-size: 0.85rem;
  color: var(--text-color);
}
#leiste button {
  font-family: var(--font-family);
  font-size: 1.1rem;
  line-height: 1;
  background: transparent;
  color: var(--text-color);
  border: 0;
  padding: 0.2rem;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
#leiste svg { width: 2.4rem; height: 2.4rem; display: block; fill: none; stroke: var(--text-color); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#leiste svg .voll { fill: var(--text-color); stroke: none; }
#loop.an circle { fill: var(--text-color); }
#loop.an path { stroke: var(--bg-color); }
#ab { display: flex; border: 1px solid color-mix(in srgb, var(--text-color) 30%, transparent); border-radius: 9999px; overflow: hidden; }
#ab button { padding: 0.5rem 0.9rem; font-size: 0.85rem; }
#ab button.an { background: var(--text-color); color: var(--bg-color); }
#lesung { flex: 1 1 auto; text-align: right; font-variant-numeric: tabular-nums; opacity: 0.85; min-width: 0; }
#fehler {
  display: none;
  position: absolute; left: 0.75rem; right: 0.75rem; top: 0.75rem;
  z-index: 5;
  padding: 0.7rem 0.9rem;
  border: 1px solid var(--text-color);
  background: var(--bg-color);
  color: var(--text-color);
  font-family: var(--font-family);
  font-size: 0.9rem;
  animation: wackeln 0.3s;
}
@keyframes wackeln { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.mic-reset { flex: none; width: 1.6rem; height: 1.6rem; padding: 0; margin: 0; background: none; border: 0; cursor: pointer; opacity: 0; pointer-events: none; }
.mic-reset.sichtbar { opacity: 1; pointer-events: auto; }
.mic-reset svg { width: 100%; height: 100%; display: block; fill: none; stroke: var(--text-color); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ctrl-range { touch-action: none; }
@media (pointer: coarse) { .mic-reset { width: 2.2rem; height: 2.2rem; } .ctrl-range { padding-block: 14px; background-clip: content-box; } }
#datei { display: none; }
</style>
</head>
<body>
<div id="mic" class="_018-canvas">
  <canvas id="welle"></canvas>
  <canvas id="mod"></canvas>
  <canvas id="sg"></canvas>
  <canvas id="spek"></canvas>
  <div id="leiste">
    <button id="rec" aria-label="aufnehmen" title="aufnehmen"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17"/><path id="recpunkt" class="voll" d="M12 20 A8 8 0 1 0 28 20 A8 8 0 1 0 12 20 Z"/></svg></button>
    <button id="play" aria-label="abspielen" title="abspielen"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17"/><path id="playform" class="voll" d="M16 12 L28 20 L16 28 Z"/></svg></button>
    <button id="loop" aria-label="wiederholen" title="wiederholen" aria-pressed="false"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17"/><path d="M12 19 V17 Q12 13 16 13 H27 M24 10 L28 13 L24 16 M28 21 V23 Q28 27 24 27 H13 M16 24 L12 27 L16 30"/></svg></button>
    <div id="ab" role="group" aria-label="original oder verändert"><button id="ab0" class="an" title="original anhören" aria-label="original anhören">original</button><button id="ab1" title="verändert anhören" aria-label="verändert anhören">verändert</button></div>
    <div id="lesung"></div>
  </div>
  <div id="fehler" role="alert"></div>
  <input id="datei" type="file" accept="audio/*">
</div>

<script src="/tools/mic.js?v=<!--#flastmod virtual="/tools/mic.js" -->"></script>

<!--#include virtual="/includes/something-in-the-body.html" -->
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <!--#include virtual="/includes/something-in-the-head.html" -->
<meta charset="UTF-8">
<title>mic</title>
<style>
#mic {
  display: flex;
  flex-direction: column;
  white-space: normal;
  touch-action: none;
  font-size: 0;
  box-sizing: border-box;
  padding-top: 4.4rem;
}
#mic * { white-space: normal; text-shadow: none; }
#mic canvas { display: block; width: 100%; flex: 0 0 auto; touch-action: none; }
#welle { height: 15%; cursor: crosshair; }
#mod   { height: 9%;  cursor: pointer; }
#sg    { flex: 1 1 auto !important; min-height: 0; cursor: pointer; }
#sg.malt { cursor: crosshair; touch-action: none; }
#sg.wackel { animation: wackeln 0.3s; }
#spek  { height: 16%; }
#leiste {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.5rem 0.75rem;
  font-family: var(--font-family);
  font-size: 0.85rem;
  color: var(--text-color);
}
#leiste button {
  font-family: var(--font-family);
  font-size: 1.1rem;
  line-height: 1;
  background: transparent;
  color: var(--text-color);
  border: 0;
  padding: 0.2rem;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
#leiste svg { width: 2.4rem; height: 2.4rem; display: block; fill: none; stroke: var(--text-color); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#leiste svg .voll { fill: var(--text-color); stroke: none; }
#loop.an circle { fill: var(--text-color); }
#loop.an path { stroke: var(--bg-color); }
#ab { flex: none; display: flex; border: 1px solid color-mix(in srgb, var(--text-color) 30%, transparent); border-radius: 9999px; overflow: hidden; }
#ab button { padding: 0.5rem 0.9rem; font-size: 0.85rem; }
#ab button.an { background: var(--text-color); color: var(--bg-color); }
#quelle { flex: 0 1 auto; min-width: 0; display: flex; align-items: center; gap: 0.3rem; color: var(--text-color); }
#quelle svg { flex: none; width: 1.3rem; height: 1.3rem; stroke-width: 2; }
#quellewahl { min-width: 0; max-width: 9rem; font-family: var(--font-family); font-size: 0.85rem; color: var(--text-color); background: var(--bg-color); border: 0; border-bottom: 1px solid color-mix(in srgb, var(--text-color) 30%, transparent); border-radius: 0; padding: 0.3rem 0.2rem; appearance: none; white-space: nowrap !important; overflow: hidden; text-overflow: ellipsis; cursor: pointer; color-scheme: dark; }
#quellewahl.einzeln { pointer-events: none; border-bottom-color: transparent; }
#quellewahl:disabled { opacity: 0.3; }
#lesung { flex: 1 1 auto; text-align: right; font-variant-numeric: tabular-nums; opacity: 0.85; min-width: 0; }
#fehler {
  display: none;
  position: absolute; left: 0.75rem; right: 0.75rem; top: 0.75rem;
  z-index: 5;
  padding: 0.7rem 0.9rem;
  border: 1px solid var(--text-color);
  background: var(--bg-color);
  color: var(--text-color);
  font-family: var(--font-family);
  font-size: 0.9rem;
  animation: wackeln 0.3s;
}
@keyframes wackeln { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.mic-reset { flex: none; width: 1.6rem; height: 1.6rem; padding: 0; margin: 0; background: none; border: 0; cursor: pointer; opacity: 0; pointer-events: none; }
.mic-reset.sichtbar { opacity: 1; pointer-events: auto; }
.mic-reset svg { width: 100%; height: 100%; display: block; fill: none; stroke: var(--text-color); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ctrl-range { touch-action: none; }
@media (pointer: coarse) { .mic-reset { width: 2.2rem; height: 2.2rem; } .ctrl-range { padding-block: 14px; background-clip: content-box; } }
@media (max-width: 600px) { #leiste { flex-wrap: wrap; row-gap: 0.2rem; } #quelle { flex: 1 0 100%; } #lesung { flex: 1 0 100%; text-align: left; } }
#mic [hidden] { display: none !important; }
#clips, #schnitt { flex: 0 0 auto; display: flex; align-items: center; gap: 0.4rem; padding: 0.25rem 0.75rem; font-family: var(--font-family); font-size: 0.85rem; color: var(--text-color); }
#chips { flex: 1 1 auto; min-width: 0; display: flex; gap: 0.4rem; overflow-x: auto; touch-action: pan-x; scrollbar-width: none; }
#chips::-webkit-scrollbar { display: none; }
#clipaktion { flex: none; display: flex; gap: 0.2rem; }
#clips button, #schnitt button, #toast button, #anhaengen {
  font-family: var(--font-family); font-size: 0.85rem; line-height: 1; color: var(--text-color); background: transparent;
  border: 1px solid color-mix(in srgb, var(--text-color) 30%, transparent); border-radius: 9999px;
  padding: 0.5rem 0.8rem; min-height: 2.4rem; cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent;
}
#clips button.chip { flex: none; max-width: 12rem; overflow: hidden; text-overflow: ellipsis; }
#clips button.an { background: var(--text-color); color: var(--bg-color); }
#clipaktion button { border-color: transparent; padding: 0.5rem 0.5rem; }
.chipname { flex: none; width: 10rem; font-family: var(--font-family); font-size: 0.85rem; color: var(--text-color); background: var(--bg-color); border: 1px solid var(--text-color); border-radius: 9999px; padding: 0.5rem 0.8rem; min-height: 2.4rem; box-sizing: border-box; }
#schnitt { flex-wrap: wrap; gap: 0.15rem; }
#schnitt button { flex: none; border-color: transparent; padding: 0.3rem; min-width: 2.4rem; display: flex; align-items: center; justify-content: center; }
#schnitt button.wort { padding: 0.5rem 0.6rem; border-color: color-mix(in srgb, var(--text-color) 30%, transparent); }
#schnitt svg { width: 1.5rem; height: 1.5rem; display: block; fill: none; stroke: var(--text-color); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#schnitt button:disabled, #clips button:disabled { opacity: 0.3; cursor: default; }
#schnitt .trenn { flex: none; width: 1px; align-self: stretch; margin: 0.4rem 0.3rem; background: color-mix(in srgb, var(--text-color) 30%, transparent); }
#luecke { flex: none; width: 2.6rem; font-family: var(--font-family); font-size: 0.85rem; text-align: right; color: var(--text-color); background: transparent; border: 0; border-bottom: 1px solid var(--text-color); padding: 0.3rem 0.1rem; min-height: 2.4rem; box-sizing: border-box; }
#luecke.wackel { animation: wackeln 0.3s; }
#schnitt .einheit { flex: none; margin-right: 0.5rem; opacity: 0.7; }
#anhaengen { flex: none; background: var(--bg-color); appearance: none; padding-right: 0.8rem; }
#scroll { flex: 0 0 auto; position: relative; height: 1.1rem; margin: 0 0.75rem; touch-action: none; cursor: pointer; border-top: 1px solid color-mix(in srgb, var(--text-color) 20%, transparent); }
#daumen { position: absolute; top: 0.2rem; bottom: 0.2rem; background: color-mix(in srgb, var(--text-color) 55%, transparent); border-radius: 9999px; min-width: 0.6rem; pointer-events: none; }
#toast { position: absolute; left: 50%; bottom: 5rem; transform: translateX(-50%); z-index: 6; display: flex; align-items: center; gap: 0.8rem; padding: 0.4rem 0.5rem 0.4rem 1rem; border: 1px solid var(--text-color); border-radius: 9999px; background: var(--bg-color); color: var(--text-color); font-family: var(--font-family); font-size: 0.9rem; }
#datei { display: none; }
</style>
</head>
<body>
<div id="mic" class="_018-canvas">
  <div id="clips" hidden><div id="chips"></div><div id="clipaktion"></div></div>
  <canvas id="welle"></canvas>
  <div id="scroll" hidden><div id="daumen"></div></div>
  <div id="schnitt" hidden></div>
  <canvas id="mod"></canvas>
  <canvas id="sg"></canvas>
  <canvas id="spek"></canvas>
  <div id="leiste">
    <button id="rec" aria-label="aufnehmen" title="aufnehmen"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17"/><path id="recpunkt" class="voll" d="M12 20 A8 8 0 1 0 28 20 A8 8 0 1 0 12 20 Z"/></svg></button>
    <button id="play" aria-label="abspielen" title="abspielen"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17"/><path id="playform" class="voll" d="M16 12 L28 20 L16 28 Z"/></svg></button>
    <button id="loop" aria-label="wiederholen" title="wiederholen" aria-pressed="false"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17"/><path d="M12 19 V17 Q12 13 16 13 H27 M24 10 L28 13 L24 16 M28 21 V23 Q28 27 24 27 H13 M16 24 L12 27 L16 30"/></svg></button>
    <div id="ab" role="group" aria-label="original oder verändert"><button id="ab0" class="an" title="original anhören" aria-label="original anhören">original</button><button id="ab1" title="verändert anhören" aria-label="verändert anhören">verändert</button></div>
    <label id="quelle" title="mikrofon" hidden><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11 A6.5 6.5 0 0 0 18.5 11 M12 17.5 V21"/></svg><select id="quellewahl" aria-label="mikrofon"></select></label>
    <div id="lesung"></div>
  </div>
  <div id="fehler" role="alert"></div>
  <div id="toast" role="status" hidden></div>
  <input id="datei" type="file" accept="audio/*" multiple>
</div>

<script src="/tools/mic.js?v=<!--#flastmod virtual="/tools/mic.js" -->"></script>

<!--#include virtual="/includes/something-in-the-body.html" -->
</body>
</html>

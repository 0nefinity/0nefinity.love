<!DOCTYPE html>
<html lang="de">
<head>
  <!--#include virtual="/includes/something-in-the-head.html" -->
  <script src="/tools/math-notation.js" defer></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>(un)foldingPi</title>
  <style>
    html, body { height: 100%; overflow: hidden; touch-action: none; }
    /* Sausen zeigt bis -10000 (und mehr): Platz fuer sieben Zeichen */
    .ctrl-row[data-key="drift"] .ctrl-value-input { width: 4.6em; }
    /* Touch-Ziel: mindestens 44 x 44 px */
    .ctrl-row[data-key="notation"] .ctrl-button { min-height: 44px; min-width: 44px; }
    .stage {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      background: var(--bg-color);
      color: var(--text-color);
      user-select: none; -webkit-user-select: none;
    }
    .stage.hinweis { box-shadow: inset 0 0 0 2px #b8860b; }
    .stage.fehler { box-shadow: inset 0 0 0 3px #c33; }
    /* Wartezustand: die Anzeige steht an der letzten berechneten Stelle und wartet auf den Worker (kein Ende, kein Fehler). */
    .stage.warte::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--text-color); pointer-events: none; animation: warte-puls 1.6s ease-in-out infinite; }
    @keyframes warte-puls { 0%, 100% { opacity: 0.08; } 50% { opacity: 0.45; } }
    /* Hinweis nur bei Geraetegrenze: klein, gedaempft, ohne Interaktion. */
    .limit-hint { position: absolute; top: 0.75rem; left: 50%; transform: translateX(-50%); max-width: 90vw; text-align: center; font-size: 0.7rem; color: var(--text-color); opacity: 0.45; pointer-events: none; }
    #pi { flex: 1; min-height: 0; width: 100%; display: block; touch-action: none; }
    /* Glieder (Kette, Stern): je Glied eine Canvas, Lage setzt das Skript */
    .glied { position: absolute; display: block; touch-action: none; }
    .punkt { position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; }
    .ctrl-row[data-key="form"] .ctrl-button[aria-pressed="true"] { box-shadow: inset 0 0 0 1px var(--text-color); }
    /* Stellenanzeige: feste Stelle unter der Zeile, nur der Text wechselt */
    .stelle { position: absolute; transform: translate(-50%, -50%); font-size: 0.85rem; font-variant-numeric: tabular-nums; color: var(--text-color); opacity: 0.75; pointer-events: none; white-space: nowrap; z-index: 4; }
    .stellen { position: absolute; left: 0; right: 0; top: 68%; text-align: center; font-size: 1.25rem; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; color: var(--text-color); pointer-events: none; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="stage _018" id="stage">
    <canvas id="pi"></canvas>
    <div class="stellen" id="stellen" aria-live="polite">&nbsp;</div>
  </div>

  <script src="/tools/irrational.js"></script>
  <script src="/tools/pi-file.js"></script>
  <script src="/tools/unfolding-view.js"></script>
  <script>
  (() => {
    'use strict';

    // Pi-Anfang (Ziffern inkl. der 3, ohne Punkt): sofort da; der Worker liefert den Rest und prüft sich daran.
    const RESERVE =
      "31415926535897932384626433832795028841971693993751058209749445923078164062862089"+
      "98628034825342117067982148086513282306647093844609550582231725359408128481117450"+
      "28410270193852110555964462294895493038196442881097566593344612847564823378678316"+
      "52712019091456485669234603486104543266482133936072602491412737245870066063155881"+
      "74881520920962829254091715364367892590360011330530548820466521384146951941511609"+
      "43305727036575959195309218611738193261179310511854807446237996274956735188575272"+
      "48912279381830119491298336733624406566430860213949463952247371907021798609437027"+
      "70539217176293176752384674818467669405132000568127145263560827785771342757789609"+
      "17363717872146844090122495343014654958537105079227968925892354201995611212902196"+
      "08640344181598136297747713099605187072113499999983729780499510597317328160963185"+
      "95024459455346908302642522308253344685035261931188171010003137838752886587533208"+
      "38142061717766914730359825349042875546873115956286388235378759375195778185778053"+
      "2171226806613001927876611195909216420198";

    // Die Ansicht (tools/unfolding-view.js) hält die Kette: Ganzzahl (Irrational.constants[].intPart), ".", Nachkommastellen.
    const CONSTS = Irrational.constants;
    const constOf = (id) => CONSTS.find((k) => k.id === id);
    const params = new URLSearchParams(location.search);
    let cid = params.get('c') || 'pi';
    let requestedTotal = 0;
    let piError = null;
    let piNotice = null;
    let limitState = null;
    let handle = null;
    let file = null;   // Pi-Stellendatei (tools/pi-file.js): nur fuer pi, traegt die Stellen jenseits der am Geraet gerechneten
    const FILE_URL = '/pi-daten/pi-1e9.b196', FILE_DIGITS = 1000000000;
    const testCfg = () => window.unfoldingPiTest || {};
    const deviceCap = () => (file ? (testCfg().deviceDigits || 100000) + 1 : Infinity);
    const startChain = () => view.setDigits(...chainStart());
    const chainStart = () => [constOf(cid) ? constOf(cid).intPart : '0', cid === 'pi' ? RESERVE.slice(1) : ''];

    const stage  = document.getElementById('stage');
    const canvas = document.getElementById('pi');
    let panel = null;   // Regler (tools/controls.js): Sausen, Verdichtungsfaktor, Konstante; im Boot angelegt
    let driftEl = null, driftValue = 0;   // Sausen in Stellen/s: negativ = Regler links = vorwaerts
    // Standardgrenze des Sausens: +-10.000 Stellen/s, Step 1. Im Popup (min/max) beliebig weit verstellbar;
    // die Kennlinie bleibt logarithmisch zwischen 0 und der Grenze.
    const DRIFT_MAX = 10000;
    // Zahlen ausgeschrieben ohne Tausenderpunkt, nie in Exponentialschreibweise: 10000, 1000000, 0,5.
    // Eingaben mit Tausenderpunkten (1.000.000) werden weiter verstanden.
    const fmtDE = (v, decimals) => new Intl.NumberFormat('de-DE', { maximumFractionDigits: Math.max(0, decimals | 0), useGrouping: false }).format(v);
    function parseDE(text) {
      let t = String(text ?? '').trim().replace(/\s/g, '');
      // Mit Komma: Punkte sind Tausender. Ohne Komma: Punkte nur dann Tausender, wenn sie Dreiergruppen trennen (1.000.000).
      if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
      else if (/^-?\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
      const n = Number(t);
      return t && Number.isFinite(n) ? n : NaN;
    }
    const driftTransform = {
      toSliderValue(v, cfg) {
        const lim = (v > 0 ? cfg.max : -cfg.min);
        if (!v || !(lim > 0)) return 0;
        return Math.sign(v) * lim * Math.log1p(Math.min(Math.abs(v), lim)) / Math.log1p(lim);
      },
      fromSliderValue(s, cfg) {
        const lim = (s > 0 ? cfg.max : -cfg.min);
        if (!(lim > 0) || Math.abs(s) < 0.02 * lim) return 0;   // Totzone um die Mitte: kein Kriechen
        return Math.sign(s) * Math.expm1(Math.min(1, Math.abs(s) / lim) * Math.log1p(lim));
      },
      formatDisplayValue(v, decimals) { return fmtDE(v, decimals); },
      parseDisplayValue(text) { return parseDE(text); },
      formatConfigValue(v) { return fmtDE(v, 20); },
      parseConfigValue(text) { return parseDE(text); }
    };

    // ─── Ansicht ───
    const [intPart0, decimals0] = chainStart();
    const view = UnfoldingView.create(canvas, {
      intPart: intPart0, decimals: decimals0,   // schon beim ersten Layout da: die Grenzen richten sich nach der Kettenlaenge
      colorElement: stage,
      rate: () => -driftValue,
      // Die Seite meldet nur die echte Front; den Vorrat darüber legt der Worker fest.
      onNeedDigits: (total) => requestDigits(total),
      onFront: (atFront) => { if (!multi) stage.classList.toggle('warte', !piError && !limitState && !file && atFront); },
      onPointerInfo: (info) => { pointerInfo = info; showPlace(); }
    });

    // ─── Stellenanzeige ───
    // 0-Notation (Standard): die Ganzzahl ist "0.", die erste Nachkommastelle "1.". Alternative: Zaehlung ab der Ganzzahl
    // (bei pi heisst die 3 "3.", die erste Nachkommastelle "4."). Kettenindex i: 0 = Ganzzahl, 1 = Komma, ab 2 Nachkommastellen.
    const NOTATION_KEY = 'unfoldingPi.notation';
    let notation = 'zero', pointerInfo = null;
    try { if (localStorage.getItem(NOTATION_KEY) === 'int') notation = 'int'; }
    catch (e) { console.error('unfoldingPi: Notation nicht lesbar', e); }
    const placeEl = document.getElementById('stellen');
    function placeNumber(i) {
      const off = notation === 'int' ? (Number(constOf(cid) ? constOf(cid).intPart : 0) || 0) : 0;
      return (i === 0 ? 0 : Math.max(1, i - 1)) + off;
    }
    function placeText(info) {
      if (!info) return '\u00a0';
      if (info.c) {
        // Glied: centrum = 0., erste Nachkommastelle = 1.; "change notation" zaehlt ab der Ganzzahl der Konstante
        const gname = nameOf(info.c), off = notation === 'int' ? (Number(constOf(info.c).intPart) || 0) : 0;
        const g = (k) => fmtDE(k + off, 0) + '.';
        if (info.kind === 'digit') return info.index === 0 ? 'centrum of ' + gname + ' (a little circle)' : g(info.index) + ' digit of ' + gname;
        if (info.kind === 'left') return g(0) + '-' + g(info.hi) + ' digits of ' + gname;
        if (info.kind === 'right') return g(info.lo) + '-every digit of ' + gname;
        return g(0) + '-every digit of ' + gname;
      }
      const name = cid === 'pi' ? 'pi' : symbolOf(cid);
      const n = (i) => fmtDE(placeNumber(i), 0) + '.';
      if (info.kind === 'digit') return info.index === 1 ? 'centrum of ' + name + ' (a little circle)' : n(info.index) + ' digit of ' + name;
      if (info.kind === 'left') return n(0) + '-' + n(info.hi) + ' digits of ' + name;
      if (info.kind === 'right') return n(info.lo) + '-every digit of ' + name;
      return n(0) + '-every digit of ' + name;
    }
    function showPlace() { placeEl.textContent = placeText(pointerInfo); }
    function setNotation(v) {
      if (v !== 'zero' && v !== 'int') throw new TypeError('Notation unbekannt: ' + v);
      notation = v;
      try { localStorage.setItem(NOTATION_KEY, v); }
      catch (e) { console.error('unfoldingPi: Notation nicht speicherbar', e); }
      showPlace();
    }

    // ─── Konstanten-Rechner (tools/irrational.js) ───
    function fail(message) {
      if (piError) return;
      piError = message;
      console.error('[unfoldingPi] ' + message);
      stage.classList.remove('warte', 'hinweis');
      stage.classList.add('fehler');
      driftEl.disabled = true;
      driftValue = 0;
      panel.set('drift', 0);
      view.setLocked(true);
      view.invalidate();
      if (multi) for (const it of multi.items) { it.view.setLocked(true); it.view.invalidate(); }
    }
    // Nicht sperrender Hinweis (Rueckfall auf BigInt ohne WebAssembly): gleicher Rahmenweg wie fail(), der Drift laeuft weiter.
    function notice(message) {
      if (piNotice || piError) return;
      piNotice = message;
      console.warn('[unfoldingPi] ' + message);
      stage.classList.add('hinweis');
      view.invalidate();
    }
    function onLimit(lim) {
      limitState = lim;
      stage.classList.remove('warte');
      if (file) { if (handle) handle.close(); view.invalidate(); return; }   // Geraetegrenze: die Datei traegt weiter
      if (lim.kind === 'device' && !document.getElementById('limit-hint')) {
        const hint = document.createElement('div');
        hint.id = 'limit-hint';
        hint.className = 'limit-hint';
        hint.textContent = 'use better hardware to get access to more digits';
        stage.appendChild(hint);
      }
      if (handle) handle.close(); // der Worker gibt seinen WASM-Speicher frei; die Anzeige bleibt
      view.invalidate();
    }
    function onDigits(u8, offset) {
      try {
        view.appendDigits(u8, offset);
      } catch (e) {
        if (e instanceof RangeError) {
          // V8-Stringgrenze: Rechenwerk-Grenze, kein Text, die Anzeige bleibt stehen.
          const digits = view.state().chainLength - 2;
          console.warn('[unfoldingPi] engine limit: string length at ' + digits + ' digits');
          limitState = { kind: 'engine', reason: 'string length', digits };
          stage.classList.remove('warte');
          if (handle) handle.close();
          return;
        }
        if (e instanceof UnfoldingView.DigitError) { fail(e.message); return; }
        fail('Stellen nicht verarbeitbar: ' + (e && e.message ? e.message : e));
      }
    }
    function startFile() {
      if (file) { file.close(); file = null; }
      view.setRemote(null);
      if (cid !== 'pi' || testCfg().file === false) return;
      file = PiFile.create({
        url: testCfg().fileUrl || FILE_URL, digits: FILE_DIGITS,
        onError: (e) => fail('Pi-Datei: ' + e.message),
        onChange: () => view.invalidate()
      });
      view.setRemote(file);
    }
    function startWorker() {
      if (handle) { handle.close(); handle = null; }
      startFile();
      limitState = null;
      requestedTotal = 0;
      piError = null;
      driftEl.disabled = false;
      view.setLocked(false);
      stage.classList.remove('warte', 'hinweis', 'fehler');
      const old = document.getElementById('limit-hint');
      if (old) old.remove();
      piNotice = null;
      startChain();
      try {
        handle = Irrational.open(cid, { onDigits, onLimit, onNotice: notice, onError: (e) => fail(e.message) }, window.unfoldingPiTest);
      } catch (e) { fail('Rechner nicht startbar: ' + e.message); return; }
      requestDigits(2000);
    }
    function requestDigits(total) {
      if (!handle || piError || limitState || total <= requestedTotal) return;
      const t = Math.min(total, deviceCap());
      if (t <= requestedTotal) return;
      requestedTotal = t;
      handle.want(t);
    }
    function symbolOf(id) { return constOf(id).symbol; }
    function setConstant(id) {
      if (id === cid) return;
      cid = id;
      glieder = [{ c: id, dir: 'r' }];
      const u = new URL(location.href);
      u.searchParams.set('c', id);
      history.replaceState(null, '', u);
      document.title = id === 'pi' ? '(un)foldingPi' : '(un)folding ' + symbolOf(id);
      showPlace();
      startWorker();
      view.rewind();
      centreSingle();
    }

    // ─── Glieder: Kette und Stern ───
    // Ein Glied ist der bisherige Modus (#pi). Ab zwei Gliedern bekommt jedes Glied eine eigene Canvas und Ansicht: nur
    // Nachkommastellen ab einem centrum (Kreis), ausgerollt, Schrift wie #pi. Kette: die Breite in gleiche Plaetze geteilt,
    // r beginnt am linken Rand seines Platzes, l (gespiegelt) am rechten; l gefolgt von r teilt sich ein centrum. Stern: alle
    // Strahlen aus der Buehnenmitte, Winkel 360/n; ein Strahl ueber 90..270 Grad laeuft gespiegelt (Ziffern nie kopfueber).
    // Gleiche Konstanten teilen einen Rechner. Keine Pi-Datei: die Geraetegrenze gilt wie bei e.
    let glieder = [{ c: cid, dir: 'r' }], form = 'kette', multi = null, pointerItem = null;
    let factorValue = view.state().factor;
    const MARGIN = UnfoldingView.MARGIN;
    const nameOf = (id) => (id === 'pi' ? 'pi' : symbolOf(id));
    const fontSize = () => Math.min(56, Math.max(28, Math.round(window.innerWidth * 0.06)));
    const cellCtx = document.createElement('canvas').getContext('2d');
    // Zellbreite wie in tools/unfolding-view.js (measure): das centrum jedes Glieds liegt bei MARGIN + w/2 auf seiner Achse.
    function cellW() {
      const dpr = window.devicePixelRatio || 1;
      cellCtx.font = (fontSize() * dpr) + 'px "Courier New", Courier, monospace';
      return Math.max(1, Math.round(cellCtx.measureText('0').width)) / dpr;
    }
    function parseGlieder() {
      const k = params.get('kette'), s = params.get('stern');
      if (k === null && s === null) return null;
      const star = k === null, out = [], bad = [];
      for (const part of (star ? s : k).split('.').filter(Boolean)) {
        const m = star ? /^([a-z0-9]+)$/.exec(part) : /^([a-z0-9]+)-([lr])$/.exec(part);
        if (m && constOf(m[1])) out.push({ c: m[1], dir: star ? 'r' : m[2] });
        else bad.push(part);
      }
      return { form: star ? 'stern' : 'kette', list: out, bad };
    }
    function saveUrl() {
      const u = new URL(location.href);
      for (const k of ['c', 'kette', 'stern']) u.searchParams.delete(k);
      if (glieder.length === 1) u.searchParams.set('c', glieder[0].c);
      else if (form === 'kette') u.searchParams.set('kette', glieder.map((g) => g.c + '-' + g.dir).join('.'));
      else u.searchParams.set('stern', glieder.map((g) => g.c).join('.'));
      history.replaceState(null, '', u);
    }
    function updateWaiting() {
      if (!multi) return;
      stage.classList.toggle('warte', !piError && multi.items.some((it) => it.front && !multi.workers.get(it.c).limit));
    }
    function showLimitHint() {
      if (document.getElementById('limit-hint')) return;
      const hint = document.createElement('div');
      hint.id = 'limit-hint';
      hint.className = 'limit-hint';
      hint.textContent = 'use better hardware to get access to more digits';
      stage.appendChild(hint);
    }
    function openWorker(m, c) {
      const wk = { handle: null, req: 0, limit: null };
      m.workers.set(c, wk);
      const live = () => multi === m;
      const onMDigits = (u8, offset) => {
        if (!live()) return;
        for (const it of m.items) {
          if (it.c !== c) continue;
          try { it.view.appendDigits(u8, offset); }
          catch (e) {
            if (e instanceof RangeError) {
              console.warn('[unfoldingPi] engine limit (' + c + '): string length at ' + (it.view.state().chainLength - 1) + ' digits');
              wk.limit = { kind: 'engine', reason: 'string length' };
              if (wk.handle) wk.handle.close();
              updateWaiting();
              return;
            }
            fail(e instanceof UnfoldingView.DigitError ? e.message : 'Stellen nicht verarbeitbar: ' + (e && e.message ? e.message : e));
            return;
          }
        }
      };
      const onMLimit = (lim) => {
        if (!live()) return;
        wk.limit = lim;
        if (lim.kind === 'device') showLimitHint();
        if (wk.handle) wk.handle.close();
        updateWaiting();
      };
      try {
        wk.handle = Irrational.open(c, { onDigits: onMDigits, onLimit: onMLimit, onNotice: (msg) => { if (live()) notice(msg); }, onError: (e) => { if (live()) fail(e.message); } }, window.unfoldingPiTest);
      } catch (e) { fail('Rechner nicht startbar: ' + e.message); }
      return wk;
    }
    function wantDigits(m, c, total) {
      const wk = m.workers.get(c) || openWorker(m, c);
      if (!wk.handle || wk.limit || piError || total <= wk.req) return;
      wk.req = total;
      wk.handle.want(total);
    }
    function teardownMulti() {
      if (!multi) return;
      const m = multi;
      multi = null;
      for (const wk of m.workers.values()) if (wk.handle) wk.handle.close();
      for (const it of m.items) { it.view.destroy(); it.canvas.remove(); if (it.label) it.label.remove(); }
      if (m.punkt) m.punkt.remove();
      if (m.themeObs) m.themeObs.disconnect();
      if (pointerItem) { pointerItem = null; pointerInfo = null; showPlace(); }
    }
    // Lage jedes Glieds; setzt it.dir/it.rot und die Canvas-Geometrie (CSS-px der Buehne).
    // Freie Flaeche: Desktop rechts neben dem Bedienfeld, Handy ueber dem Bedienblatt. Ihre Mitte ist die Konstante: dort steht der Punkt.
    function freeArea() {
      const SW = stage.clientWidth, SH = stage.clientHeight;
      let x0 = 0, y1 = SH;
      const pr = panel && panel.el ? panel.el.getBoundingClientRect() : null, sr = stage.getBoundingClientRect();
      if (pr && pr.width > 0) {
        if (pr.width < SW * 0.5 && pr.left - sr.left < 50) x0 = Math.min(pr.right - sr.left + 8, SW * 0.5);
        else if (pr.top - sr.top > SH * 0.3) y1 = pr.top - sr.top - 8;
      }
      return { x0, x1: SW, y0: 0, y1, cx: (x0 + SW) / 2, cy: y1 / 2 };
    }
    function layoutMulti() {
      if (!multi) return;
      const SW = stage.clientWidth, SH = stage.clientHeight, w = cellW(), p0 = MARGIN + w / 2, n = multi.items.length;
      const A = freeArea();
      if (form === 'kette') {
        const dh = dotMetrics().half, dc = dh + 0.5;
        // Bezugsstelle: gerade Zahl = mittlere Verbindungsstelle (Grenze n/2), ungerade = Punkt des mittleren Glieds (ANNAHME)
        const mid = Math.floor(n / 2);
        const j = n % 2 === 0 ? mid : (multi.items[mid].dir === 'r' ? mid : mid + 1);
        let s = Infinity;
        multi.items.forEach((it, i) => {
          const a = i - j;
          if (it.dir === 'r') { if (a < 0) s = Math.min(s, (A.cx - p0 - A.x0) / -a); if (a + 1 > 0) s = Math.min(s, (A.x1 - A.cx + p0) / (a + 1)); }
          else { if (a + 1 > 0) s = Math.min(s, (A.x1 - A.cx - p0) / (a + 1)); if (a < 0) s = Math.min(s, (A.cx + p0 - A.x0) / -a); }
        });
        const slotW = Math.max(2 * p0, s), bd = (i) => A.cx + (i - j) * slotW;
        const cx = multi.items.map((it, i) => (it.dir === 'r' ? bd(i) : bd(i + 1)));
        multi.items.forEach((it, i) => {
          const nx = multi.items[i + 1];
          let left = it.dir === 'r' ? bd(i) - p0 : bd(i + 1) + p0 - slotW, width = slotW, z = 1;
          // Das verdichtete Ende stoesst ohne Luecke an den Punkt des Nachbarn (Ende = Rand - MARGIN; Punkt = Tintenrand).
          if (ABUT && nx && it.dir === 'r' && nx.dir === 'r') { width = cx[i + 1] - dh + MARGIN - left; z = 2; }
          if (ABUT && i > 0 && it.dir === 'l' && multi.items[i - 1].dir === 'l') { const r = left + width; left = cx[i - 1] + dh - MARGIN; width = r - left; z = 2; }
          it.rot = 0;
          it.cl = cx[i] - left;   // centrum in Canvas-Koordinaten
          it.lx = cx[i]; it.ly = A.cy;
          Object.assign(it.canvas.style, {
            left: left + 'px', top: '0px', width: width + 'px', height: A.y1 + 'px', zIndex: String(z),
            transform: '', transformOrigin: '',
            clipPath: CLIP ? (it.dir === 'r' ? 'inset(0 0 0 ' + (cx[i] + dc - left) + 'px)' : 'inset(0 ' + (left + width - (cx[i] - dc)) + 'px 0 0)') : ''
          });
        });
        drawDots(cx.map((x) => ({ x, y: A.cy })));
        placeLabels();
        return;
      }
      const xmin = A.x0;
      const cx = A.cx, cy = A.cy, BH = Math.round(3 * fontSize()), dh = dotMetrics().half, dc = dh + 0.5;
      multi.cx = cx; multi.cy = cy;
      multi.items.forEach((it, k) => {
        const th = 360 * k / n, rad = th * Math.PI / 180, co = Math.cos(rad), si = Math.sin(rad);
        const tx = co > 1e-9 ? (SW - cx) / co : co < -1e-9 ? (cx - xmin) / -co : Infinity;
        const ty = si > 1e-9 ? (A.y1 - cy) / si : si < -1e-9 ? cy / -si : Infinity;
        const CW = Math.max(2 * p0, Math.min(tx, ty) - 4 + p0);
        const flip = th > 90 && th < 270;
        it.angle = th;
        it.rot = flip ? th - 180 : th;
        it.dir = flip ? 'l' : 'r';
        it.cl = flip ? CW - p0 : p0;   // centrum auf der Achse der Canvas (ungespiegelt)
        Object.assign(it.canvas.style, {
          left: (cx - it.cl) + 'px', top: (cy - BH / 2) + 'px', width: CW + 'px', height: BH + 'px',
          transformOrigin: it.cl + 'px ' + (BH / 2) + 'px', transform: 'rotate(' + it.rot + 'deg)',
          clipPath: CLIP ? (flip ? 'inset(0 ' + (CW - it.cl + dc) + 'px 0 0)' : 'inset(0 0 0 ' + (it.cl + dc) + 'px)') : ''
        });
      });
      drawDots([{ x: cx, y: cy }]);
      placeLabels();
    }
    // Der Dezimalpunkt: genau einer je Verbindungsstelle, auf einer eigenen Canvas ueber den Gliedern, nie Teil einer Kette
    // (die Glieder zeichnen ihn nicht, dot: false), damit er beim Sausen, Ziehen und Rad fest steht. Das Glyph "." der Schrift,
    // waagerecht mit der Tintenmitte auf dem centrum, senkrecht wie die Ziffern (Grundlinie, nicht Mitte).
    const ABUT = true, CLIP = true, DEDUPE = true, PUNKT_X = (pt) => pt.x;
    // Stellenanzeige je Glied: ab welcher Stelle sein Inhalt gerade sichtbar ist (jedes Glied verschiebt sich einzeln).
    function labelText(it) {
      const off = notation === 'int' ? (Number(constOf(it.c).intPart) || 0) : 0;
      const k = Math.floor(it.view.state().startIndex + 1e-9);
      return nameOf(it.c) + ' ab ' + fmtDE(k + off, 0) + '.';
    }
    function placeLabels() {
      if (!multi) return;
      const w = cellW(), BH = Math.round(3 * fontSize());
      multi.items.forEach((it) => {
        if (!it.label) return;
        let x, y;
        if (form === 'kette') { x = it.lx + (it.dir === 'r' ? 1 : -1) * 3 * w; y = it.ly + BH * 0.75; }
        else {
          const a = it.angle * Math.PI / 180, r = 6 * w;
          x = multi.cx + Math.cos(a) * r - Math.sin(a) * BH * 0.8; y = multi.cy + Math.sin(a) * r + Math.cos(a) * BH * 0.8;
        }
        it.label.style.left = x + 'px'; it.label.style.top = y + 'px';
      });
    }
    function tickLabels(m) {
      if (multi !== m) return;
      for (const it of m.items) {
        if (!it.label || !it.view) continue;
        const t = labelText(it);
        if (t !== it.labelText) { it.labelText = t; it.label.textContent = t; }
      }
      requestAnimationFrame(() => tickLabels(m));
    }
    function dotMetrics() {
      cellCtx.font = fontSize() + 'px "Courier New", Courier, monospace';
      cellCtx.textAlign = 'center';
      const m = cellCtx.measureText('.');
      return { l: m.actualBoundingBoxLeft, r: m.actualBoundingBoxRight, up: m.actualBoundingBoxAscent, down: m.actualBoundingBoxDescent, half: (m.actualBoundingBoxLeft + m.actualBoundingBoxRight) / 2 };
    }
    function drawDots(raw) {
      if (!multi || !multi.punkt) return;
      const pts = [];
      for (const q of raw) if (!DEDUPE || !pts.some((o) => Math.abs(o.x - q.x) < 0.5 && Math.abs(o.y - q.y) < 0.5)) pts.push(q);
      multi.points = pts;
      const cv = multi.punkt, dpr = window.devicePixelRatio || 1, SW = stage.clientWidth, SH = stage.clientHeight;
      cv.style.width = SW + 'px'; cv.style.height = SH + 'px';
      cv.width = Math.max(1, Math.round(SW * dpr)); cv.height = Math.max(1, Math.round(SH * dpr));
      const g = cv.getContext('2d'), dm = dotMetrics();
      g.scale(dpr, dpr);
      g.font = fontSize() + 'px "Courier New", Courier, monospace';
      g.textAlign = 'center'; g.textBaseline = 'middle';   // wie die Ziffern der Glieder: dann sitzt der Punkt auf deren Grundlinie
      g.fillStyle = getComputedStyle(stage).color;
      for (const q of pts) g.fillText('.', PUNKT_X(q) - (dm.r - dm.l) / 2, q.y);
    }
    // Stern: Zeigerlage auf der gedrehten Achse = centrum + Projektion des Zeigers (ab centrum) auf die Achsrichtung
    function starLocal(it, e) {
      const r = stage.getBoundingClientRect(), a = it.rot * Math.PI / 180;
      return it.cl + (e.clientX - r.left - multi.cx) * Math.cos(a) + (e.clientY - r.top - multi.cy) * Math.sin(a);
    }
    function buildMulti() {
      teardownMulti();
      if (handle) { handle.close(); handle = null; }
      if (file) { file.close(); file = null; }
      view.setRemote(null);
      view.setLocked(true);
      canvas.style.visibility = 'hidden';
      limitState = null;
      piError = null;
      piNotice = null;
      driftEl.disabled = false;
      stage.classList.remove('warte', 'hinweis', 'fehler');
      const old = document.getElementById('limit-hint');
      if (old) old.remove();
      const m = { items: [], workers: new Map(), punkt: null, points: [], themeObs: null };
      multi = m;
      for (const g of glieder) {
        const cv = document.createElement('canvas');
        cv.className = 'glied';
        stage.insertBefore(cv, placeEl);
        const lb = document.createElement('div');
        lb.className = 'stelle';
        stage.insertBefore(lb, placeEl);
        m.items.push({ c: g.c, dir: g.dir, canvas: cv, label: lb, labelText: '', view: null, front: false, rot: 0, angle: 0, cl: 0 });
      }
      m.punkt = document.createElement('canvas');
      m.punkt.className = 'punkt';
      stage.insertBefore(m.punkt, placeEl);
      m.themeObs = new MutationObserver(() => { if (multi === m) drawDots(m.points); });
      for (const el of [document.documentElement, document.body]) m.themeObs.observe(el, { attributes: true, attributeFilter: ['style', 'class'] });
      layoutMulti();
      for (const it of m.items) {
        it.view = UnfoldingView.create(it.canvas, {
          intPart: '', decimals: it.c === 'pi' ? RESERVE.slice(1) : '', dot: false,
          origin: MARGIN, unrolled: true, fixedStart: true, fontPx: fontSize, dir: it.dir, factor: factorValue,
          colorElement: stage,
          localX: form === 'stern' ? (e) => starLocal(it, e) : undefined,
          rate: () => -driftValue,
          onNeedDigits: (total) => { if (multi === m) wantDigits(m, it.c, total); },
          onFront: (atFront) => { it.front = atFront; updateWaiting(); },
          onPointerInfo: (info) => {
            if (info) { pointerItem = it; pointerInfo = Object.assign({ c: it.c }, info); }
            else if (pointerItem === it) { pointerItem = null; pointerInfo = null; }
            else return;
            showPlace();
          }
        });
      }
      for (const c of new Set(m.items.map((it) => it.c))) wantDigits(m, c, 2000);
      layoutMulti();
      tickLabels(m);
    }
    function toSingle() {
      teardownMulti();
      canvas.style.visibility = '';
      cid = glieder[0].c;
      document.title = cid === 'pi' ? '(un)foldingPi' : '(un)folding ' + symbolOf(cid);
      panel.set('const', cid);
      startWorker();
      view.rewind();
      view.resize();
      centreSingle();
    }
    function structure() {
      saveUrl();
      buildGliederPanel();
      if (glieder.length === 1) toSingle();
      else buildMulti();
    }
    function addGlied() {
      if (glieder.length === 1) glieder = [{ c: glieder[0].c, dir: 'l' }, { c: glieder[0].c, dir: 'r' }];
      else glieder.push({ c: 'pi', dir: 'r' });
      structure();
    }
    function buildGliederPanel() {
      panel.removeSection('glieder');
      panel.beginSection('glieder', { title: 'Glieder' });
      const many = glieder.length > 1;
      if (many) {
        panel.addButtonGroup('form', {
          buttons: [
            { key: 'kette', label: 'Kette', title: 'hintereinander: ein Verdichtungspunkt je Glied', onClick: () => { if (form !== 'kette') { form = 'kette'; structure(); } } },
            { key: 'stern', label: 'Stern', title: 'alle Strahlen laufen auf ein centrum zu', onClick: () => { if (form !== 'stern') { form = 'stern'; structure(); } } }
          ]
        });
        for (const b of panel.bodyEl.querySelectorAll('.ctrl-row[data-key="form"] .ctrl-button')) b.setAttribute('aria-pressed', String(b.dataset.buttonKey === form));
        glieder.forEach((g, i) => {
          panel.addSelect('glied' + i, {
            label: 'Glied ' + (i + 1), value: g.c,
            options: CONSTS.map((k) => ({ value: k.id, label: k.symbol })),
            onChange: (v) => { if (v !== g.c) { g.c = v; structure(); } }
          });
          const buttons = [];
          if (form === 'kette') buttons.push({ key: 'dir', label: g.dir === 'r' ? '→' : '←', title: 'Richtung umkehren', onClick: () => { g.dir = g.dir === 'r' ? 'l' : 'r'; structure(); } });
          buttons.push({ key: 'del', label: 'entfernen', title: 'Glied entfernen', onClick: () => { glieder.splice(i, 1); structure(); } });
          panel.addButtonGroup('glied' + i + '-actions', { buttons });
        });
      }
      panel.addButton('add', { label: '+ Glied', onClick: addGlied });
      panel.endSection();
      panel.setRowVisibility('const', !many);
    }
    // Einzelnes pi/e/...: die Zeile liegt in der freien Flaeche (Canvas = freie Flaeche), die 3 steht buendig links vom Punkt-Glyph,
    // der Punkt in der Mitte. (Hier ist der Punkt Teil der Kette und laeuft beim Rollen mit.)
    function centreSingle() {
      if (multi) return;
      const A = freeArea(), SH = stage.clientHeight;
      canvas.style.width = (stage.clientWidth - A.x0) + 'px';
      canvas.style.marginLeft = A.x0 + 'px';
      canvas.style.marginBottom = (SH - A.y1) + 'px';
      view.resize();
      const st = view.state();
      view.setOrigin(canvas.clientWidth / 2 - (String(constOf(cid) ? constOf(cid).intPart : 3).length + 0.5) * st.w);
    }
    window.addEventListener('resize', () => { if (multi) layoutMulti(); else centreSingle(); });

    // ─── Boot ───
    panel = Controls.createPanel({ position: 'left', id: 'pi-compression' });
    if (window.ResizeObserver && panel.el) new ResizeObserver(() => { if (multi) { layoutMulti(); for (const it of multi.items) if (it.view) it.view.resize(); } else centreSingle(); }).observe(panel.el);
    centreSingle();
    panel.addSlider('drift', {
      label: 'Sausen', min: -DRIFT_MAX, max: DRIFT_MAX, step: 1, value: 0, decimals: 0, transform: driftTransform,
      onChange: (v) => { driftValue = +v || 0; }
    });
    driftEl = panel.bodyEl.querySelector('.ctrl-row[data-key="drift"] .ctrl-range');
    driftEl.id = 'drift';
    driftEl.setAttribute('aria-label', 'Sausen');
    // Verdichtung je Abstand der Enden, Faktor 0..1 (siehe tools/unfolding-view.js). Reglerweg s: bis 0,5 linear, darueber
    // kubisch auf 1 zu (f = 1 - 0,5 (2 (1 - s))^3), damit nahe 1 jeder Schritt feiner wird.
    const factorTransform = {
      toSliderValue(v) { const f = Math.max(0, Math.min(1, +v || 0)); return f <= 0.5 ? f : 1 - Math.cbrt(2 * (1 - f)) / 2; },
      fromSliderValue(s) { const x = Math.max(0, Math.min(1, +s || 0)); return x <= 0.5 ? x : 1 - 0.5 * Math.pow(2 * (1 - x), 3); },
      formatDisplayValue(v, decimals) { return fmtDE(v, decimals); },
      parseDisplayValue(text) { return parseDE(text); },
      formatConfigValue(v) { return fmtDE(v, 20); },
      parseConfigValue(text) { return parseDE(text); }
    };
    panel.addSlider('f', {
      label: 'Verdichtungsfaktor', min: 0, max: 1, step: 0.001, value: view.state().factor, decimals: 12, transform: factorTransform,
      onChange: (v) => {
        factorValue = +v || 0;
        view.setFactor(factorValue);
        if (multi) for (const it of multi.items) it.view.setFactor(factorValue);
      }
    });
    panel.addSelect('const', {
      label: 'Konstante', value: cid,
      options: CONSTS.map((k) => ({ value: k.id, label: k.symbol })),
      onChange: setConstant
    });
    panel.addButton('notation', { label: 'change notation', onClick: () => setNotation(notation === 'zero' ? 'int' : 'zero') });
    // Zustand aus der URL: ?kette=pi-l.pi-r oder ?stern=pi.pi.e (sonst ?c=<id>, ein Glied)
    const parsed = parseGlieder();
    if (parsed) { form = parsed.form; if (parsed.list.length) glieder = parsed.list; cid = glieder[0].c; }
    buildGliederPanel();
    if (glieder.length > 1) buildMulti();
    else {
      panel.set('const', cid);
      startChain();
      if (!constOf(cid)) fail('Unbekannte Konstante: ' + cid);
      else if (cid !== 'pi') document.title = '(un)folding ' + symbolOf(cid);
      if (!piError) startWorker();
    }
    if (parsed && parsed.bad.length) fail('Unbekannte Glieder: ' + parsed.bad.join(', '));

    // Nur lesende Zustandsabfrage für Tests.
    window.unfoldingPi = {
      state() {
        return Object.assign(view.state(), {
          constant: cid, limit: limitState, error: piError, notice: piNotice,
          waiting: stage.classList.contains('warte'), requestedTotal, form: multi ? form : null, count: glieder.length
        });
      },
      digits() { return view.digits(); },
      shown() { return view.shown(); },
      file() { return file ? Object.assign(file.stats(), { length: file.length }) : null; },
      fileAt(i) { return file ? file.at(i) : null; },
      fileWant(lo, hi) { if (file) file.want(lo, hi, 0); },
      columns() { return view.columns(); },
      renderLog() { return view.renderLog(); },
      glyphAlpha() { return view.glyphAlpha(); },
      glyphInk() { return view.glyphInk(); },
      hover(x) { view.setHover(x); },
      place() { return { text: placeEl.textContent, notation, info: pointerInfo }; },
      // Glieder im Mehrgliedmodus (sonst null): Konstante, Richtung der Ansicht, Winkel (Stern), Zustand, Kette, Canvas
      glieder() {
        return multi ? multi.items.map((it) => ({ c: it.c, dir: it.dir, angle: it.angle, rot: it.rot, cl: it.cl, state: it.view.state(), digits: it.view.digits(), canvas: it.canvas })) : null;
      },
      // Punkt-Canvas im Mehrgliedmodus (sonst null) und die Stellen der Punkte (CSS-px der Buehne)
      punkt() { return multi ? { canvas: multi.punkt, points: multi.points } : null; },
      controls: panel
    };
  })();
  </script>

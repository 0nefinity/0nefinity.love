<html lang="de">
<head>
  <meta charset="UTF-8">

  <link href="/meta.css" rel="stylesheet">

  <title>unfoldingPi</title>
  <style>
    html, body { height: 100%; overflow: hidden; touch-action: none; }
    .stage {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: var(--bg-color);
      color: var(--text-color);
      user-select: none; -webkit-user-select: none;
    }
    .stream-wrap {
      flex: 1;
      width: 100%;
      position: relative;
      overflow: hidden;
      cursor: ew-resize;
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 4%, #000 96%, transparent 100%);
              mask-image: linear-gradient(90deg, transparent 0, #000 4%, #000 96%, transparent 100%);
    }
    .stream {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0; height: 0;
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(28px, 6vw, 56px);
      line-height: 1;
      white-space: nowrap;
    }
    .stream span {
      position: absolute;
      top: 0;
      transform: translate(-50%, -50%);
      transform-origin: center center;
      text-align: center;
      will-change: left, width, transform;
      overflow: hidden;
    }
    .slider-row {
      width: 100%;
      padding: 1rem;
      display: flex; justify-content: center;
      box-sizing: border-box;
    }
    .slider-row input[type="range"] {
      width: min(28rem, 90vw);
    }
  </style>
</head>
<body>
  <div class="stage _018">
    <div class="stream-wrap" id="streamWrap">
      <div class="stream" id="stream"></div>
    </div>
    <div class="slider-row">
      <input type="range" min="-100" max="100" value="0" step="0.1" id="drift" aria-label="Drift">
    </div>
  </div>

      "30990796547376125517656751357517829666454779174501129961489030463994713296210734"+
      "04375189573596145890193897131117904297828564750320319869151402870808599048010941"+
      "21472213179476477726224142548545403321571853061422881375850430633217518297986622"+
      "37172159160771669254748738986654949450114654062843366393790039769265672146385306"+
      "73609657120918076383271664162748888007869256029022847210403172118608204190004229"+
      "66171196377921337575114959501566049631862947265473642523081770367515906735023507"+
      "28354056704038674351362222477158915049530984448933309634087807693259939780541934"+
      "1447377441842631298608099888687413260472";

    // Pi-Stelle für Index i:
    //  i =  0 → '3'
    //  i =  1 → ','
    //  i >= 2 → PI_DIGITS[i - 1]
    //  i < 0 → ' ' (leerer Raum vor der 3)
    function piChar(i) {
      if (i === 0) return '3';
      if (i === 1) return ',';
      if (i >= 2 && (i - 1) < PI_DIGITS.length) return PI_DIGITS[i - 1];
      return ' ';
    }

    const streamWrap = document.getElementById('streamWrap');
    const stream     = document.getElementById('stream');
    const driftEl    = document.getElementById('drift');

    // ─── State ───
    // streamOffset: fraktionaler "Center"-Index — welche Pi-Stelle sitzt visuell in der Mitte
    let streamOffset = 0;
    // compressionScale: Slider-Wert. Klein = aggressiv verdichtet, groß = sanft.
    // entspricht s in width(i) = baseWidth * exp(-i / s)
    let compressionScale = 0.6;

    let baseWidth = 18;     // ch-width in px, neu gemessen bei resize
    let viewportW = 0;
    let viewportH = 0;

    let spans = [];          // pool von DOM spans
    let renderQueued = false;

    function measureBaseWidth() {
      const probe = document.createElement('span');
      probe.style.cssText = 'visibility:hidden;position:absolute;font-family:inherit;font-size:inherit;left:-9999px;';
      probe.textContent = '0';
      stream.appendChild(probe);
      const w = probe.getBoundingClientRect().width || 18;
      stream.removeChild(probe);
      return w;
    }

    function measureViewport() {
      const r = streamWrap.getBoundingClientRect();
      viewportW = r.width;
      viewportH = r.height;
    }

    function ensureSpanPool(n) {
      while (spans.length < n) {
        const sp = document.createElement('span');
        stream.appendChild(sp);
        spans.push(sp);
      }
      // surplus verstecken (nicht entfernen, spart Allokationen)
      for (let i = n; i < spans.length; i++) {
        if (spans[i].style.display !== 'none') spans[i].style.display = 'none';
      }
    }

    // Kumulative Position: x_cum(k) = Σ width(j) für j=0..k-1
    //                              = baseWidth * s * (1 - exp(-k/s))
    // → Position der k-ten Stelle (Stellen-Mitte) ≈ x_cum(k) + width(k)/2
    function cumulativeX(k, s) {
      return baseWidth * s * (1 - Math.exp(-k / s));
    }
    function widthAt(k, s) {
      return baseWidth * Math.exp(-k / s);
    }

    // Sichtbares Limit pro Seite: weiter zählen bis width < halbPixel
    function visibleLimit(s) {
      // exp(-k/s) < 0.5/baseWidth  →  k > s * ln(baseWidth/0.5)
      const k = Math.ceil(s * Math.log(baseWidth / 0.5));
      return Math.max(1, Math.min(220, k));
    }

    function render() {
      renderQueued = false;
      const s = Math.max(0.05, compressionScale);
      const halfW = viewportW / 2;

      // baseIdx = ganzzahlige Pi-Stelle die der Mitte am nächsten ist
      const baseIdx = Math.floor(streamOffset);
      const frac    = streamOffset - baseIdx; // 0..1 → Mitte sitzt ein Stückchen rechts von baseIdx

      // Wir bauen pro Seite eine Liste von (piIdx, x, w).
      // Center selbst sitzt bei x=0 (relativ zum stream-Element, das in der Mitte sitzt).
      // Rechts: k = 1, 2, 3, ... → piIdx = baseIdx + k → x = +cumulativeX(k - frac, s) ... klein-frac shift
      // Links:  k = 1, 2, 3, ... → piIdx = baseIdx - k + 1 → x = -cumulativeX(k - 1 + frac, s) ...
      //
      // Einfacher: wir berechnen Positionen für "Stellen rechts vom Center" und "Stellen links vom Center"
      // wobei Center die kontinuierliche Position streamOffset ist.
      //
      // Distance d_k = Abstand der k-ten Nachbarn-Stelle vom Center (in Stellen-Einheiten):
      //   rechts: d = (k - frac)  für k = 1, 2, 3, ...   (k=1 ist nächste Stelle rechts)
      //                Stelle = baseIdx + k
      //   center: d = -frac für die Stelle baseIdx (rechts vom geom. Mittelpunkt wenn frac>0… nee)
      //   links:  d = (k + frac) für k = 1, 2, 3, ...   (k=1 ist nächste Stelle links)
      //                Stelle = baseIdx - k + 1   (das +1 macht erstmal komisch — wir vereinheitlichen)
      //
      // Vereinheitlichung: wir gehen ALLE ganzzahligen Pi-Indizes durch, j = baseIdx-K .. baseIdx+K.
      // Für jeden Index j ist die "kontinuierliche Distanz" zum Center: dist = j - streamOffset.
      //   dist > 0 → rechts vom Center
      //   dist < 0 → links vom Center
      //   |dist| ist der Stellen-Abstand.
      //
      // Position: x(dist) = sign(dist) * cumulativeX(|dist|, s)
      // Breite:   w(dist) = widthAt(|dist|, s)   (approx; an der Stellen-Mitte ausgewertet)
      //
      // Sichtbarkeit: solange |x| < halfW UND w >= 0.5px

      const lim = visibleLimit(s);

      let usedSpans = 0;

      // Stellen vom Center nach außen — abwechselnd links und rechts würde am natürlichsten aussehen,
      // aber für DOM-Order egal. Wir iterieren rechts dann links.
      for (let side = 0; side < 2; side++) {
        const dir = side === 0 ? +1 : -1;
        for (let k = (side === 0 ? 0 : 1); k <= lim; k++) {
          // index in Pi: j = baseIdx + dir * k (für side=0: rechts inkl. baseIdx selbst bei k=0)
          // Aber Achtung: für links wollen wir nicht baseIdx nochmal. side=1 startet bei k=1.
          const j = baseIdx + dir * k;
          const dist = j - streamOffset; // kann positiv oder negativ sein
          const abs  = Math.abs(dist);
          const w = widthAt(abs, s);
          if (w < 0.4 && abs > 1) {
            // weiter außen wird's nur noch dünner → break
            break;
          }
          // Position: Vorzeichen der Distanz steuert Seite
          const sgn = dist >= 0 ? 1 : -1;
          const x = sgn * cumulativeX(abs, s);
          if (Math.abs(x) > halfW + w) {
            // außerhalb sichtbarem Bereich → break
            break;
          }
          const ch = piChar(j);
          if (ch === ' ') continue;

          // span aus Pool holen
          let sp = spans[usedSpans];
          if (!sp) {
            sp = document.createElement('span');
            stream.appendChild(sp);
            spans.push(sp);
          }
          if (sp.style.display === 'none') sp.style.display = '';
          if (sp.textContent !== ch) sp.textContent = ch;

          // Stellen-Breite via inline width + scaleX(min) als Fallback wenn font-natural zu breit
          const naturalW = baseWidth;
          // Wir setzen die Box-Breite + center via translate.
          // Für sehr schmale Stellen reicht die Box-Breite nicht — der Glyph wird trotzdem in voller Größe gerendert
          // und overflow:hidden schneidet ab. Damit nichts wegläuft, geben wir der Box max die volle naturalW.
          const boxW = Math.min(naturalW, Math.max(0.5, w));
          // horizontal squeeze via scaleX, sodass auch der Glyph schmaler wird (sonst sieht man Pixelmus)
          const scale = boxW / naturalW;

          sp.style.left  = x.toFixed(2) + 'px';
          sp.style.width = boxW.toFixed(2) + 'px';
          // height/lineHeight = font-size automatisch; vertikales Zentrieren via translate(-50%,-50%)
          sp.style.transform = 'translate(-50%, -50%) scaleX(' + scale.toFixed(4) + ')';

          usedSpans++;
        }
      }

      // überschüssige spans verstecken
      for (let i = usedSpans; i < spans.length; i++) {
        if (spans[i].style.display !== 'none') spans[i].style.display = 'none';
      }
    }

    function requestRender() {
      if (renderQueued) return;
      renderQueued = true;
      requestAnimationFrame(render);
    }

    // ─── Drift loop ───
    let lastFrameMs = 0;
    function loop(now) {
      if (!lastFrameMs) lastFrameMs = now;
      const dt = (now - lastFrameMs) / 1000;
      lastFrameMs = now;

      const rate = parseFloat(driftEl.value) || 0;
      if (Math.abs(rate) > 0.01) {
        // rate > 0 → Stream fließt nach links → nächste Pi-Stellen erscheinen rechts → offset steigt
        streamOffset += rate * dt * 0.6;
        const maxOff = PI_DIGITS.length - 1;
        if (streamOffset < 0) streamOffset = 0;
        if (streamOffset > maxOff) streamOffset = maxOff;
        render();
      } else if (renderQueued) {
        render();
      }
      requestAnimationFrame(loop);
    }

    // ─── Pointer / Swipe ───
    let dragging = false, dragStartX = 0, dragStartOffset = 0;
    streamWrap.addEventListener('pointerdown', (e) => {
      dragging = true;
      dragStartX = e.clientX;
      dragStartOffset = streamOffset;
      streamWrap.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    streamWrap.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - dragStartX;
      // Swipe in der dichten Mitte: 1 Stelle ≈ baseWidth px in Center-Nähe
      const next = dragStartOffset - dx / baseWidth;
      streamOffset = Math.max(0, Math.min(PI_DIGITS.length - 1, next));
      render();
    });
    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      try { streamWrap.releasePointerCapture(e.pointerId); } catch(_) {}
    }
    streamWrap.addEventListener('pointerup', endDrag);
    streamWrap.addEventListener('pointercancel', endDrag);

    // ─── Resize ───
    function recalcLayout() {
      baseWidth = measureBaseWidth();
      measureViewport();
      render();
    }
    window.addEventListener('resize', recalcLayout);

    // ─── Compression Slider via Controls-Lib ───
    const panel = Controls.createPanel({ position: 'left', id: 'pi-compression' });
    panel.addSlider('scale', {
      label: 'Verdichtung',
      min: 0.1, max: 8, step: 0.05, value: compressionScale, decimals: 2,
      onChange: v => { compressionScale = Math.max(0.05, v); render(); }
    });

    // ─── Boot ───
    recalcLayout();
    requestAnimationFrame(loop);
  </script>
</body>

  <style>
    html, body { height: 100%; overflow: hidden; touch-action: none; }
    /* Sausen zeigt bis -10000 (und mehr): Platz fuer sieben Zeichen */
    .ctrl-row[data-key="drift"] .ctrl-value-input { width: 4.6em; }
    /* Touch-Ziel: mindestens 44 x 44 px */
    .ctrl-row[data-key="notation"] .ctrl-button { min-height: 44px; min-width: 44px; white-space: nowrap; padding: 0 1rem; width: max-content; min-width: max-content; max-width: none; flex: none; }
    .stage {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      background: var(--bg-color);
      color: var(--text-color);
      user-select: none; -webkit-user-select: none;
    }
    .stage.hinweis { box-shadow: inset 0 0 0 2px #b8860b; }
    .stage.fehler { box-shadow: inset 0 0 0 3px #c33; }
    /* Wartezustand: die Anzeige steht an der letzten berechneten Stelle und wartet auf den Worker (kein Ende, kein Fehler). */
    .stage.warte::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--text-color); pointer-events: none; animation: warte-puls 1.6s ease-in-out infinite; }
    @keyframes warte-puls { 0%, 100% { opacity: 0.08; } 50% { opacity: 0.45; } }
    /* Hinweis nur bei Geraetegrenze: klein, gedaempft, ohne Interaktion. */
    .limit-hint { position: absolute; top: 0.75rem; left: 50%; transform: translateX(-50%); max-width: 90vw; text-align: center; font-size: 0.7rem; color: var(--text-color); opacity: 0.45; pointer-events: none; }
    #pi { flex: 1; min-height: 0; width: 100%; display: block; touch-action: none; }
    /* Glieder (Kette, Stern): je Glied eine Canvas, Lage setzt das Skript */
    .glied { position: absolute; display: block; touch-action: none; }
    .punkt { position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; }
    .ctrl-row[data-key="form"] .ctrl-button[aria-pressed="true"] { box-shadow: inset 0 0 0 1px var(--text-color); }
    /* Stellenanzeige: feste Stelle unter der Zeile, nur der Text wechselt */
    .stellen { position: absolute; left: 0; right: 0; top: 68%; text-align: center; font-size: 1.25rem; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; color: var(--text-color); pointer-events: none; white-space: nowrap; }

    /* ─── Steuer-Panel: ruhig, dunkel, ein Raster ─── */
    #pi-compression { --pi-h: 36px; --pi-gap: 6px; --ctrl-label-width: 7rem; font-size: 15px; }
    @media (pointer: coarse), (max-width: 640px) { #pi-compression { --pi-h: 44px; } }
    #pi-compression.position-left .ctrl-panel-body { max-height: 82vh; }
    #pi-compression .ctrl-drag-indicator { opacity: 0.3; box-shadow: none; }
    #pi-compression .ctrl-label { justify-content: flex-start; text-align: left; font-size: 14px; opacity: 0.72; hyphens: none; }
    #pi-compression .ctrl-value-input { font-size: 15px; }
    #pi-compression .ctrl-button { font-size: 15px; }
    #pi-compression .ctrl-row { margin-bottom: 0.7rem; }
    .pi-consts { display: block; padding-bottom: 0.9rem; margin-bottom: 0.9rem; border-bottom: 1px solid var(--ui-fill-15); }
    .pi-consts button, .pi-consts select { font: inherit; font-size: 15px; color: var(--text-color); }
    .pi-head { display: flex; align-items: center; justify-content: space-between; min-height: var(--pi-h); margin-bottom: var(--pi-gap); }
    .pi-form { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px; background: var(--ui-fill-05); border-radius: 8px; width: 12rem; }
    .pi-form[data-off] { visibility: hidden; }
    .pi-form button { height: calc(var(--pi-h) - 4px); padding: 0; line-height: 1; border: 0; border-radius: 6px; background: transparent; cursor: pointer; opacity: 0.6; }
    .pi-form button[aria-pressed="true"] { background: var(--ui-fill-15); opacity: 1; }
    .pi-list { display: flex; flex-direction: column; gap: var(--pi-gap); height: calc(3 * var(--pi-h) + 2 * var(--pi-gap)); overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; overscroll-behavior: contain; }
    .pi-row { flex: none; display: grid; grid-template-columns: minmax(0, 1fr) 5rem 6rem; gap: var(--pi-gap); height: var(--pi-h); }
    .pi-sel { position: relative; display: block; min-width: 0; }
    .pi-sel::after { content: ''; position: absolute; right: 0.95rem; top: 50%; width: 6px; height: 6px; margin-top: -5px; border: solid var(--ui-text-70); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); pointer-events: none; }
    .pi-select { appearance: none; -webkit-appearance: none; width: 100%; height: var(--pi-h); padding: 0 2rem 0 0.8rem; border: 0; border-radius: 8px; background: var(--ui-fill-08); cursor: pointer; font-size: 16px; }
    .pi-select option { background: var(--bg-color, #000); color: var(--text-color, #fff); }
    .pi-mirror, .pi-del, .pi-add { height: var(--pi-h); border: 0; border-radius: 8px; background: var(--ui-fill-08); cursor: pointer; padding: 0; }
    .pi-mirror[aria-pressed="true"] { background: var(--ui-fill-20); box-shadow: inset 0 0 0 1px var(--ui-border-strong); }
    .pi-del { font-size: 15px; line-height: 1; }
    .pi-mirror:disabled, .pi-del:disabled { opacity: 0.3; cursor: default; }
    .pi-add { width: 8.5rem; background: transparent; box-shadow: inset 0 0 0 1px var(--ui-border-soft); opacity: 0.85; }
    @media (hover: hover) { .pi-select:hover, .pi-mirror:not(:disabled):hover, .pi-del:not(:disabled):hover, .pi-add:hover { background: var(--ui-fill-12); } }
    .pi-consts :focus-visible { outline: 2px solid var(--ui-border-stronger); outline-offset: 1px; }

<body>
  <div class="stage _018" id="stage">
    <canvas id="pi"></canvas>
    <div class="stellen" id="stellen" aria-live="polite">&nbsp;</div>

  <script src="/tools/irrational.js"></script>
  <script src="/tools/pi-file.js"></script>
  <script src="/tools/unfolding-view.js"></script>
  <!--
    Tims Gedanken zu Pi (aus dem Gespräch der früheren Seite piKommaPi, seine Nachrichten, Tippfehler geglättet).
    Der kleine Kreis (o) steht hier für das centrum.

    Das centrum
    Pi wird mit einem kleinen Kreis in der Mitte geschrieben, dem centrum of pi (a little circle).
    Links die 3, rechts (o)1415…

    Am centrum gespiegelt
    Pi am centrum spiegeln: π,π = …951413(o)14159…
    Oder ohne die 3: …5141(o)1415… Perfekt spiegelsymmetrisch. Die 3 geht im Kreis auf.
    3 = 0, 1, ∞, der Anzahl nach.

    Basis 10
    Ein Zahlensystem mit Basis π,π. Dort heißt die Basis selbst 10.

    Malnehmen
    5141(o)1415² = 26431335(o)92302225
    95141(o)14159² = 9051836823(o)0484277281
    Wie genau man malnehmen kann, hängt von der verfügbaren Rechenkapazität ab.
    Aber der Punkt ist, dass es sich definieren lässt.

    Die Pointe
    Die Pointe aller irrationalen Zahlen ist, dass sie im irrationalen Komma gespiegelt, unter irrationaler
    Berücksichtigung aller irrationalen Dezimalstellen eine irrational exakt definierbare irrational unendlich
    große Zahl mit einer irrationalen Anzahl Dezimalstellen ergibt. Empfinde ich als ziemlich rational.
    Sie ist zwar abzählbar unendlich, aber es wäre irrational, dies tatsächlich zu tun.

    Mehr Kommas
    Nicht nur π,π. Auch e,e oder e,π. Unendlich viele irrationale Zahlen ergeben noch mehr unendlich viele
    Kombinationen. Und warum auf ein Komma beschränken? π,π,π. Das tut nur die euklidische Algebra.

    Grundsatz
    Der Mathematik nichts wegnehmen außer ihrer Kleingeistigkeit. Nur hinzufügen.
    Teils interessant, mindblown, absurd, sinnlos, teilweise weise.
  -->
  <script>
  (() => {
    'use strict';

    // Pi-Anfang (Ziffern inkl. der 3, ohne Punkt): sofort da; der Worker liefert den Rest und prüft sich daran.
    const RESERVE =
      "31415926535897932384626433832795028841971693993751058209749445923078164062862089"+
      "98628034825342117067982148086513282306647093844609550582231725359408128481117450"+
      "28410270193852110555964462294895493038196442881097566593344612847564823378678316"+
      "52712019091456485669234603486104543266482133936072602491412737245870066063155881"+
      "74881520920962829254091715364367892590360011330530548820466521384146951941511609"+
      "43305727036575959195309218611738193261179310511854807446237996274956735188575272"+
      "48912279381830119491298336733624406566430860213949463952247371907021798609437027"+
      "70539217176293176752384674818467669405132000568127145263560827785771342757789609"+
      "17363717872146844090122495343014654958537105079227968925892354201995611212902196"+
      "08640344181598136297747713099605187072113499999983729780499510597317328160963185"+
      "95024459455346908302642522308253344685035261931188171010003137838752886587533208"+
      "38142061717766914730359825349042875546873115956286388235378759375195778185778053"+
      "2171226806613001927876611195909216420198";

    // Die Ansicht (tools/unfolding-view.js) hält die Kette: Ganzzahl (Irrational.constants[].intPart), ".", Nachkommastellen.
    const CONSTS = Irrational.constants;
    const constOf = (id) => CONSTS.find((k) => k.id === id);
    const params = new URLSearchParams(location.search);
    let cid = params.get('c') || 'pi';
    let requestedTotal = 0;
    let piError = null;
    let piNotice = null;
    let limitState = null;
    let handle = null;
    let file = null;   // Pi-Stellendatei (tools/pi-file.js): nur fuer pi, traegt die Stellen jenseits der am Geraet gerechneten
    const FILE_URL = '/pi-daten/pi-1e9.b196', FILE_DIGITS = 1000000000;
    const testCfg = () => window.unfoldingPiTest || {};
    const deviceCap = () => (file ? (testCfg().deviceDigits || 100000) + 1 : Infinity);
    const startChain = () => view.setDigits(...chainStart());
    const chainStart = () => [constOf(cid) ? constOf(cid).intPart : '0', cid === 'pi' ? RESERVE.slice(1) : ''];

    const stage  = document.getElementById('stage');
    const canvas = document.getElementById('pi');
    let panel = null;   // Regler (tools/controls.js): Sausen, Verdichtungsfaktor, Konstante; im Boot angelegt
    let driftEl = null, driftValue = 0;   // Sausen in Stellen/s: negativ = Regler links = vorwaerts
    // Standardgrenze des Sausens: +-10.000 Stellen/s, Step 1. Im Popup (min/max) beliebig weit verstellbar;
    // die Kennlinie bleibt logarithmisch zwischen 0 und der Grenze.
    const DRIFT_MAX = 10000;
    // Zahlen ausgeschrieben ohne Tausenderpunkt, nie in Exponentialschreibweise: 10000, 1000000, 0,5.
    // Eingaben mit Tausenderpunkten (1.000.000) werden weiter verstanden.
    const fmtDE = (v, decimals) => new Intl.NumberFormat('de-DE', { maximumFractionDigits: Math.max(0, decimals | 0), useGrouping: false }).format(v);
    function parseDE(text) {
      let t = String(text ?? '').trim().replace(/\s/g, '');
      // Mit Komma: Punkte sind Tausender. Ohne Komma: Punkte nur dann Tausender, wenn sie Dreiergruppen trennen (1.000.000).
      if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
      else if (/^-?\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
      const n = Number(t);
      return t && Number.isFinite(n) ? n : NaN;
    }
    const driftTransform = {
      toSliderValue(v, cfg) {
        const lim = (v > 0 ? cfg.max : -cfg.min);
        if (!v || !(lim > 0)) return 0;
        return Math.sign(v) * lim * Math.log1p(Math.min(Math.abs(v), lim)) / Math.log1p(lim);
      },
      fromSliderValue(s, cfg) {
        const lim = (s > 0 ? cfg.max : -cfg.min);
        if (!(lim > 0) || Math.abs(s) < 0.02 * lim) return 0;   // Totzone um die Mitte: kein Kriechen
        return Math.sign(s) * Math.expm1(Math.min(1, Math.abs(s) / lim) * Math.log1p(lim));
      },
      formatDisplayValue(v, decimals) { return fmtDE(v, decimals); },
      parseDisplayValue(text) { return parseDE(text); },
      formatConfigValue(v) { return fmtDE(v, 20); },
      parseConfigValue(text) { return parseDE(text); }
    };

    // ─── Ansicht ───
    // Einzelnes pi: Ganzzahl und Dezimalpunkt sind ein statisches Overlay (nie Teil des Stroms); ONE_DOT = false ist der alte Zustand (Punkt im Strom).
    const ONE_DOT = true, DOT_ALPHA = 1;
    let dotCache = null;   // dotMetrics (unten); hier, weil es schon beim Anlegen der Ansicht braucht
    const ORIGIN = UnfoldingView.MARGIN + 24;   // Zelle 0 (die 3); links davon 24 px Greifflaeche fuer das linke Ende
    const fontSize = () => Math.min(56, Math.max(28, Math.round(window.innerWidth * 0.06)));
    const cellCtx = document.createElement('canvas').getContext('2d');
    const [intPart0, decimals0] = chainStart();
    const view = UnfoldingView.create(canvas, {
      intPart: intPart0, decimals: decimals0,   // schon beim ersten Layout da: die Grenzen richten sich nach der Kettenlaenge
      // Einzelnes pi: wie ein Glied. Ganzzahl und Punkt zeichnet das Overlay (statisch), der Strom nur die Nachkommastellen jenseits des Punkts.
      dot: !ONE_DOT, fixedStart: true, origin: ORIGIN, rCells: 1.5, rMinCells: 1.5,
      // Linkes Ende (die 3) faltet sich in den Punkt: "|.141". fold: Die Ganzzahl endet am Punkt, die Stellen ueberqueren ihn nie (Sausen, Rad, Wischen
      // schieben nur sie); liegen beide Enden auf dem Punkt, ist es ein Strich.
      leftGrip: true, fold: true,
      colorElement: stage,
      rate: () => -driftValue,
      // Die Seite meldet nur die echte Front; den Vorrat darüber legt der Worker fest.
      onNeedDigits: (total) => requestDigits(total),
      onFront: (atFront) => { if (!multi) stage.classList.toggle('warte', !piError && !limitState && !file && atFront); },
      onPointerInfo: (info) => { pointerInfo = info; showPlace(); }
    });

    // ─── Stellenanzeige ───
    // 0-Notation (Standard): die Ganzzahl ist "0.", die erste Nachkommastelle "1.". Alternative: Zaehlung ab der Ganzzahl
    // (bei pi heisst die 3 "3.", die erste Nachkommastelle "4."). Kettenindex i: 0 = Ganzzahl, 1 = Komma, ab 2 Nachkommastellen.
    const NOTATION_KEY = 'unfoldingPi.notation';
    let notation = 'zero', pointerInfo = null;
    try { if (localStorage.getItem(NOTATION_KEY) === 'int') notation = 'int'; }
    catch (e) { console.error('unfoldingPi: Notation nicht lesbar', e); }
    const placeEl = document.getElementById('stellen');
    function placeNumber(i) {
      const off = notation === 'int' ? (Number(constOf(cid) ? constOf(cid).intPart : 0) || 0) : 0;
      return (i === 0 ? 0 : Math.max(1, i - 1)) + off;
    }
    function placeText(info) {
      if (!info) return '\u00a0';
      if (info.c) {
        // Glied: centrum = 0., erste Nachkommastelle = 1.; "change notation" zaehlt ab der Ganzzahl der Konstante
        const gname = nameOf(info.c), off = notation === 'int' ? (Number(constOf(info.c).intPart) || 0) : 0;
        const g = (k) => fmtDE(k + off, 0) + '.';
        if (info.kind === 'digit') return info.index === 0 ? 'centrum of ' + gname + ' (a little circle)' : g(info.index) + ' digit of ' + gname;
        if (info.kind === 'left') return g(info.lo ?? 0) + '-' + g(info.hi) + ' digits of ' + gname;
        if (info.kind === 'right') return g(info.lo) + ' digit and the rest of ' + gname;
        return 'every digit of ' + gname;
      }
      const name = cid === 'pi' ? 'pi' : symbolOf(cid);
      const n = (i) => fmtDE(placeNumber(i), 0) + '.';
      if (info.kind === 'digit') return info.index === 1 ? 'centrum of ' + name + ' (a little circle)' : n(info.index) + ' digit of ' + name;
      if (info.kind === 'left') return n(info.lo ?? 0) + '-' + n(info.hi) + ' digits of ' + name;
      if (info.kind === 'right') return n(info.lo) + ' digit and the rest of ' + name;
      return 'every digit of ' + name;
    }
    function showPlace() { placeEl.textContent = placeText(pointerInfo); }
    function setNotation(v) {
      if (v !== 'zero' && v !== 'int') throw new TypeError('Notation unbekannt: ' + v);
      notation = v;
      try { localStorage.setItem(NOTATION_KEY, v); }
      catch (e) { console.error('unfoldingPi: Notation nicht speicherbar', e); }
      showPlace();
    }

    // ─── Konstanten-Rechner (tools/irrational.js) ───
    function fail(message) {
      if (piError) return;
      piError = message;
      console.error('[unfoldingPi] ' + message);
      stage.classList.remove('warte', 'hinweis');
      stage.classList.add('fehler');
      driftEl.disabled = true;
      driftValue = 0;
      panel.set('drift', 0);
      view.setLocked(true);
      view.invalidate();
      if (multi) for (const it of multi.items) { it.view.setLocked(true); it.view.invalidate(); }
    }
    // Nicht sperrender Hinweis (Rueckfall auf BigInt ohne WebAssembly): gleicher Rahmenweg wie fail(), der Drift laeuft weiter.
    function notice(message) {
      if (piNotice || piError) return;
      piNotice = message;
      console.warn('[unfoldingPi] ' + message);
      stage.classList.add('hinweis');
      view.invalidate();
    }
    function onLimit(lim) {
      limitState = lim;
      stage.classList.remove('warte');
      if (file) { if (handle) handle.close(); view.invalidate(); return; }   // Geraetegrenze: die Datei traegt weiter
      if (lim.kind === 'device' && !document.getElementById('limit-hint')) {
        const hint = document.createElement('div');
        hint.id = 'limit-hint';
        hint.className = 'limit-hint';
        hint.textContent = 'use better hardware to get access to more digits';
        stage.appendChild(hint);
      }
      if (handle) handle.close(); // der Worker gibt seinen WASM-Speicher frei; die Anzeige bleibt
      view.invalidate();
    }
    function onDigits(u8, offset) {
      try {
        view.appendDigits(u8, offset);
      } catch (e) {
        if (e instanceof RangeError) {
          // V8-Stringgrenze: Rechenwerk-Grenze, kein Text, die Anzeige bleibt stehen.
          const digits = view.state().chainLength - 2;
          console.warn('[unfoldingPi] engine limit: string length at ' + digits + ' digits');
          limitState = { kind: 'engine', reason: 'string length', digits };
          stage.classList.remove('warte');
          if (handle) handle.close();
          return;
        }
        if (e instanceof UnfoldingView.DigitError) { fail(e.message); return; }
        fail('Stellen nicht verarbeitbar: ' + (e && e.message ? e.message : e));
      }
    }
    function startFile() {
      if (file) { file.close(); file = null; }
      view.setRemote(null);
      if (cid !== 'pi' || testCfg().file === false) return;
      file = PiFile.create({
        url: testCfg().fileUrl || FILE_URL, digits: FILE_DIGITS,
        onError: (e) => fail('Pi-Datei: ' + e.message),
        onChange: () => view.invalidate()
      });
      view.setRemote(file);
    }
    function startWorker() {
      if (handle) { handle.close(); handle = null; }
      startFile();
      limitState = null;
      requestedTotal = 0;
      piError = null;
      driftEl.disabled = false;
      view.setLocked(false);
      stage.classList.remove('warte', 'hinweis', 'fehler');
      const old = document.getElementById('limit-hint');
      if (old) old.remove();
      piNotice = null;
      startChain();
      try {
        handle = Irrational.open(cid, { onDigits, onLimit, onNotice: notice, onError: (e) => fail(e.message) }, window.unfoldingPiTest);
      } catch (e) { fail('Rechner nicht startbar: ' + e.message); return; }
      requestDigits(2000);
    }
    function requestDigits(total) {
      if (!handle || piError || limitState || total <= requestedTotal) return;
      const t = Math.min(total, deviceCap());
      if (t <= requestedTotal) return;
      requestedTotal = t;
      handle.want(t);
    }
    function symbolOf(id) { return constOf(id).symbol; }
    function setConstant(id) {
      if (id === cid) return;
      cid = id;
      glieder = [{ uid: glieder[0].uid, c: id, dir: 'r' }];
      syncRows();
      const u = new URL(location.href);
      u.searchParams.set('c', id);
      history.replaceState(null, '', u);
      document.title = id === 'pi' ? '(un)foldingPi' : '(un)folding ' + symbolOf(id);
      showPlace();
      startWorker();
      view.rewind();
      centreSingle();
    }

    // ─── Glieder: Kette und Stern ───
    // Ein Glied ist der bisherige Modus (#pi). Ab zwei Gliedern bekommt jedes Glied eine eigene Canvas und Ansicht: nur
    // Nachkommastellen ab einem centrum (Kreis), ausgerollt, Schrift wie #pi. Kette: die Breite in gleiche Plaetze geteilt,
    // r beginnt am linken Rand seines Platzes, l (gespiegelt) am rechten; l gefolgt von r teilt sich ein centrum. Stern: alle
    // Strahlen aus der Buehnenmitte, Winkel 360/n; ein Strahl ueber 90..270 Grad laeuft gespiegelt (Ziffern nie kopfueber).
    // Gleiche Konstanten teilen einen Rechner. Keine Pi-Datei: die Geraetegrenze gilt wie bei e.
    let uidSeq = 0, glieder = [{ uid: ++uidSeq, c: cid, dir: 'r' }], form = 'kette', multi = null, pointerItem = null;
    let factorValue = view.state().factor;
    const MARGIN = UnfoldingView.MARGIN;
    const nameOf = (id) => (id === 'pi' ? 'pi' : symbolOf(id));
    // Zellbreite wie in tools/unfolding-view.js (measure): das centrum jedes Glieds liegt bei MARGIN + w/2 auf seiner Achse.
    function cellW() {
      const dpr = window.devicePixelRatio || 1;
      cellCtx.font = (fontSize() * dpr) + 'px "Courier New", Courier, monospace';
      return Math.max(1, Math.round(cellCtx.measureText('0').width)) / dpr;
    }
    function parseGlieder() {
      const k = params.get('kette'), s = params.get('stern');
      if (k === null && s === null) return null;
      const star = k === null, out = [], bad = [];
      for (const part of (star ? s : k).split('.').filter(Boolean)) {
        const m = star ? /^([a-z0-9]+)$/.exec(part) : /^([a-z0-9]+)-([lr])$/.exec(part);
        if (m && constOf(m[1])) out.push({ c: m[1], dir: star ? 'r' : m[2] });
        else bad.push(part);
      }

    // Einzelnes pi/e/...: die Canvas liegt wie ein Glied (Anfang = Zelle der Ganzzahl), die Ganzzahl steht buendig links vom Punkt,
    // der Punkt in der Mitte der freien Flaeche; beides zeichnet das Overlay, der Strom ist rechts vom Punkt sichtbar.
    function centreSingle() {
      if (multi) return;
      const A = freeArea(), SW = stage.clientWidth, w = cellW(), ip = singleInt().length;
      const left = A.cx - (ip + 0.5) * w - ORIGIN;
      Object.assign(canvas.style, { position: 'absolute', left: left + 'px', top: '0px', width: (SW - left) + 'px', height: A.y1 + 'px', margin: '0' });
      canvas.style.top = (A.cy - A.y1 / 2) + 'px';
      // keine Maske: WebKit blendet bei einem Verlauf mit Stopp bei -1e6 px die ganze Zeichenflaeche aus
      canvas.style.maskImage = canvas.style.webkitMaskImage = ''; delete canvas.dataset.inkSide; delete canvas.dataset.inkAt;
      view.resize();
      drawDots([{ x: A.cx, y: A.cy }]);
    }
    window.addEventListener('resize', () => { if (multi) layoutMulti(); else centreSingle(); });

    // ─── Boot ───
    panel = Controls.createPanel({ position: 'left', id: 'pi-compression', desktopInitialHeightFraction: 0.62, mobileInitialOpenMaxViewportFraction: 0.4 });
    if (window.ResizeObserver && panel.el) new ResizeObserver(() => { if (multi) { layoutMulti(); for (const it of multi.items) if (it.view) it.view.resize(); } else centreSingle(); }).observe(panel.el);
    // Debug-Anzeige (nur im Bearbeiten-Modus, html.oe-editing wie tools/editor.js): duenne Linien ueber der Buehne,
    // pointer-events: none; aus = nichts gezeichnet, keine Schleife.
    const DEBUG_KEY = 'unfoldingPi.debug';
    const debug = (() => {
      const root = document.documentElement;
      const editing = () => root.classList.contains('oe-editing');
      let on = false, layer = null, raf = 0, info = null;
      try { on = localStorage.getItem(DEBUG_KEY) === '1'; } catch (e) { /* kein Speicher: Schalter gilt nur fuer diese Sitzung */ }
      const css = 'position:absolute;pointer-events:none;box-sizing:border-box;';
      const box = (x, y, w, h, col, st) => { const d = document.createElement('div'); d.style.cssText = css + 'left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px;border:1px ' + (st || 'solid') + ' ' + col + ';'; layer.appendChild(d); return d; };
      const targets = () => (multi ? multi.items.map((it, i) => ({ name: 'link ' + i, cv: it.canvas, v: it.view })) : [{ name: 'pi', cv: canvas, v: view }]);
      function frame() {
        raf = 0;
        if (!on || !editing()) return;
        layer.textContent = '';
        const SW = window.innerWidth, SH = window.innerHeight, lines = [];
        const wx = SW / 2, wy = SH / 2;
        const v1 = document.createElement('div'); v1.style.cssText = css + 'left:' + (wx - 0.5) + 'px;top:0;width:1px;height:' + SH + 'px;background:rgba(120,170,255,.35);'; layer.appendChild(v1);
        const h1 = document.createElement('div'); h1.style.cssText = css + 'left:0;top:' + (wy - 0.5) + 'px;width:' + SW + 'px;height:1px;background:rgba(120,170,255,.35);'; layer.appendChild(h1);
        const pts = multi ? multi.points : single.points;
        for (const q of pts || []) box(q.x - 3, q.y - 3, 6, 6, 'rgba(255,200,90,.8)');
        for (const t of targets()) {
          if (!t.v) continue;
          const z = t.v.zones(), st = t.v.state(), cs = t.cv.style;
          const frameDiv = (x, w, col, dash) => { const d = box(x, 0, w, parseFloat(cs.height) || t.cv.clientHeight, col, dash); d.style.left = (parseFloat(cs.left) + x) + 'px'; d.style.top = cs.top; d.style.transformOrigin = cs.transformOrigin ? cs.transformOrigin.replace(/^(\S+)/, (m) => (parseFloat(m) - x) + 'px') : ''; d.style.transform = cs.transform; return d; };
          frameDiv(0, parseFloat(cs.width) || t.cv.clientWidth, 'rgba(255,255,255,.18)');
          frameDiv(z.r[0], Math.max(1, z.r[1] - z.r[0]), 'rgba(110,220,160,.7)', 'dashed');
          frameDiv(z.r[0] - 0.5, 1, 'rgba(255,120,120,.8)');
          if (z.l) { frameDiv(z.l[0], Math.max(1, z.l[1] - z.l[0]), 'rgba(110,220,160,.7)', 'dashed'); frameDiv(z.l[1] - 0.5, 1, 'rgba(255,120,120,.8)'); }
          if (st.hover && st.hover.kind === 'digit') frameDiv(st.hover.x0, Math.max(1, st.hover.x1 - st.hover.x0), 'rgba(200,160,255,.7)');
          lines.push(t.name + '  X0 ' + st.X0.toFixed(1) + '  L ' + st.L.toFixed(1) + '  R ' + st.R.toFixed(1) + '  digits ' + Math.max(0, st.startIndex | 0) + '-' + (st.endIndex | 0));
        }
        const pn = panel && panel.el ? panel.el.getBoundingClientRect().width : 0;
        lines.push('panel ' + Math.round(pn) + '  window ' + SW + 'x' + SH);
        info.textContent = lines.join('\n');
        raf = requestAnimationFrame(frame);
      }
      function sync() {
        const show = on && editing();
        if (show && !layer) {
          layer = document.createElement('div'); layer.className = 'pi-debug'; layer.style.cssText = css + 'inset:0;z-index:50;';
          info = document.createElement('pre'); info.style.cssText = css + 'right:8px;bottom:8px;margin:0;z-index:51;font:11px/1.4 monospace;color:rgba(255,255,255,.65);background:rgba(0,0,0,.45);padding:6px 8px;white-space:pre;';
          stage.appendChild(layer); stage.appendChild(info);
        }
        if (layer) { layer.style.display = info.style.display = show ? '' : 'none'; if (!show) layer.textContent = ''; }
        if (show && !raf) raf = requestAnimationFrame(frame);
      }
      const rowOf = () => panel && panel.el && panel.el.querySelector('.ctrl-row[data-key="debug"]');
      function syncRow() { const r = rowOf(); if (r) r.style.display = editing() ? '' : 'none'; sync(); }
      new MutationObserver(syncRow).observe(root, { attributes: true, attributeFilter: ['class'] });
      return {
        set(v) { on = !!v; try { localStorage.setItem(DEBUG_KEY, on ? '1' : '0'); } catch (e) { console.warn('debug-Schalter nicht gespeichert', e); } sync(); },
        get on() { return on; }, syncRow
      };
    })();
    panel.addToggle('debug', { label: 'debug', value: debug.on, onChange: (v) => debug.set(v) });
    debug.syncRow();
    buildConstPanel();
    // Stern: die Arme ueberlappen am Zentrum, oben liegt der kuerzeste Arm (ganz eingeschoben bleibt sein Griff erreichbar)
    (function starZ() {
      if (multi && form === 'stern') {
        const its = multi.items.filter((it) => it.view).map((it) => { const st = it.view.state(); return { it, len: st.R - st.L }; }).sort((a, b) => b.len - a.len);
        its.forEach((o, k) => { const z = String(3 + k); if (o.it.canvas.style.zIndex !== z) o.it.canvas.style.zIndex = z; });
      }
      requestAnimationFrame(starZ);
    })();
    single.punkt = document.createElement('canvas');
    single.punkt.className = 'punkt';
    stage.insertBefore(single.punkt, placeEl);
    new MutationObserver(() => { if (!multi) centreSingle(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['style', 'class'] });
    centreSingle();
    // Strich eingeschoben/herausgezogen: Punkt neu zeichnen, sobald sich R aendert (Einzelmodus)
    let lastR = null;
    (function watchR() {
      watchPanel();
      if (!multi && view) { const st = view.state(), r = st.R + ':' + st.L + ':' + (st.uLeft > 0.5); if (r !== lastR) { lastR = r; centreSingle(); drawDots(single.points.length ? single.points : [{ x: freeArea().cx, y: freeArea().cy }]); } }
      requestAnimationFrame(watchR);
    })();
    panel.addSlider('drift', {
      label: 'Sausen', min: -DRIFT_MAX, max: DRIFT_MAX, step: 1, value: 0, decimals: 0, transform: driftTransform,
      onChange: (v) => { driftValue = +v || 0; }
    });
    driftEl = panel.bodyEl.querySelector('.ctrl-row[data-key="drift"] .ctrl-range');
    driftEl.id = 'drift';
    driftEl.setAttribute('aria-label', 'Sausen');
    // Verdichtung je Abstand der Enden, Faktor 0..1 (siehe tools/unfolding-view.js). Reglerweg s: bis 0,5 linear, darueber
    // kubisch auf 1 zu (f = 1 - 0,5 (2 (1 - s))^3), damit nahe 1 jeder Schritt feiner wird.
    const factorTransform = {
      toSliderValue(v) { const f = Math.max(0, Math.min(1, +v || 0)); return f <= 0.5 ? f : 1 - Math.cbrt(2 * (1 - f)) / 2; },
      fromSliderValue(s) { const x = Math.max(0, Math.min(1, +s || 0)); return x <= 0.5 ? x : 1 - 0.5 * Math.pow(2 * (1 - x), 3); },
      formatDisplayValue(v, decimals) { return fmtDE(v, decimals); },
      parseDisplayValue(text) { return parseDE(text); },
      formatConfigValue(v) { return fmtDE(v, 20); },
      parseConfigValue(text) { return parseDE(text); }
    };
    panel.addSlider('f', {
      label: 'Verdichtungsfaktor', min: 0, max: 1, step: 0.001, value: view.state().factor, decimals: 12, transform: factorTransform,
      onChange: (v) => {
        factorValue = +v || 0;
        view.setFactor(factorValue);
        if (multi) for (const it of multi.items) it.view.setFactor(factorValue);
      }
    });
    panel.addButton('notation', { label: 'change notation', onClick: () => setNotation(notation === 'zero' ? 'int' : 'zero') });
    // Zuruecksetzen stellt den Startzustand her: ein Glied pi (nur die 3, der Punkt und der Strich), URL ohne Zustandsparameter;
    // die Regler setzt der Knopf selbst zurueck. Rueckgaengig bringt Glieder und Form wieder.
    panel.addResetButton({
      onClick: () => {
        const prev = { list: glieder.map((g) => Object.assign({}, g)), form };
        if (glieder.length > 1 || glieder[0].c !== 'pi') {
          glieder = [{ uid: glieder[0].uid, c: 'pi', dir: 'r' }];
          form = 'kette';
          structure();
        }
        return () => { glieder = prev.list; form = prev.form; structure(); };
      },
      afterReset: () => {
        // die Regler-Voreinstellung der Konstante kann die aus der URL sein (?c=e): Startzustand ist immer pi
        if (glieder.length === 1 && cid !== 'pi') setConstant('pi');
        const u = new URL(location.href);
        for (const k of ['c', 'kette', 'stern']) u.searchParams.delete(k);
        history.replaceState(history.state, '', u.pathname + (u.search || '') + u.hash);
      }
    });
    // Zustand aus der URL: ?kette=pi-l.pi-r oder ?stern=pi.pi.e (sonst ?c=<id>, ein Glied)
    const parsed = parseGlieder();
    if (parsed) { form = parsed.form; if (parsed.list.length) glieder = parsed.list; cid = glieder[0].c; }
    syncRows();
    if (glieder.length > 1) buildMulti();
    else {
      startChain();
      if (!constOf(cid)) fail('Unbekannte Konstante: ' + cid);
      else if (cid !== 'pi') document.title = '(un)folding ' + symbolOf(cid);
      if (!piError) startWorker();
    }
    if (parsed && parsed.bad.length) fail('Unbekannte Glieder: ' + parsed.bad.join(', '));

    // Nur lesende Zustandsabfrage für Tests.
    window.unfoldingPi = {
      state() {
        return Object.assign(view.state(), {
          constant: cid, limit: limitState, error: piError, notice: piNotice,
          waiting: stage.classList.contains('warte'), requestedTotal, form: multi ? form : null, count: glieder.length
        });
      },
      digits() { return view.digits(); },
      shown() { return view.shown(); },
      file() { return file ? Object.assign(file.stats(), { length: file.length }) : null; },
      fileAt(i) { return file ? file.at(i) : null; },
      fileWant(lo, hi) { if (file) file.want(lo, hi, 0); },
      columns() { return view.columns(); },
      renderLog() { return view.renderLog(); },
      glyphAlpha() { return view.glyphAlpha(); },
      glyphInk() { return view.glyphInk(); },
      hover(x) { view.setHover(x); },
      place() { return { text: placeEl.textContent, notation, info: pointerInfo }; },
      // Glieder im Mehrgliedmodus (sonst null): Konstante, Richtung der Ansicht, Winkel (Stern), Zustand, Kette, Canvas
      glieder() {
        return multi ? multi.items.map((it) => ({ c: it.c, dir: it.dir, angle: it.angle, rot: it.rot, cl: it.cl, state: it.view.state(), digits: it.view.digits(), canvas: it.canvas })) : null;
      },
      // Punkt-Canvas im Mehrgliedmodus (sonst null) und die Stellen der Punkte (CSS-px der Buehne)
      punkt() { return multi ? { canvas: multi.punkt, points: multi.points } : { canvas: single.punkt, points: single.points }; },
      controls: panel
    };
  })();
  </script>

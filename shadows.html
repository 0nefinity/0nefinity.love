 Das eine Licht aus x Lampen trifft auf ein Objekt
 Pyhsikalisch inspirierte mathematisch (offensichtlich) realistische Lichtquellen
 treffen auf mathematisch realistische Objekte wodurch es zu einer durch den Nutzer zu interpretierenden Schattenbildung kommt.
 -->
<html lang="de">
<head>
  <!--#include virtual="/includes/something-in-the-head.html" -->

  <script type="importmap">
  {
    "imports": {
      "three": "/tools/vendor/three/0.168.0/build/three.module.js",
      "three/examples/jsm/controls/OrbitControls.js": "/tools/vendor/three/0.168.0/examples/jsm/controls/OrbitControls.js",
      "three/examples/jsm/loaders/FontLoader.js": "/tools/vendor/three/0.168.0/examples/jsm/loaders/FontLoader.js",
      "three/examples/jsm/geometries/TextGeometry.js": "/tools/vendor/three/0.168.0/examples/jsm/geometries/TextGeometry.js"
    }
  }
  </script>

  <style>
    body {
      margin: 0; overflow: hidden;
    }

    ._018-canvas {
      display: flex;
      align-items: center;
      justify-content: center;
    }

  </style>
<script type="application/json" id="control-defaults">{"glyphRot1":0}</script>
</head>
<body>
  <div class="_018-canvas" id="shadows-root"></div>

  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

  function getCSSVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  let container, scene, camera, renderer, controls;
  let sphereMesh;
  let spheres = [];   // entries: {mesh, depthMat, glyphTextures, glyphChars}. spheres[0] is primary.
  let glyphTextures = { x: null, y: null, z: null };

  let ambientLight;
  let spotFloor, spotBack, spotSide;
  let spotBackB, spotSideB;   // lower sphere's own wall spots (5-lamp GEB only)
  let lampFloor, lampBack, lampSide;
  let lampBackB, lampSideB, lightConeBackB, lightConeSideB;  // lamp meshes + cones of the B spots (5-lamp GEB only)
  let lightConeFloor, lightConeBack, lightConeSide;
  let baseBgColor, textColorThree;
  let floor, backWall, sideWall;  // Nebel-Scheiben (fog layers)
  let hitLayerFloor, hitLayerBack, hitLayerSide;  // Hit-Layer für Drag (Lichtkegel-Größe)

  // Outline-Meshes für Auswahl-Highlight
  let outlineFloor, outlineBack, outlineSide;  // Fog-Outlines
  let outlineSphere;  // Kugel-Outline

  let gebEnabled = true;  // 018 Mode ist immer aktiv
  let invertMode = false;
  let shapeCube = false;   // Form: false = Kugel, true = Wuerfel (?form=wuerfel)
  let dualMode = false;   // GEB-Mode (Hofstadter): 2 stacked spheres. NOT gebEnabled (that is the glyph-cutout flag).
  let gebFiveLamps = false;  // ?geb=5: one wall lamp pair per sphere. Default (?geb=1): 3 lamps, wall lamps between the spheres.

  // Lampen-Zustände (an/aus)
  let lampStates = {
    floor: true,
    back: true,
    side: true
  };

  const DEFAULT_GLYPH_CHARS = { left: '0', right: '1', floor: '∞' };
  let glyphChars = { ...DEFAULT_GLYPH_CHARS };

  const DUAL_GAP = 3.5; // center-to-center Y distance in sphere radii (lower sphere at y=0, primary above)
  function upperSphereY() { return dualMode ? DUAL_GAP * (params.sphereRadius || 1) : 0; }
  // Mitte des Kugelstapels; alle Lampen sitzen im Abstand lightDistance von hier (Boden: darüber, Wände: seitlich).
  function stackMidY() { return upperSphereY() / 2; }
  // 5-Lampen-GEB (Vergleichsvariante, Lichtabstand 15) behält die Bodenlampe über der oberen Kugel: näher am Stapel
  // verzerren die Perspektiven der zwei Kugeln das Boden-∞.
  function floorLampY() { return (gebFiveLamps ? upperSphereY() : stackMidY()) + params.lightDistance; }
  // Bodenhöhe: Abstand wallDistance unter der Stapelmitte, damit Boden-Scheibe und Wand-Scheiben in beiden Modi gleich zur Kugelmitte stehen.
  function floorY() { return stackMidY() - params.wallDistance; }
  function wallLampY() { return dualMode && !gebFiveLamps ? stackMidY() : upperSphereY(); }
  // 3-lamp GEB: the wall lamp sits between the spheres, so its cone has to reach the far edge of both.
  // The penumbra eats the outer ~30% of the cone, hence the widening.
  function wallLampAngleDeg() {
    const user = params.spotAngle ?? PARAMS_CONFIG.spotAngle.default;
    if (!dualMode || gebFiveLamps) return user;
    const reachDeg = Math.atan((DUAL_GAP / 2 + 1) * (params.sphereRadius || 1) / Math.max(params.lightDistance, 0.001)) * 180 / Math.PI;
    return Math.min(89, Math.max(user, reachDeg / 0.7));
  }
  function derivedGlyphs(base) { return { left: base.right, right: base.left, floor: base.floor }; }

  const GLYPH_URL_KEYS = { left: 'g0', right: 'g1', floor: 'g8' };

  // Schatten-Fokus für direkte Text-Eingabe
  let activeGlyphTarget = null;  // 'left', 'right', 'floor', oder null
  let cursorVisible = false;
  let cursorBlinkInterval = null;

  // Font-Optionen für das Glyph-Rendering (nur System-Fonts)
  const FONT_OPTIONS = {
    // Sans-Serif
    'Arial':            'Arial, sans-serif',
    'Helvetica':        'Helvetica, Arial, sans-serif',
    'Verdana':          'Verdana, sans-serif',
    'Tahoma':           'Tahoma, sans-serif',
    'Trebuchet MS':     'Trebuchet MS, sans-serif',
    // Serif
    'Times New Roman':  'Times New Roman, serif',
    'Georgia':          'Georgia, serif',
    'Palatino':         'Palatino Linotype, Palatino, serif',
    'Book Antiqua':     'Book Antiqua, Palatino, serif',
    'Garamond':         'Garamond, serif',
    // Monospace
    'Courier New':      'Courier New, monospace',
    'Lucida Console':   'Lucida Console, Monaco, monospace',
    'Consolas':         'Consolas, monospace',
  };
  const DEFAULT_FONT_KEY = 'Courier New';
  let currentFontKey = DEFAULT_FONT_KEY;

  const INTERACTION_CONFIG = {
    // Tap-Erkennung
    tapMaxDuration: 200,       // ms - maximale Dauer für einen Tap
    tapMaxDistance: 10,        // px - maximale Bewegung für einen Tap

    // Scroll/Wheel
    wheelThrottleMs: 100,      // ms - Throttle für Wheel-Events
    wheelDeltaThreshold: 15,   // Ignoriere kleine Deltas (Momentum)

    // Pinch
    pinchSensitivity: 50,      // px Bewegung pro Step

    // Minimum Hitbox-Größen (damit Objekte bei Wert=0 noch interagierbar bleiben)
    minSphereHitRadius: 2,     // Minimaler Radius für Kugel-Hitbox
    minFogHitRadius: 3,        // Minimaler Radius für Fog-Layer-Hitbox

    // Outlines
    outlineThickness: 0.15,    // Relative Dicke der Auswahl-Outlines

    // Mobile Panel
    collapsedHandleHeight: 56, // px - Höhe des eingeklappten Panels
    canvasOffsetMax: 15,       // vh - maximale Canvas-Verschiebung
  };

  const PARAMS_CONFIG = {
    // Kamera
    cameraDistance:   {                             urlKey: 'zoom',      min: 0,     max: 10000,  step: 1,    default: 100,  decimals: 2, dynamicStep: true },
    cameraAzimuth:    {                             urlKey: 'az',        min: -180,  max: 180,    step: 1,    default: 45,  decimals: 2, dynamicStep: true },
    cameraElevation:  {                             urlKey: 'el',        min: -89,   max: 89,     step: 1,    default: 35,  decimals: 2, dynamicStep: true },

    // Beleuchtung
    wallBrightness:   {                             urlKey: 'fog',       min: 0,     max: 1,      step: 0.1,  default: 1,    decimals: 2, dynamicStep: true },
    ambientIntensity: { id: 'ambient',              urlKey: 'ambient',   min: 0,     max: 10,     step: 0.1,  default: 0.5,  decimals: 2, dynamicStep: true },
    brightness:       { id: 'brightness',           urlKey: 'bright',    min: 0,     max: 100000,  step: 1,    default: 80,   decimals: 2, dynamicStep: true },

    // Geometrie
    wallDistance:     { id: 'dist',                 urlKey: 'dist',      min: -100,  max: 1000,    step: 0.01, default: 14,   decimals: 2, dynamicStep: true },
    sphereRadius:     { id: 'radius',               urlKey: 'r',         min: 0,     max: 1000,    step: 0.1,  default: 2.5,    decimals: 2, dynamicStep: true },
    glyphSize:        { id: 'glyphSize',            urlKey: 'gsize',     min: 0,     max: 500,     step: 0.1,  default: 4,    decimals: 2, dynamicStep: true },
    wallSize:         { id: 'wallSize',             urlKey: 'wsize',     min: 0,     max: 200,    step: 1,    default: 25,   decimals: 2, dynamicStep: true },

    // Glyph-Rotationen (0-360° = voller Kreis)
    glyphRot0:        { id: 'glyphRot0',            urlKey: 'r0',        min: 0,     max: 360,    step: 1,    default: 0,    decimals: 2, dynamicStep: true },
    glyphRot1:        { id: 'glyphRot1',            urlKey: 'r1',        min: 0,     max: 360,    step: 1,    default: 0,    decimals: 2, dynamicStep: true },
    glyphRotInf:      { id: 'glyphRotInf',          urlKey: 'rInf',      min: 0,     max: 360,    step: 1,    default: 315,  decimals: 2, dynamicStep: true },

    // Licht-Position
    lightDistance:    { id: 'lightDistance',        urlKey: 'ldist',     min: 0,     max: 100000,    step: 0.01, default: 40,   decimals: 2, dynamicStep: true },
    lampScale:        { id: 'lampScale',            urlKey: 'lamp',      min: 0,     max: 500,     step: 1,    default: 5,    decimals: 2, dynamicStep: true },

    // Spotlight-Parameter
    spotAngle:        { id: 'spotAngle',            urlKey: 'angle',     min: 0,     max: 180,    step: 1,    default: 16,   decimals: 2, dynamicStep: true },
    spotPenumbra:     { id: 'spotPenumbra',         urlKey: 'pen',       min: 0,     max: 1,      step: 0.05, default: 0.5,  decimals: 2, dynamicStep: true },
    spotDecay:        { id: 'spotDecay',            urlKey: 'decay',     min: 0,     max: 2,      step: 1,    default: 0,    decimals: 0, isSegmented: true },
    spotRange:        { id: 'spotRange',            urlKey: 'range',     min: 0,     max: 10000,  step: 1,    default: 10000, decimals: 2, dynamicStep: true },

    // Shadow-Parameter
    shadowMapSize:    { id: 'shadowMapSize',        urlKey: 'smap',      min: 256,   max: 4096,   step: 256,  default: 1024, decimals: 0 },
    // Nebel-Parameter
    fogThickness:     { id: 'fogThickness',         urlKey: 'fogT',      min: 0.05, max: 100,     step: 0.05, default: 0.3, decimals: 2, dynamicStep: true }
  };

  const params = {};
  Object.keys(PARAMS_CONFIG).forEach((key) => {
    params[key] = PARAMS_CONFIG[key].default;
  });


  function readParamsFromURL() {
    const urlParams = new URLSearchParams(window.location.search);

    Object.entries(PARAMS_CONFIG).forEach(([key, cfg]) => {
      const value = urlParams.get(cfg.urlKey);
      if (value === null) return;
      const num = parseFloat(value);
      if (isNaN(num)) return;
      const clamped = Math.min(cfg.max, Math.max(cfg.min, num));
      params[key] = clamped;
    });

	    // Glyph-Zeichen (Text) ebenfalls aus der URL lesen
	    const infFromUrl  = urlParams.get(GLYPH_URL_KEYS.floor);
	    const leftFromUrl = urlParams.get(GLYPH_URL_KEYS.left);
	    const rightFromUrl= urlParams.get(GLYPH_URL_KEYS.right);
	    if (infFromUrl !== null)  glyphChars.floor = infFromUrl;
	    if (leftFromUrl !== null) glyphChars.left  = leftFromUrl;
	    if (rightFromUrl !== null)glyphChars.right = rightFromUrl;

    // Font aus URL laden
    const fontFromUrl = urlParams.get('font');
    if (fontFromUrl && FONT_OPTIONS[fontFromUrl]) {
      currentFontKey = fontFromUrl;
    }

    // Invert-Mode aus URL laden
    const invertFromUrl = urlParams.get('invert');
    if (invertFromUrl === '1') {
      invertMode = true;
    }

    // Form aus URL laden
    if (urlParams.get('form') === 'wuerfel') shapeCube = true;

    // GEB-Mode aus URL laden
    const gebFromUrl = urlParams.get('geb');
    if (gebFromUrl === '1' || gebFromUrl === '5') {
      dualMode = true;
      gebFiveLamps = gebFromUrl === '5';
    }

    // Lampen-Zustände aus URL laden (z.B. lights=110 → floor=1, back=1, side=0)
    const lightsFromUrl = urlParams.get('lights');
    if (lightsFromUrl && lightsFromUrl.length === 3) {
      lampStates.floor = lightsFromUrl[0] === '1';
      lampStates.back = lightsFromUrl[1] === '1';
      lampStates.side = lightsFromUrl[2] === '1';
    }
  }

  function updateURLFromParams() {
    const urlParams = new URLSearchParams(window.location.search);

    Object.entries(PARAMS_CONFIG).forEach(([key, cfg]) => {
      const value = params[key];
      if (typeof value === 'number') {
        const decimals = cfg.decimals !== undefined ? cfg.decimals : 2;
        urlParams.set(cfg.urlKey, value.toFixed(decimals));
      }
    });

	    // Glyph-Texte in die URL schreiben (Mehr-Zeichen-Strings erlaubt)
	    Object.entries(GLYPH_URL_KEYS).forEach(([key, urlKey]) => {
	      const value = glyphChars[key];
	      if (value && value.length > 0) {
	        urlParams.set(urlKey, value);
	      } else {
	        urlParams.delete(urlKey);
	      }
	    });

    // Font in URL schreiben
    if (currentFontKey && currentFontKey !== DEFAULT_FONT_KEY) {
      urlParams.set('font', currentFontKey);
    } else {
      urlParams.delete('font');
    }

    if (shapeCube) {
      urlParams.set('form', 'wuerfel');
    } else {
      urlParams.delete('form');
    }

    // Invert-Mode in URL schreiben
    if (invertMode) {
      urlParams.set('invert', '1');
    } else {
      urlParams.delete('invert');
    }

    // GEB-Mode in URL schreiben
    if (dualMode) {
      urlParams.set('geb', gebFiveLamps ? '5' : '1');
    } else {
      urlParams.delete('geb');
    }

    // Lampen-Zustände in URL schreiben
    const lightsStr = (lampStates.floor ? '1' : '0') +
                      (lampStates.back ? '1' : '0') +
                      (lampStates.side ? '1' : '0');
    if (lightsStr !== '111') {
      urlParams.set('lights', lightsStr);
    } else {
      urlParams.delete('lights');  // Default: alle an
    }

    const newURL = `${window.location.pathname}?${urlParams.toString()}`;
    window.history.replaceState({}, '', newURL);
  }

  function updateLightingFromParams() {
    if (ambientLight) ambientLight.intensity = params.ambientIntensity;

    // brightness: Three.js Spotlights + Kugel-Shader (für Shadows etc.)
    const spotIntensity = (params.brightness ?? 100) * 5000;
    if (spotFloor) spotFloor.intensity = spotIntensity;
    if (spotBack) spotBack.intensity = spotIntensity;
    if (spotSide) spotSide.intensity = spotIntensity;
    if (spotBackB) spotBackB.intensity = spotIntensity;
    if (spotSideB) spotSideB.intensity = spotIntensity;

    // wallBrightness = Fog-Opacity (0 = unsichtbar, 1 = voll sichtbar)
    if (fogMaterials && fogMaterials.length > 0) {
      const fogOpacity = params.wallBrightness || 0;  // Direkt: 0=aus, 1=voll
      fogMaterials.forEach(mat => {
        if (mat && mat.uniforms && mat.uniforms.uFogDensity) {
          mat.uniforms.uFogDensity.value = fogOpacity;
        }
      });
    }
  }

  // Berechnet Radius des Lichtkegels an der Wand
  function calcConeRadius(spotPos, wallDist, axis) {
    // Abstand vom Spotlight zur Wand
    let dist;
    if (axis === 'y') dist = Math.abs(spotPos.y - floorY());
    else if (axis === 'z') dist = Math.abs(spotPos.z - (-wallDist));
    else if (axis === 'x') dist = Math.abs(spotPos.x - (-wallDist));
    else dist = wallDist;

    const angleRad = (params.spotAngle ?? PARAMS_CONFIG.spotAngle.default) * Math.PI / 180;
    // Bei angle=0 geben wir minHitRadius zurück, damit noch interagierbar
    if (params.spotAngle === 0) return INTERACTION_CONFIG.minFogHitRadius;
    return Math.tan(angleRad) * dist;
  }

  // Lampen und Ziele. Die Bodenlampe sitzt im Abstand lightDistance über der Stapelmitte (5 Lampen: über der obersten Kugel), die Wandlampen
  // auf Höhe der Kugel (Einzel/5 Lampen) bzw. in der Mitte zwischen beiden (3 Lampen).
  function placeSpots() {
    if (!spotFloor) return;
    const d = params.lightDistance;
    const w = params.wallDistance;
    const yW = wallLampY();
    spotFloor.position.set(0, floorLampY(), 0);
    spotFloor.target.position.set(0, floorY(), 0);
    spotBack.position.set(0, yW, d);
    spotBack.target.position.set(0, yW, -w);
    spotSide.position.set(d, yW, 0);
    spotSide.target.position.set(-w, yW, 0);
    if (spotBackB) {
      spotBackB.position.set(0, 0, d);
      spotBackB.target.position.set(0, 0, -w);
      spotSideB.position.set(d, 0, 0);
      spotSideB.target.position.set(-w, 0, 0);
    }
  }

  function updateGeometryFromParams() {
    // Kugel-Radius über Scale steuern (alle Kugeln skalieren + Y-Position anpassen)
    if (spheres.length && typeof params.sphereRadius === 'number') {
      const r = Math.max(0.001, params.sphereRadius);
      spheres.forEach((s, i) => {
        s.mesh.scale.setScalar(r);
        s.mesh.position.y = (i === 0) ? upperSphereY() : 0;
      });
      needsUniformUpdate = true;  // Matrix-Inverse muss neu berechnet werden
    }
    placeSpots();

    // Shader-Uniforms aktualisieren
    if (sphereMesh && sphereMesh.material && sphereMesh.material.uniforms) {
      const u = sphereMesh.material.uniforms;
      if (typeof params.glyphSize === 'number' && u.uGlyphSize) {
        u.uGlyphSize.value = params.glyphSize;
      }
    }

    if (typeof params.wallDistance === 'number') {
      const d = -params.wallDistance;
      if (floor) floor.position.y = floorY();
      if (backWall) backWall.position.z = d;
      if (sideWall) sideWall.position.x = d;

      // Hit-Layer synchronisieren
      if (hitLayerFloor) hitLayerFloor.position.y = floorY();
      if (hitLayerBack) hitLayerBack.position.z = d;
      if (hitLayerSide) hitLayerSide.position.x = d;

    }

    if (typeof params.wallSize === 'number') {
      const s = Math.max(0.001, params.wallSize);
      if (floor) floor.scale.set(s, s, 1);
      if (backWall) backWall.scale.set(s, s, 1);
      if (sideWall) sideWall.scale.set(s, s, 1);
    }

    if (typeof params.lampScale === 'number') {
      const s = params.lampScale;
      if (lampFloor) lampFloor.scale.set(s, s, s);
      if (lampBack) lampBack.scale.set(s, s, s);
      if (lampSide) lampSide.scale.set(s, s, s);
      if (lampBackB) lampBackB.scale.set(s, s, s);
      if (lampSideB) lampSideB.scale.set(s, s, s);
    }

    // Hit-Layer und Outline Radien aktualisieren (wenn spotAngle sich ändert)
    if (typeof params.spotAngle === 'number') {
      const outlineThickness = INTERACTION_CONFIG.outlineThickness;

      if (hitLayerFloor && spotFloor) {
        const r = calcConeRadius(spotFloor.position, params.wallDistance, 'y');
        hitLayerFloor.geometry.dispose();
        hitLayerFloor.geometry = new THREE.CircleGeometry(r, 32);
        if (outlineFloor) {
          outlineFloor.geometry.dispose();
          outlineFloor.geometry = new THREE.RingGeometry(r, r + outlineThickness, 64);
        }
      }
      if (hitLayerBack && spotBack) {
        const r = calcConeRadius(spotBack.position, params.wallDistance, 'z');
        hitLayerBack.geometry.dispose();
        hitLayerBack.geometry = new THREE.CircleGeometry(r, 32);
        if (outlineBack) {
          outlineBack.geometry.dispose();
          outlineBack.geometry = new THREE.RingGeometry(r, r + outlineThickness, 64);
        }
      }
      if (hitLayerSide && spotSide) {
        const r = calcConeRadius(spotSide.position, params.wallDistance, 'x');
        hitLayerSide.geometry.dispose();
        hitLayerSide.geometry = new THREE.CircleGeometry(r, 32);
        if (outlineSide) {
          outlineSide.geometry.dispose();
          outlineSide.geometry = new THREE.RingGeometry(r, r + outlineThickness, 64);
        }
      }
    }

    const spots = [spotFloor, spotBack, spotSide, spotBackB, spotSideB].filter(Boolean);
    spots.forEach(spot => {
      if (!spot) return;
      if (typeof params.spotAngle === 'number') {
        const isWallSpot = spot === spotBack || spot === spotSide;
        spot.angle = (isWallSpot ? wallLampAngleDeg() : params.spotAngle) * Math.PI / 180;
      }
      if (typeof params.spotPenumbra === 'number') {
        spot.penumbra = params.spotPenumbra;
      }
      if (typeof params.spotDecay === 'number') {
        spot.decay = params.spotDecay;
      }
      if (typeof params.spotRange === 'number') {
        spot.distance = params.spotRange;
      }
      if (typeof params.shadowMapSize === 'number') {
        const newSize = params.shadowMapSize;
        if (spot.shadow.mapSize.x !== newSize) {
          spot.shadow.mapSize.set(newSize, newSize);
          if (spot.shadow.map) {
            spot.shadow.map.dispose();
            spot.shadow.map = null;
          }
        }
      }
      // Shadow-Kamera dynamisch anpassen
      const r = params.sphereRadius || 1;
      spot.shadow.camera.near = Math.max(0.1, params.lightDistance - r * 2);
      spot.shadow.camera.far = params.lightDistance + params.wallDistance + 1;
      spot.shadow.camera.fov = Math.max(1, params.spotAngle ?? 25) * 1.2;
      spot.shadow.camera.updateProjectionMatrix();
    });
  }

  // Glyph-Masken als echtes Signed-Distance-Field (Half-Float, LINEAR gefiltert).
  // Wert = vorzeichenbehaftete Distanz zum Glyph-Rand in UV-Einheiten, positiv = im Glyph.
  // Die Shader marschieren damit exakt (Sphere Tracing), Normalen kommen aus dem glatten Gradienten.
  const SDF_SIZE = 512;
  const SDF_SPREAD_PX = 24;
  const SDF_SPREAD_UV = SDF_SPREAD_PX / SDF_SIZE;
  const SDF_INF = 1e20;

  // Felzenszwalb/Huttenlocher: eindimensionale quadrierte Distanztransformation (in place)
  function edt1d(grid, offset, stride, length, f, v, z) {
    v[0] = 0; z[0] = -SDF_INF; z[1] = SDF_INF;
    f[0] = grid[offset];
    for (let q = 1, k = 0, s = 0; q < length; q++) {
      f[q] = grid[offset + q * stride];
      const q2 = q * q;
      do {
        const r = v[k];
        s = (f[q] - f[r] + q2 - r * r) / (q - r) / 2;
      } while (s <= z[k] && --k > -1);
      k++;
      v[k] = q; z[k] = s; z[k + 1] = SDF_INF;
    }
    for (let q = 0, k = 0; q < length; q++) {
      while (z[k + 1] < q) k++;
      const r = v[k], qr = q - r;
      grid[offset + q * stride] = f[r] + qr * qr;
    }
  }

  function edt2d(grid, size) {
    const f = new Float64Array(size), z = new Float64Array(size + 1), v = new Uint16Array(size);
    for (let x = 0; x < size; x++) edt1d(grid, x, size, size, f, v, z);
    for (let y = 0; y < size; y++) edt1d(grid, y * size, 1, size, f, v, z);
  }

  function makeSdfTexture(values) {
    const tex = new THREE.DataTexture(values, SDF_SIZE, SDF_SIZE, THREE.RedFormat, THREE.HalfFloatType);
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.generateMipmaps = false;
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.needsUpdate = true;
    return tex;
  }

  function emptySdfTexture() {
    const out = new Uint16Array(SDF_SIZE * SDF_SIZE);
    out.fill(THREE.DataUtils.toHalfFloat(-SDF_SPREAD_UV));
    return makeSdfTexture(out);
  }

  // Aus dem antialiasten Canvas (weiss auf schwarz) ein SDF mit Subpixel-Genauigkeit (wie tiny-sdf)
  function canvasToSdfTexture(ctx) {
    const size = SDF_SIZE;
    const img = ctx.getImageData(0, 0, size, size).data;
    const n = size * size;
    const outer = new Float64Array(n), inner = new Float64Array(n);
    let any = false;
    for (let i = 0; i < n; i++) {
      const a = img[i * 4] / 255;
      if (a === 1) { outer[i] = 0; inner[i] = SDF_INF; any = true; }
      else if (a === 0) { outer[i] = SDF_INF; inner[i] = 0; }
      else {
        any = true;
        const d = 0.5 - a;
        outer[i] = d > 0 ? d * d : 0;
        inner[i] = d < 0 ? d * d : 0;
      }
    }
    if (!any) return emptySdfTexture();
    edt2d(outer, size);
    edt2d(inner, size);
    const out = new Uint16Array(n);
    const toHalf = THREE.DataUtils.toHalfFloat;
    for (let y = 0; y < size; y++) {
      // Canvas-Zeile 0 = oben = v 1 (wie flipY bei CanvasTexture)
      const dst = (size - 1 - y) * size;
      const src = y * size;
      for (let x = 0; x < size; x++) {
        const dpx = Math.sqrt(inner[src + x]) - Math.sqrt(outer[src + x]);
        out[dst + x] = toHalf(Math.max(-SDF_SPREAD_PX, Math.min(SDF_SPREAD_PX, dpx)) / size);
      }
    }
    return makeSdfTexture(out);
  }

  function createGlyphTexture(text, rotation = 0, showCursor = false) {
    const size = SDF_SIZE;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    // Schwarzer Hintergrund (= nicht im Loch)
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, size, size);

    const safeText = text ?? '';
    const fontFamily = FONT_OPTIONS[currentFontKey] || FONT_OPTIONS[DEFAULT_FONT_KEY];

    // Leerer Text ohne Cursor = nur schwarzer Hintergrund
    if (safeText.length === 0 && !showCursor) return emptySdfTexture();

    // Rotation um Mittelpunkt
    ctx.translate(size / 2, size / 2);
    ctx.rotate(rotation);

    // Text zentriert zeichnen (weiß = Loch)
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Dynamische Schriftgröße basierend auf Text + Cursor-Breite
    const maxSize = size * 0.85;
    let fontSize = size * 0.703;
    const cursorWidthRatio = 0.08;  // Cursor-Breite relativ zur Schriftgröße
    const cursorGap = showCursor ? fontSize * 0.05 : 0;  // Abstand zum Cursor

    ctx.font = `bold ${fontSize}px ${fontFamily}`;
    let metrics = ctx.measureText(safeText);

    // Berücksichtige Cursor bei der Skalierung
    const textWidth = metrics.width + (showCursor ? fontSize * cursorWidthRatio + cursorGap : 0);
    const textHeight = metrics.actualBoundingBoxAscent + metrics.actualBoundingBoxDescent || fontSize;
    const scale = Math.min(maxSize / textWidth, maxSize / textHeight, 1);
    fontSize = fontSize * scale;
    ctx.font = `bold ${fontSize}px ${fontFamily}`;

    // Neu messen nach Skalierung
    metrics = ctx.measureText(safeText);
    const yOffset = (metrics.actualBoundingBoxAscent - metrics.actualBoundingBoxDescent) / 2;

    // Text-Position: Wenn Cursor da ist, Text etwas nach links
    const cursorWidth = fontSize * cursorWidthRatio;
    const cursorGapScaled = showCursor ? fontSize * 0.05 : 0;
    const textOffsetX = showCursor ? -(cursorWidth + cursorGapScaled) / 2 : 0;

    // Text zeichnen
    if (safeText.length > 0) {
      // Leichte Kontur verdickt feine Striche (v.a. die duenne ∞-Schleife), damit der Schatten aus der Ferne lesbar bleibt
      ctx.strokeStyle = '#ffffff';
      ctx.lineJoin = 'round';
      ctx.lineWidth = fontSize * 0.02;
      ctx.strokeText(safeText, textOffsetX, yOffset);
      ctx.fillText(safeText, textOffsetX, yOffset);
    }

    // Cursor zeichnen (dünner vertikaler Strich nach dem Text)
    if (showCursor) {
      const cursorHeight = fontSize * 0.85;
      const cursorX = metrics.width / 2 + textOffsetX + cursorGapScaled;
      ctx.fillRect(cursorX, -cursorHeight / 2, cursorWidth, cursorHeight);
    }

    return canvasToSdfTexture(ctx);
  }

  function updateGlyphTexturesFor(entry) {
    const rot0   = (params.glyphRot0   || 0) * Math.PI / 180;
    const rotInf = (params.glyphRotInf || 0) * Math.PI / 180;
    const rot1   = (params.glyphRot1   || 0) * Math.PI / 180;
    const t = entry.glyphTextures;
    const keys = entry.glyphKeys || (entry.glyphKeys = {});
    const isPrimary = (spheres[0] && entry === spheres[0]);
    const showL = isPrimary && activeGlyphTarget === 'left'  && cursorVisible;
    const showF = isPrimary && activeGlyphTarget === 'floor' && cursorVisible;
    const showR = isPrimary && activeGlyphTarget === 'right' && cursorVisible;
    // SDF nur neu bauen, wenn sich Text, Font, Rotation oder Cursor dieses Slots geaendert haben
    const slots = [
      ['x', entry.glyphChars.left,  rot0,   showL],
      ['y', entry.glyphChars.floor, rotInf, showF],
      ['z', entry.glyphChars.right, rot1,   showR],
    ];
    for (const [slot, text, rot, cur] of slots) {
      const key = `${currentFontKey}|${text ?? ''}|${rot}|${cur ? 1 : 0}`;
      if (t[slot] && keys[slot] === key) continue;
      if (t[slot]) t[slot].dispose();
      t[slot] = createGlyphTexture(text, rot, cur);
      keys[slot] = key;
    }
    if (entry.mesh && entry.mesh.material && entry.mesh.material.uniforms) {
      entry.mesh.material.uniforms.uGlyphTexX.value = t.x;
      entry.mesh.material.uniforms.uGlyphTexY.value = t.y;
      entry.mesh.material.uniforms.uGlyphTexZ.value = t.z;
    }
  }

  function updateGlyphTextures() {
    spheres.forEach(updateGlyphTexturesFor);
    if (spheres[0]) glyphTextures = spheres[0].glyphTextures; // keep legacy global in sync

  // Cursor-Blink starten/stoppen

    stopCursorBlink();
    activeGlyphTarget = target;
    cursorVisible = true;
    updateGlyphTextures();
    needsUniformUpdate = true;

    cursorBlinkInterval = setInterval(() => {
      // Im versteckten Tab nichts tun. setInterval laeuft dort weiter (anders
      // als requestAnimationFrame, das der Browser anhaelt), und
      // updateGlyphTextures baut drei Canvas mit 1024x1024 neu — rund 12 MB
      // Texturen alle 500 ms fuer ein Blinken, das niemand sieht.
      // Das Blinken selbst bleibt unveraendert bei 500 ms.
      if (document.hidden) return;
      cursorVisible = !cursorVisible;
      updateGlyphTextures();
      needsUniformUpdate = true;
    }, 500);
  }

  function stopCursorBlink() {
    if (cursorBlinkInterval) {
      clearInterval(cursorBlinkInterval);
      cursorBlinkInterval = null;
    }
    if (activeGlyphTarget) {
      activeGlyphTarget = null;
      cursorVisible = false;
      updateGlyphTextures();
      needsUniformUpdate = true;
    }

  // Gemeinsamer GLSL-Block fuer Haupt-, Tiefen- und Nebel-Shader: exakte SDF-Szene.
  // Voraussetzung im Shader: uGlyphSize, uGebEnabled, uInvertMode, uShapeCube.
  // Tunnel-Textur = 2D-SDF (positiv im Glyph), jeder Tunnel ist ein unendlicher Zylinder.
  // Normal: Form minus Vereinigung der Tunnel = max(Form, max_i t_i).
  // Invertiert: Form geschnitten mit allen Tunneln = max(Form, max_i -t_i).
  const sdfGlsl = `
    float sdfShape(vec3 p) {
      if (uShapeCube == 1) return max(abs(p.x), max(abs(p.y), abs(p.z))) - 1.0;
      return length(p) - 1.0;
    }

    // Aeussere Normale der Form (Kugel: radial, Wuerfel: Flaeche der groessten Komponente)
    vec3 sdfShapeNormal(vec3 p) {
      if (uShapeCube == 1) {
        vec3 a = abs(p);
        if (a.x >= a.y && a.x >= a.z) return vec3(sign(p.x), 0.0, 0.0);
        if (a.y >= a.z) return vec3(0.0, sign(p.y), 0.0);
        return vec3(0.0, 0.0, sign(p.z));
      }
      return normalize(p);
    }

    // UV der drei Tunnel (X und Y gespiegelt, Z original)
    vec2 sdfUvX(vec3 p) { float k = 0.5 / (max(uGlyphSize, 1e-3) * 0.3); return vec2(0.5 - p.z * k, p.y * k + 0.5); }
    vec2 sdfUvY(vec3 p) { float k = 0.5 / (max(uGlyphSize, 1e-3) * 0.3); return vec2(p.x * k + 0.5, 0.5 - p.z * k); }
    vec2 sdfUvZ(vec3 p) { float k = 0.5 / (max(uGlyphSize, 1e-3) * 0.3); return vec2(p.x * k + 0.5, p.y * k + 0.5); }

    // Distanz zum Glyph-Rand in lokalen Einheiten, positiv = im Glyph. Ausserhalb der Textur: Randwert minus Abstand zum Rand.
    float sdfTube(sampler2D tex, vec2 uv) {
      vec2 c = clamp(uv, 0.0, 1.0);
      return (textureLod(tex, c, 0.0).r - length(uv - c)) * (0.6 * uGlyphSize);
    }

    float sdfSolid(vec3 p, sampler2D tx, sampler2D ty, sampler2D tz) {
      float s = sdfShape(p);
      if (uGebEnabled == 0) return uInvertMode == 1 ? 1.0 : s;
      float sg = uInvertMode == 1 ? -1.0 : 1.0;
      float d = max(s, sg * sdfTube(tx, sdfUvX(p)));
      d = max(d, sg * sdfTube(ty, sdfUvY(p)));
      return max(d, sg * sdfTube(tz, sdfUvZ(p)));
    }

    // Sphere Tracing mit echten Distanzen. true = Strahl trifft Festkoerper in [t0, t1].
    bool sdfRayHit(vec3 ro, vec3 rd, float t0, float t1, sampler2D tx, sampler2D ty, sampler2D tz, out float tHit) {
      float t = t0;
      float d = 1.0;
      float eps = 2e-4;
      for (int i = 0; i < 160; i++) {
        if (t > t1) { tHit = t; return false; }
        d = sdfSolid(ro + rd * t, tx, ty, tz);
        eps = 2e-4 * (1.0 + t);
        if (d < eps) { tHit = t; return true; }
        t += d * 0.95;
      }
      // Schleifenende: nur bei streifendem Kontakt noch als Treffer werten
      tHit = t;
      return d < eps * 20.0;
    }

    vec3 sdfSafeNormal(vec3 v) {
      float l = length(v);
      return l > 1e-6 ? v / l : vec3(0.0, 0.0, 1.0);
    }

    // Gradient der Tunnel-SDF (UV-Richtung), zentrale Differenzen ueber ~3 Texel auf dem glatten Feld
    vec2 sdfTubeGrad(sampler2D tex, vec2 uv) {
      float e = 3.0 / ${SDF_SIZE}.0;
      float gx = sdfTube(tex, uv + vec2(e, 0.0)) - sdfTube(tex, uv - vec2(e, 0.0));
      float gy = sdfTube(tex, uv + vec2(0.0, e)) - sdfTube(tex, uv - vec2(0.0, e));
      return vec2(gx, gy);
    }

    // Aeussere Normale des Festkoerpers an p. kind: 0 = Form (Kugel/Wuerfel), 1 = Tunnel-Wand.
    // Es zaehlt nur der dominante Term: scharfe Kanten, glatte Waende.
    vec3 sdfSolidNormal(vec3 p, sampler2D tx, sampler2D ty, sampler2D tz, out int kind) {
      kind = 0;
      float best = sdfShape(p);
      float sg = uInvertMode == 1 ? -1.0 : 1.0;
      int axis = 0;
      if (uGebEnabled == 1) {
        float fx = sg * sdfTube(tx, sdfUvX(p));
        float fy = sg * sdfTube(ty, sdfUvY(p));
        float fz = sg * sdfTube(tz, sdfUvZ(p));
        if (fx > best) { best = fx; axis = 1; }
        if (fy > best) { best = fy; axis = 2; }
        if (fz > best) { best = fz; axis = 3; }
      }
      if (axis == 0) return sdfShapeNormal(p);
      kind = 1;
      vec3 g;
      if (axis == 1) { vec2 q = sdfTubeGrad(tx, sdfUvX(p)); g = vec3(0.0, q.y, -q.x); }
      else if (axis == 2) { vec2 q = sdfTubeGrad(ty, sdfUvY(p)); g = vec3(q.x, 0.0, -q.y); }
      else { vec2 q = sdfTubeGrad(tz, sdfUvZ(p)); g = vec3(q.x, q.y, 0.0); }
      return sdfSafeNormal(sg * g);
    }
  `;

  const sphereVertexShader = `
    varying vec3 vWorldPos;
    varying vec3 vNormal;
    varying vec3 vLocalPos;
    varying vec3 vCameraLocal;

    uniform mat4 uModelMatrixInverse;

    void main() {
      vLocalPos = position;
      vNormal = normalize(normalMatrix * normal);
      vec4 worldPos = modelMatrix * vec4(position, 1.0);
      vWorldPos = worldPos.xyz;
      // Kamera-Position in lokalem Koordinatensystem
      vCameraLocal = (uModelMatrixInverse * vec4(cameraPosition, 1.0)).xyz;
      gl_Position = projectionMatrix * viewMatrix * worldPos;
    }
  `;

  const sphereFragmentShader = `
    precision highp float;

    uniform vec3 uColor;
    uniform float uGlyphSize;
    uniform sampler2D uGlyphTexX;
    uniform sampler2D uGlyphTexY;
    uniform sampler2D uGlyphTexZ;
    uniform float uAmbient;
    uniform float uBrightness;     // Licht-Intensität (normalisiert)
    uniform float uDecay;          // Licht-Abfall (0=keiner, 1=linear, 2=physikalisch)
    uniform float uLightDistance;  // Distanz der Lichtquellen vom Zentrum
    uniform int uGebEnabled;
    uniform int uInvertMode;       // 0=normal (Löcher), 1=invertiert (nur Zeichen)
    uniform int uShapeCube;        // 0=Kugel, 1=Wuerfel
    uniform vec3 uLightsActive;    // Welche Lichter aktiv sind (x=floor, y=back, z=side)

    varying vec3 vWorldPos;
    varying vec3 vNormal;
    varying vec3 vLocalPos;
    varying vec3 vCameraLocal;

    ${sdfGlsl}

    // Strahl gegen die Form (Kugel oder Wuerfel mit Halbkante 1): tEnter/tExit, false = kein Treffer
    bool shapeRange(vec3 ro, vec3 rd, out float tEnter, out float tExit) {
      if (uShapeCube == 1) {
        vec3 inv = 1.0 / (rd + vec3(1e-9));
        vec3 t0 = (-vec3(1.0) - ro) * inv;
        vec3 t1 = ( vec3(1.0) - ro) * inv;
        vec3 tmin = min(t0, t1);
        vec3 tmax = max(t0, t1);
        tEnter = max(tmin.x, max(tmin.y, tmin.z));
        tExit = min(tmax.x, min(tmax.y, tmax.z));
        return tEnter <= tExit;
      }
      float a = dot(rd, rd);
      float b = 2.0 * dot(ro, rd);
      float c = dot(ro, ro) - 1.0;
      float disc = b * b - 4.0 * a * c;
      if (disc < 0.0) return false;
      float sq = sqrt(disc);
      tEnter = (-b - sq) / (2.0 * a);
      tExit = (-b + sq) / (2.0 * a);
      return true;
    }

    void main() {
      vec3 rayOrigin = vCameraLocal;
      vec3 rayDir = normalize(vLocalPos - vCameraLocal);

      // Ray-Sphere Intersection für Start/End des Raymarchings
      float tEnter, tExit;
      if (!shapeRange(rayOrigin, rayDir, tEnter, tExit)) discard;

      if (tExit < 0.0) discard;
      tEnter = max(tEnter, 0.001);

      // Sphere Tracing gegen die exakte SDF (Kugel/Wuerfel mit Tunneln)
      float tHit;
      if (!sdfRayHit(rayOrigin, rayDir, tEnter, tExit, uGlyphTexX, uGlyphTexY, uGlyphTexZ, tHit)) discard;

      vec3 hitPos = rayOrigin + rayDir * tHit;
      int kind;
      vec3 hitNormal = sdfSolidNormal(hitPos, uGlyphTexX, uGlyphTexY, uGlyphTexZ, kind);
      int hitType = 0;  // 0=Aussenseite, 1=Innenseite, 2=Tunnel-Wand (nur Normal-Modus)
      if (dot(hitNormal, rayDir) > 0.0) {
        hitNormal = -hitNormal;
        hitType = 1;
      } else if (kind == 1 && uInvertMode == 0) {
        hitType = 2;
      }

      // Lichtrichtungen (von Lichtquelle zur Kugel)
      vec3 lightPos1 = vec3(0.0, 1.0, 0.0) * uLightDistance;  // Floor-Spot
      vec3 lightPos2 = vec3(0.0, 0.0, 1.0) * uLightDistance;  // Back-Spot
      vec3 lightPos3 = vec3(1.0, 0.0, 0.0) * uLightDistance;  // Side-Spot

      vec3 toLight1 = lightPos1 - hitPos;
      vec3 toLight2 = lightPos2 - hitPos;
      vec3 toLight3 = lightPos3 - hitPos;

      float dist1 = length(toLight1);
      float dist2 = length(toLight2);
      float dist3 = length(toLight3);

      // Diffuse: wie direkt das Licht auf die Oberfläche trifft
      float diff1 = max(dot(hitNormal, normalize(toLight1)), 0.0);
      float diff2 = max(dot(hitNormal, normalize(toLight2)), 0.0);
      float diff3 = max(dot(hitNormal, normalize(toLight3)), 0.0);

      // Decay: 0 = kein Abfall, 1 = linear, 2 = physikalisch (1/d²)
      float decay1 = 1.0, decay2 = 1.0, decay3 = 1.0;
      if (uDecay > 0.0) {
        decay1 = pow(max(dist1, 0.1), -uDecay);
        decay2 = pow(max(dist2, 0.1), -uDecay);
        decay3 = pow(max(dist3, 0.1), -uDecay);
      }

      // Lichtintensität pro Spot: diffuse × decay × brightness × aktiv
      // uLightsActive: x=floor, y=back, z=side (0.0 oder 1.0)
      float light1 = diff1 * decay1 * uLightsActive.x;
      float light2 = diff2 * decay2 * uLightsActive.y;
      float light3 = diff3 * decay3 * uLightsActive.z;

      // Summe aller aktiven Lichter, normalisiert auf Anzahl aktiver Lichter
      float activeLights = uLightsActive.x + uLightsActive.y + uLightsActive.z;
      float rawLight = activeLights > 0.0 ? (light1 + light2 + light3) / activeLights : 0.0;
      float directLight = rawLight * uBrightness;

      // Ambient: Grundhelligkeit (0-1), nur aktiv wenn brightness > 0
      // Bei brightness=0 → komplett dunkel
      float ambientLight = uAmbient * min(uBrightness, 1.0);  // Ambient nicht über 1.0 skalieren
      float totalLight = ambientLight + directLight;

      // Tunnel-Wände und Innenseite etwas dunkler
      if (hitType == 1) totalLight *= 0.7;
      if (hitType == 2) totalLight *= 0.85;

      vec3 finalColor = uColor * clamp(totalLight, 0.0, 1.0);
      gl_FragColor = vec4(finalColor, 1.0);
    }
  `;

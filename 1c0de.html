<!DOCTYPE html>
<html lang="de">
<head>
  <!--#include virtual="/includes/something-in-the-head.html" -->
  <meta charset="UTF-8">
  <title>1c0de</title>
  <style>
    body, body.menu-open { overflow: hidden; }
    .ctrl-seitensuche { position: static; max-width: none; margin: 0 0 0.5rem; max-height: min(30vh, 220px); }
    .ctrl-seitensuche mark { background: none; color: inherit; font-weight: 700; text-decoration: underline; }
    .ctrl-seitensuche .ctrl-select-option { display: flex; flex-direction: column; gap: 0.15rem; flex: none; }
    .ctrl-seitensuche-zeile { opacity: 0.6; font-size: 0.8em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ctrl-seitensuche-hinweis { padding: 0.45rem 0.65rem; opacity: 0.6; font-size: 0.85em; }
    #muster, #mass {
      white-space: pre;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-weight: 700;
      font-kerning: none;
      font-variant-ligatures: none;
      font-synthesis: none;
      letter-spacing: 0;
      line-height: 1;
      tab-size: 4;
      text-align: left;
      text-shadow: none;
      margin: 0;
      padding: 0;
    }
    #muster { position: fixed; left: 0; top: 0; margin: 0; width: max-content; height: max-content; contain: layout paint; }
    #fern, #nah { position: fixed; left: 0; top: 0; margin: 0; pointer-events: none; image-rendering: auto; will-change: opacity; }
    #fern, #nah, #muster { filter: grayscale(1); }
    #nah { visibility: hidden; }
    #mass { position: absolute; left: -99999px; top: 0; visibility: hidden; font-size: 100px; }
    #meldung { position: fixed; left: 0; right: 0; top: 0; padding: 1rem; text-align: left; }
  </style>
</head>
<body>
  <div id="meldung" role="alert" hidden></div>
  <canvas id="fern" aria-hidden="true"></canvas>
  <canvas id="nah" aria-hidden="true"></canvas>
  <div id="muster"></div>
  <div id="mass" aria-hidden="true"></div>

  <script>
  (function () {
    'use strict';
    const ziel = document.getElementById('muster');
    const mass = document.getElementById('mass');
    const meldung = document.getElementById('meldung');
    const fern = document.getElementById('fern');
    const fg = fern.getContext('2d');
    const nah = document.getElementById('nah');
    const ng = nah.getContext('2d');
    const cfg = { modus: 'text', quelle: 'seite', form: '01', pfad: location.pathname, groesse: 1 };
    const BUNDLE = '/includes/code-bundle.txt';
    const PROJEKT_SCHWELLE = 100;
    const MASKE_B = 1600;
    const SYMBOL_MS = 33;
    const SYMBOL_PROBEN = 12;
    const FERN_START = 1.5;
    const FERN_ENDE = 4;
    const SYMBOL_DECKUNG = 16;
    const PROJ_F = 100;
    const knoten = document.createTextNode('');
    ziel.appendChild(knoten);
    let zeichen = null;
    let quelle = '';
    let astral = false;
    let lauf = 0;
    let raster = null;
    let anim = null;
    let zeit = null;
    const kleine = new Map();
    let textAktuell = false;
    // Zeichen je breitester Zeile und gerenderte Zeilen des Nahtexts: die Box misst nur das, nicht das ganze Raster (Leerrand rechts/unten)
    let textMasse = { b: 1, h: 1 };
    function textSetzen(zl) {
      let b = 1;
      for (const z of zl) if (z.length > b) b = z.length;
      textMasse = { b, h: Math.max(1, zl.length - (zl.length && zl[zl.length - 1] === '' ? 1 : 0)) };
      knoten.data = zl.join('\n');
    }
    let neuText = null;
    let farbe = '';
    const weich = (a, b, v) => { const t = Math.max(0, Math.min(1, (v - a) / (b - a))); return t * t * (3 - 2 * t); };
    // Sichtbarer Bereich (visualViewport: Tastatur, Adressleiste), Mitte in CSS-Pixeln der Layout-Ansicht
    function sicht() {
      const v = window.visualViewport;
      const dpr = window.devicePixelRatio || 1;
      const w = v ? v.width : innerWidth, h = v ? v.height : innerHeight;
      const l = v ? v.offsetLeft : 0, t = v ? v.offsetTop : 0;
      return { w, h, l, t, cx: l + w / 2, cy: t + h / 2, dpr };
    }
    const einrasten = (v, dpr) => Math.round(v * dpr) / dpr;
    // Ansicht wie bibelaufdenpunkt.html (Schwenk und Zoom): Zoom2D haelt die Welt unter Zeiger/Fingern fest; hier wird daraus die Bildmitte
    const ansichtMitte = sv => ({ x: sv.cx + ansicht.ox + (ansicht.scale - 1) * sv.w / 2, y: sv.cy + ansicht.oy + (ansicht.scale - 1) * sv.h / 2 });
    // Fernansicht wie bibelaufdenpunkt: echter Text als kleine Textur, per Bitmap-Skalierung ohne Mipmaps verkleinert (daher Moire), weich ueberblendet mit dem Nahtext
    let fernAn = true;
    let fernMass = null;
    let neuFern = null;
    function fernTextur(zeilen, spalten, nZeilen, zm) {
      const tcw = Math.min(4, 4096 / spalten, 4096 / (nZeilen * zm.h / zm.b));
      const tch = tcw * zm.h / zm.b;
      // aufrunden und die Randpixel leer lassen: Rundung auf ganze Pixel hat die Textur gegenueber dem Nahtext gestreckt
      const bw = Math.max(1, Math.ceil(spalten * tcw)), bh = Math.max(1, Math.ceil(nZeilen * tch));
      fernMass = { tcw, tch, bw, bh, spalten, nZeilen };
      if (fern.width !== bw || fern.height !== bh) { fern.width = bw; fern.height = bh; } else { fg.setTransform(1, 0, 0, 1, 0, 0); fg.clearRect(0, 0, bw, bh); }
      // Grosse Schrift unter Skalierung: kleine Schriftgroessen runden die Zeichenbreite (Hinting) und driften
      const sx = tcw / (zm.b * PROJ_F);
      fg.setTransform(sx, 0, 0, sx, 0, 0);
      fg.font = `bold ${PROJ_F}px ${getComputedStyle(ziel).fontFamily}`;
      fg.fillStyle = farbe;
      fg.textBaseline = 'middle';
      fg.textAlign = 'left';
      fg.fontKerning = 'none';
      for (let i = 0; i < zeilen.length; i++) if (zeilen[i]) fg.fillText(zeilen[i], 0, (i + 0.5) * tch / sx);
      fg.setTransform(1, 0, 0, 1, 0, 0);
    }

    function fehler(text, err) {
      console.error('[1c0de] ' + text, err || '');
      stopp();
      meldung.textContent = text;
      meldung.hidden = false;
      knoten.data = '';
      fg.clearRect(0, 0, fern.width, fern.height);
      ng.clearRect(0, 0, nah.width, nah.height);
      nah.style.visibility = 'hidden';
      proj = null;
      raster = null;
    }

    function zellmass() {
      mass.textContent = ('0'.repeat(10) + '\n').repeat(10).slice(0, -1);
      const r = mass.getBoundingClientRect();
      return { b: r.width / 10 / 100, h: r.height / 10 / 100 };
    }

    function maske(form) {
      const aspekt = innerWidth / innerHeight;
      const b = MASKE_B;
      const h = Math.max(1, Math.round(b / aspekt));
      const cv = document.createElement('canvas');
      cv.width = b; cv.height = h;
      const g = cv.getContext('2d');
      const fam = getComputedStyle(document.body).fontFamily;
      g.font = `bold 100px ${fam}`;
      g.textBaseline = 'alphabetic';
      const m = g.measureText(form);
      const tb = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
      const th = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
      if (!(tb > 0 && th > 0)) throw new Error('Form leer');
      const s = Math.min(b / tb, h / th);
      g.font = `bold ${100 * s}px ${fam}`;
      g.fillStyle = '#000';
      g.fillText(form, (b - tb * s) / 2 + m.actualBoundingBoxLeft * s, (h - th * s) / 2 + m.actualBoundingBoxAscent * s);
      return cv;
    }

    // Zellen je Zielraster: Abwärtsskalierung mit hoher Filterqualität, Deckung >= 50 % zählt als Zelle
    function zellen(cv, spalten, zeilen, schwelle = 128) {
      const key = spalten + 'x' + zeilen;
      let k = kleine.get(key);
      if (!k) {
        const c = document.createElement('canvas');
        c.width = spalten; c.height = zeilen;
        const g = c.getContext('2d', { willReadFrequently: true });
        g.imageSmoothingEnabled = true;
        g.imageSmoothingQuality = 'high';
        k = { g };
        kleine.set(key, k);
        if (kleine.size > 12) kleine.delete(kleine.keys().next().value);
      }
      k.g.clearRect(0, 0, spalten, zeilen);
      k.g.drawImage(cv, 0, 0, spalten, zeilen);
      const d = k.g.getImageData(0, 0, spalten, zeilen).data;
      const an = new Uint8Array(spalten * zeilen);
      let n = 0;
      for (let i = 0; i < an.length; i++) if (d[i * 4 + 3] >= schwelle) { an[i] = 1; n++; }
      return { an, n, spalten, zeilen };
    }

    function stueck(rep, i, len) {
      return astral ? rep.slice(i, i + len).join('') : rep.substr(i, len);
    }

    function repetition(zellenAnzahl) {
      const N = zeichen.length;
      const mal = Math.ceil(zellenAnzahl / N) + 1;
      return astral ? Array.from({ length: N * mal }, (_, i) => zeichen[i % N]) : quelle.repeat(mal);
    }

    // x0..x1: Spaltenausschnitt; Zeilen y0..y1 (einschließlich); trailing Leerzeichen entfallen
    function zeilenBauen(r, rep, x0, x1, y0, y1) {
      const an = r.an, sp = r.spalten;
      const out = [];
      let i = 0;
      for (let y = 0; y < r.zeilen; y++) {
        const o = y * sp;
        for (let x = 0; x < x0; x++) if (an[o + x]) i++;
        if (y < y0 || y > y1) { for (let x = x0; x <= x1; x++) if (an[o + x]) i++; for (let x = x1 + 1; x < sp; x++) if (an[o + x]) i++; continue; }
        let z = '';
        let x = x0;
        while (x <= x1) {
          if (!an[o + x]) { let l = x; while (x <= x1 && !an[o + x]) x++; if (x <= x1) z += ' '.repeat(x - l); continue; }
          let l = x; while (x <= x1 && an[o + x]) x++;
          z += stueck(rep, i, x - l); i += x - l;
        }
        for (let xx = x1 + 1; xx < sp; xx++) if (an[o + xx]) i++;
        out.push(z);
      }
      return out;
    }

    function spaltenFinden(masken, zeilenZu, N, schwelle = 128) {
      const min = c => Math.min(...masken.map(cv => zellen(cv, c, zeilenZu(c), schwelle).n));
      let lo = 1, hi = MASKE_B;
      if (min(hi) < N) throw new Error('Form zu klein für ' + N + ' Zeichen');
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (min(mid) >= N) hi = mid; else lo = mid + 1;
      }
      return lo;
    }

    function stopp() {
      if (anim) { cancelAnimationFrame(anim.id); anim = null; }
    }

    function aufbauen() {
      stopp();
      neuText = null;
      textAktuell = false;
      farbe = getComputedStyle(ziel).color;
      if (zeichen === null) return;
      meldung.hidden = true;
      try {
        const N = zeichen.length;
        if (!N) throw new Error('Quelltext leer');
        const zm = zellmass();
        if (cfg.quelle === 'projekt') return projektAufbauen(N, zm);
        if (cfg.modus === '018') return symbol(N, zm);
        const cv = maske(cfg.form);
        const zeilenZu = c => Math.max(1, Math.round(c * (cv.height / cv.width) * zm.b / zm.h));
        const c = spaltenFinden([cv], zeilenZu, N);
        const r = zellen(cv, c, zeilenZu(c));
        let x0 = c, x1 = -1, y0 = r.zeilen, y1 = -1;
        for (let y = 0; y < r.zeilen; y++) for (let x = 0; x < c; x++) if (r.an[y * c + x]) {
          if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; y1 = y;
        }
        const rep = repetition(r.n);
        const zeilen = zeilenBauen(r, rep, x0, x1, y0, y1);
        raster = { spalten: x1 - x0 + 1, zeilen: y1 - y0 + 1, zm };
        textSetzen(zeilen);
        neuFern = () => fernTextur(zeilen, x1 - x0 + 1, y1 - y0 + 1, zm);
        neuFern();
        fernAn = true;
        groesseSetzen();
      } catch (e) {
        fehler(String(e && e.message ? e.message : e), e);
      }
    }

    // Rotierendes 0 1 ∞ der Startseite: Zeichenfunktion und Tempo aus meta.js (drawFaviconFrame, faviconAutoSpeed)
    function symbol(N, zm) {
      if (typeof drawFaviconFrame !== 'function' || typeof faviconAutoSpeed !== 'function') throw new Error('drawFaviconFrame fehlt');
      const zeichneAuf = (g, S, grad) => {
        g.setTransform(S / FAVICON_SIZE, 0, 0, S / FAVICON_SIZE, 0, 0);
        drawFaviconFrame(g, grad * Math.PI / 180);
      };
      const neu = S => { const c = document.createElement('canvas'); c.width = c.height = S; return c; };
      const zeilenZu = c => Math.max(1, Math.round(c * zm.b / zm.h));
      const SP = 360;
      const proben = [];
      for (let a = 0; a < 360; a += 360 / SYMBOL_PROBEN) { const pc = neu(SP); zeichneAuf(pc.getContext('2d'), SP, a); proben.push(pc); }
      const c = Math.min(MASKE_B, Math.ceil(spaltenFinden(proben, zeilenZu, N, SYMBOL_DECKUNG) * 1.15));
      const z = zeilenZu(c);
      const cv = document.createElement('canvas');
      cv.width = c; cv.height = z;
      const g = cv.getContext('2d', { willReadFrequently: true });
      const rep = repetition(c * z);
      const r = { an: new Uint8Array(c * z), spalten: c, zeilen: z };
      neuText = () => textSetzen(zeilenBauen(r, rep, 0, c - 1, 0, z - 1));
      neuFern = () => fernTextur(zeilenBauen(r, rep, 0, c - 1, 0, z - 1), c, z, zm);
      fernAn = true;
      raster = { spalten: c, zeilen: z, zm };
      let gesetzt = false;
      const frame = grad => {
        g.setTransform(c / FAVICON_SIZE, 0, 0, z / FAVICON_SIZE, 0, 0);
        drawFaviconFrame(g, grad * Math.PI / 180);
        const d = g.getImageData(0, 0, c, z).data;
        const an = r.an;
        for (let i = 0; i < an.length; i++) an[i] = d[i * 4 + 3] >= SYMBOL_DECKUNG ? 1 : 0;
        if (textAktuell || fernAn) {
          const zl = zeilenBauen(r, rep, 0, c - 1, 0, z - 1);
          if (textAktuell) textSetzen(zl);
          if (fernAn) fernTextur(zl, c, z, zm);
        }
        if (!gesetzt) { gesetzt = true; groesseSetzen(); }
      };
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) { frame(0); return; }
      if (!zeit || zeit.modus !== '018') zeit = { modus: '018', start: null, virtuell: 0, winkel: 0 };
      const st = { id: 0, letzter: -Infinity };
      anim = st;
      const tick = now => {
        st.id = requestAnimationFrame(tick);
        if (document.hidden || now - st.letzter < SYMBOL_MS - 1) return;
        st.letzter = now;
        if (zeit.start === null) zeit.start = now;
        const elapsed = (now - zeit.start) / 1000;
        const due = Math.floor(elapsed * 60);
        if (due - zeit.virtuell > 10) zeit.virtuell = due - 10;
        const speed = faviconAutoSpeed(elapsed);
        while (zeit.virtuell < due) { zeit.winkel = (zeit.winkel + speed) % 360; zeit.virtuell++; }
        frame(zeit.winkel);
      };
      st.id = requestAnimationFrame(tick);
    }

    // ---- Ganzes Projekt: das rotierende Symbol aus dem gesamten eigenen Quelltext ----
    // Vier Glyphen (0, 1, ∞, ≡), sechs Plaetze. Jede Glyphe ist eine feste Zellmaske (1 Pixel = 1 Zelle, Zeilenlaeufe);
    // Drehung und Bewegung sind nur Transformationen. Fern: echter Text als Textur, verkleinert (Moire). Nah: nur der sichtbare Ausschnitt per fillText.
    const SYMBOL_HALB = 6.5;
    // Millionen Glyphen: das Nahbild erst bei groesserer Schrift einblenden (weniger Zeichen je Bild)
    const PROJ_NAH_START = 2;
    const PROJ_NAH_ENDE = 4.5;
    const TEX_PIXEL = 16e6;
    const TEX_SEITE = 8192;
    let proj = null;
    const ansicht = { scale: 1, ox: 0, oy: 0 };
    let projOffen = false;
    let projZuletzt = 0;

    function projektIndex(text) {
      const out = new Uint32Array(text.length);
      let n = 0;
      for (let i = 0; i < text.length; i++) {
        const c = text.codePointAt(i);
        if (c > 0xFFFF) i++;
        out[n++] = c;
      }
      return out.subarray(0, n);
    }

    function laufText(cps, N, von, len) {
      let i = von % N;
      let s = '';
      while (len > 0) {
        const m = Math.min(len, N - i, 4096);
        s += String.fromCodePoint.apply(null, cps.subarray(i, i + m));
        len -= m; i = (i + m) % N;
      }
      return s;
    }

    function spriteBauen(g, cw, ch, fam) {
      const SW = Math.ceil(2 * SYMBOL_HALB / cw), SH = Math.ceil(2 * SYMBOL_HALB / ch);
      if (SW > 9000 || SH > 9000) throw new Error('Quelltext zu gross fuer das Symbol');
      const cv = document.createElement('canvas');
      cv.width = SW; cv.height = SH;
      const c = cv.getContext('2d', { willReadFrequently: true });
      c.setTransform(1 / cw, 0, 0, 1 / ch, SW / 2, SH / 2);
      c.fillStyle = '#fff';
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.font = g.font;
      c.fillText(g.txt, 0, 0);
      const d = c.getImageData(0, 0, SW, SH).data;
      const rowOff = new Int32Array(SH + 1);
      const rx = [], rl = [], ri = [];
      let n = 0;
      for (let y = 0; y < SH; y++) {
        rowOff[y] = rx.length;
        const o = y * SW * 4 + 3;
        let x = 0;
        while (x < SW) {
          if (d[o + x * 4] < SYMBOL_DECKUNG) { x++; continue; }
          const l = x;
          while (x < SW && d[o + x * 4] >= SYMBOL_DECKUNG) x++;
          rx.push(l); rl.push(x - l); ri.push(n); n += x - l;
        }
      }
      rowOff[SH] = rx.length;
      let bx0 = SW, bx1 = 0, by0 = SH, by1 = 0;
      for (let y = 0; y < SH; y++) for (let r = rowOff[y]; r < rowOff[y + 1]; r++) {
        if (rx[r] < bx0) bx0 = rx[r];
        if (rx[r] + rl[r] > bx1) bx1 = rx[r] + rl[r];
        if (y < by0) by0 = y;
        by1 = y + 1;
      }
      return { SW, SH, bx0, by0, bw: Math.max(1, bx1 - bx0), bh: Math.max(1, by1 - by0), n, rowOff, rx: Int32Array.from(rx), rl: Int32Array.from(rl), ri: Int32Array.from(ri) };
    }

    function projektAufbauen(N, zm) {
      if (typeof drawFaviconFrame !== 'function') throw new Error('drawFaviconFrame fehlt');
      const fam = getComputedStyle(ziel).fontFamily;
      const glyphen = [
        { txt: FAVICON_LABELS[0], font: FAVICON_FONT_LABEL }, { txt: FAVICON_LABELS[1], font: FAVICON_FONT_LABEL },
        { txt: FAVICON_LABELS[2], font: FAVICON_FONT_LABEL }, { txt: '≡', font: FAVICON_FONT_EDGE },
      ];
      let cw = 0.03, sp = null, gesamt = 0;
      for (let it = 0; it < 10; it++) {
        const u = cw / zm.b;
        sp = glyphen.map(g => spriteBauen(g, cw, u * zm.h, fam));
        gesamt = sp[0].n + sp[1].n + sp[2].n + 3 * sp[3].n;
        if (gesamt >= N && gesamt <= N * 1.12) break;
        cw *= Math.sqrt(gesamt / (N * 1.04));
      }
      if (gesamt < N) throw new Error('Symbol zu klein fuer ' + N + ' Zeichen');
      const u = cw / zm.b;
      // Reihenfolge der Zeichen: Beschriftung 0, 1, ∞, dann die drei Kanten
      const plaetze = [[0, 0], [1, 0], [2, 0], [3, 0], [3, 1], [3, 2]];
      let basis = 0;
      const inst = plaetze.map(([gi, k]) => { const s = sp[gi]; const o = { s, kante: gi === 3, k, basis }; basis += s.n; return o; });
      // Fern-Textur: nur die Tintenbox je Glyphe, gemeinsame Zellgroesse k (Pixel je Zeichenbreite) nach Speicherbudget
      const rh = zm.h / zm.b;
      let flaeche = 0, maxB = 0, maxH = 0;
      for (const o of inst) { flaeche += o.s.bw * o.s.bh * rh; maxB = Math.max(maxB, o.s.bw); maxH = Math.max(maxH, o.s.bh * rh); }
      const k = Math.min(3, Math.sqrt(TEX_PIXEL / flaeche), TEX_SEITE / maxB, TEX_SEITE / maxH);
      for (const o of inst) {
        const s = o.s;
        const tw = Math.max(1, Math.ceil(s.bw * k)), th = Math.max(1, Math.ceil(s.bh * k * rh));
        const cv = document.createElement('canvas');
        cv.width = tw; cv.height = th;
        const c = cv.getContext('2d');
        const sx = k / (zm.b * PROJ_F);
        c.setTransform(sx, 0, 0, sx, 0, 0);
        c.font = `bold ${PROJ_F}px ${fam}`;
        c.fontKerning = 'none';
        c.fillStyle = farbe;
        c.textBaseline = 'middle';
        c.textAlign = 'left';
        const tch = k * rh;
        for (let y = s.by0; y < s.by0 + s.bh; y++) for (let r = s.rowOff[y]; r < s.rowOff[y + 1]; r++)
          c.fillText(laufText(zeichen, N, o.basis + s.ri[r], s.rl[r]), (s.rx[r] - s.bx0) * k / sx, (y - s.by0 + 0.5) * tch / sx);
        o.tex = cv; o.tk = k;
      }
      proj = { N, zm, u, cw, ch: u * zm.h, inst, fam, cps: zeichen };
      knoten.data = '';
      ziel.style.visibility = 'hidden';
      nah.style.visibility = 'visible';
      raster = null;
      projektStart();
      projektGroesse();
    }

    function projektSicht() {
      const sv = sicht();
      const dpr = sv.dpr;
      const W = Math.max(1, Math.round(sv.w * dpr)), H = Math.max(1, Math.round(sv.h * dpr));
      for (const c of [fern, nah]) {
        if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
        c.style.left = sv.l + 'px'; c.style.top = sv.t + 'px';
        c.style.width = W / dpr + 'px'; c.style.height = H / dpr + 'px';
      }
      const Pd = Math.min(sv.w, sv.h) / 32 * ansicht.scale * dpr;
      const cx = W / 2 + (ansicht.ox + (ansicht.scale - 1) * sv.w / 2) * dpr;
      const cy = H / 2 + (ansicht.oy + (ansicht.scale - 1) * sv.h / 2) * dpr;
      return { W, H, Pd, cx, cy };
    }

    function projektPlaetze(grad) {
      const R = FAVICON_RADIUS, a = grad * Math.PI / 180;
      const out = [];
      for (let i = 0; i < 3; i++) { const t = a + i * FAVICON_STEP; out.push({ x: R * Math.cos(t), y: R * Math.sin(t), rot: 0 }); }
      for (let i = 0; i < 3; i++) {
        const t0 = a + i * FAVICON_STEP, t1 = t0 + FAVICON_STEP;
        const x0 = R * Math.cos(t0), y0 = R * Math.sin(t0), x1 = R * Math.cos(t1), y1 = R * Math.sin(t1);
        out.push({ x: (x0 + x1) / 2, y: (y0 + y1) / 2, rot: Math.atan2(y1 - y0, x1 - x0) });
      }
      return out;
    }

    function projektZeichnen() {
      projZuletzt = performance.now();
      if (!proj) return;
      const { W, H, Pd, cx, cy } = projektSicht();
      const fs = proj.u * Pd;
      const t = weich(PROJ_NAH_START, PROJ_NAH_ENDE, fs);
      const pl = projektPlaetze(zeit ? zeit.winkel : 0);
      fg.setTransform(1, 0, 0, 1, 0, 0);
      fg.clearRect(0, 0, W, H);
      ng.setTransform(1, 0, 0, 1, 0, 0);
      ng.clearRect(0, 0, W, H);
      // Fern bleibt voll deckend unter dem Nahbild: beide halbtransparent ergaben Doppelbild und Helligkeitsdelle
      fern.style.opacity = 1; fern.style.visibility = t < 1 ? 'visible' : 'hidden';
      nah.style.opacity = t; nah.style.visibility = t > 0.01 ? 'visible' : 'hidden';
      if (!(Pd > 0)) return;
      const { zm, cw, ch } = proj;
      if (t < 1) {
        fg.imageSmoothingEnabled = true;
        fg.imageSmoothingQuality = 'low';
        proj.inst.forEach((o, i) => {
          const p = pl[i], c = Math.cos(p.rot) * Pd, s = Math.sin(p.rot) * Pd;
          fg.setTransform(c, s, -s, c, cx + p.x * Pd, cy + p.y * Pd);
          fg.drawImage(o.tex, (o.s.bx0 - o.s.SW / 2) * cw, (o.s.by0 - o.s.SH / 2) * ch, o.tex.width / o.tk * cw, o.tex.height / (o.tk * zm.h / zm.b) * ch);
        });
        fg.setTransform(1, 0, 0, 1, 0, 0);
      }
      if (t > 0.01) {
        const F = PROJ_F, ex = zm.b * F, ey = zm.h * F;
        ng.font = `bold ${F}px ${proj.fam}`;
        ng.fontKerning = 'none';
        ng.fillStyle = farbe;
        ng.textBaseline = 'middle';
        ng.textAlign = 'left';
        const k = proj.u * Pd / F;
        proj.inst.forEach((o, i) => {
          const p = pl[i], s = o.s;
          const co = Math.cos(p.rot) * k, si = Math.sin(p.rot) * k;
          const tx = cx + p.x * Pd, ty = cy + p.y * Pd;
          const x0 = -s.SW / 2 * ex, y0 = -s.SH / 2 * ey;
          // Bildschirmecken zurueck in Zellkoordinaten
          const det = co * co + si * si;
          let c0 = Infinity, c1 = -Infinity, r0 = Infinity, r1 = -Infinity;
          for (const [bx, by] of [[0, 0], [W, 0], [0, H], [W, H]]) {
            const dx = bx - tx, dy = by - ty;
            const lx = (co * dx + si * dy) / det - x0, ly = (-si * dx + co * dy) / det - y0;
            const col = lx / ex, row = ly / ey;
            if (col < c0) c0 = col; if (col > c1) c1 = col; if (row < r0) r0 = row; if (row > r1) r1 = row;
          }
          c0 = Math.max(0, Math.floor(c0) - 1); c1 = Math.min(s.SW - 1, Math.ceil(c1) + 1);
          r0 = Math.max(0, Math.floor(r0) - 1); r1 = Math.min(s.SH - 1, Math.ceil(r1) + 1);
          if (c0 > c1 || r0 > r1) return;
          ng.setTransform(co, si, -si, co, tx + co * x0 - si * y0, ty + si * x0 + co * y0);
          for (let y = r0; y <= r1; y++) for (let r = s.rowOff[y]; r < s.rowOff[y + 1]; r++) {
            const a = Math.max(s.rx[r], c0), b = Math.min(s.rx[r] + s.rl[r] - 1, c1);
            if (a > b) continue;
            ng.fillText(laufText(proj.cps, proj.N, o.basis + s.ri[r] + (a - s.rx[r]), b - a + 1), a * ex, (y + 0.5) * ey);
          }
        });
        ng.setTransform(1, 0, 0, 1, 0, 0);
      }
    }


    function projektNeuZeichnen() {
      if (!proj || projOffen) return;
      projOffen = true;
      requestAnimationFrame(() => { projOffen = false; projektZeichnen(); });
    }

    function projektGroesse() { projektNeuZeichnen(); }

    function projektStart() {
      stopp();
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) { if (!zeit) zeit = { modus: 'projekt', start: null, virtuell: 0, winkel: 0 }; return; }
      if (!zeit || zeit.modus !== 'projekt') zeit = { modus: 'projekt', start: null, virtuell: 0, winkel: 0 };
      const st = { id: 0, letzter: -Infinity };
      anim = st;
      const tick = now => {
        st.id = requestAnimationFrame(tick);
        if (document.hidden || now - st.letzter < SYMBOL_MS - 1) return;
        st.letzter = now;
        if (zeit.start === null) zeit.start = now;
        const elapsed = (now - zeit.start) / 1000;
        const due = Math.floor(elapsed * 60);
        if (due - zeit.virtuell > 10) zeit.virtuell = due - 10;
        const speed = faviconAutoSpeed(elapsed);
        while (zeit.virtuell < due) { zeit.winkel = (zeit.winkel + speed) % 360; zeit.virtuell++; }
        projektZeichnen();
      };
      st.id = requestAnimationFrame(tick);
    }

    function groesseSetzen() {
      if (cfg.quelle === 'projekt') return projektGroesse();
      if (!raster) return;
      const sv = sicht();
      const dpr = sv.dpr;
      const fit = Math.min(sv.w / (raster.spalten * raster.zm.b), sv.h / (raster.zeilen * raster.zm.h));
      const fs = Math.floor(fit * cfg.groesse * dpr * 8) / (8 * dpr);
      const bw = raster.spalten * raster.zm.b * fs, bh = raster.zeilen * raster.zm.h * fs;
      const t = weich(FERN_START, FERN_ENDE, fs * dpr);
      // Inhalt zuerst auffrischen, dann messen: sonst gilt die Box des alten Textes und die Ebenen sitzen verschieden (Doppelbild)
      if (t > 0 && !textAktuell) { textAktuell = true; if (neuText) neuText(); }
      else if (t === 0) textAktuell = false;
      if (t < 1 && !fernAn) { fernAn = true; if (neuFern) neuFern(); }
      else if (t === 1) fernAn = false;
      ziel.style.fontSize = fs + 'px';
      // Echte Boxgroesse messen: die Zellmasse aus 100px-Schrift weichen bei anderer Groesse um Bruchteile ab
      // (nur wenn der Text aktuell ist; sonst gilt die Rechengroesse)
      const mr = ziel.getBoundingClientRect();
      const mb = textAktuell && mr.width > 0 && mr.height > 0 ? mr : { width: bw, height: bh };
      const am = ansichtMitte(sv);
      // Zellmass aus der echten Box (nur die breiteste Zeile und die gerenderten Zeilen), Raster um seine Mitte zentrieren
      const zb = textAktuell && mb === mr ? mb.width / textMasse.b : raster.zm.b * fs, zh = textAktuell && mb === mr ? mb.height / textMasse.h : raster.zm.h * fs;
      const lx = einrasten(am.x - zb * raster.spalten / 2, dpr) + 'px', ly = einrasten(am.y - zh * raster.zeilen / 2, dpr) + 'px';
      ziel.style.left = lx; ziel.style.top = ly;
      fern.style.width = fernMass.bw / fernMass.tcw * zb + 'px'; fern.style.height = fernMass.bh / fernMass.tch * zh + 'px';
      fern.style.left = lx; fern.style.top = ly;
      ziel.style.opacity = t;
      ziel.style.visibility = t > 0 ? 'visible' : 'hidden';
      fern.style.opacity = 1;
      fern.style.visibility = t < 1 ? 'visible' : 'hidden';
    }

    let entprellt = 0;
    function neuLayouten() {
      if (zoom) sichtGeaendert();
      clearTimeout(entprellt);
      entprellt = setTimeout(() => { if (cfg.modus === 'text' && cfg.quelle !== 'projekt') aufbauen(); else groesseSetzen(); }, 150);
    }
    addEventListener('resize', neuLayouten);
    addEventListener('orientationchange', neuLayouten);
    if (window.visualViewport) { visualViewport.addEventListener('resize', neuLayouten); visualViewport.addEventListener('scroll', neuLayouten); }

    async function quelleLesen(pfad) {
      const res = await fetch(pfad, { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status + ' ' + pfad);
      return res.text();
    }

    async function laden() {
      const mein = ++lauf;
      stopp();
      zeit = null;
      proj = null;
      // Zustandswechsel atomar: alle drei Ebenen zusammen weg, bis die neue Quelle steht (sonst steht Altes neben Neuem)
      nah.style.visibility = 'hidden'; fern.style.visibility = 'hidden'; ziel.style.visibility = 'hidden';
      try {
        let t;
        if (cfg.quelle === 'projekt') {
          const t0 = performance.now();
          const res = await fetch(BUNDLE, { cache: 'no-cache' });
          if (!res.ok) throw new Error(res.status + ' ' + BUNDLE);
          const roh = await res.text();
          if (mein !== lauf) return;
          const t1 = performance.now();
          quelle = roh.replace(/\s/g, '');
          zeichen = projektIndex(quelle);
          console.info('[1c0de] Bundle geladen: ' + Math.round(t1 - t0) + ' ms, ' + zeichen.length + ' Zeichen');
          aufbauen();
          return;
        }
        if (cfg.modus === '018') {
          const roh = await quelleLesen('/0nefinity.js');
          const a = roh.indexOf('function drawFrameWithAngle(');
          const e = roh.indexOf('// Funktion zum Zuschneiden transparenter');
          if (a < 0 || e <= a) throw new Error('Symbol-Code in /0nefinity.js nicht gefunden');
          t = roh.slice(a, e);
        } else {
          t = await quelleLesen(cfg.pfad);
        }
        if (mein !== lauf) return;
        quelle = t.replace(/\s/g, '');
        zeichen = Array.from(quelle);
        astral = zeichen.length !== quelle.length;
        aufbauen();
      } catch (e) {
        if (mein !== lauf) return;
        zeichen = null;
        fehler(String(e && e.message ? e.message : e), e);
      }
    }

    function sichtbar() {
      panel.setRowVisibility('form', cfg.modus === 'text');
      const pfadSichtbar = cfg.modus === 'text' && cfg.quelle === 'seite';
      panel.setRowVisibility('pfad', pfadSichtbar);
      if (!pfadSichtbar) listeZeigen(false);
    }

    // Seitenfeld wie die Menue-Suche: window.menuSuche (meta.js) sucht unscharf in Namen und im Volltext (includes/search-index.json), die Treffer stehen als Liste unter dem Feld
    const liste = document.createElement('div');
    liste.className = 'ctrl-select-popup open ctrl-seitensuche';
    liste.style.display = 'none';
    let listeAn = false, auswahl = -1, suchLauf = 0, suchZeit = 0;
    function listeZeigen(an) { listeAn = an; liste.style.display = an ? 'flex' : 'none'; if (!an) auswahl = -1; }
    function markieren(i) {
      const alle = liste.querySelectorAll('.ctrl-select-option');
      if (!alle.length) { auswahl = -1; return; }
      auswahl = (i + alle.length) % alle.length;
      alle.forEach((b, k) => { b.classList.toggle('selected', k === auswahl); b.setAttribute('aria-selected', k === auswahl ? 'true' : 'false'); });
      alle[auswahl].scrollIntoView({ block: 'nearest' });
    }
    function seiteWaehlen(href) {
      listeZeigen(false);
      panel.set('pfad', href);
      if (href === cfg.pfad) return;
      cfg.pfad = href;
      laden();
    }
    function hinweis(text) {
      const d = document.createElement('div');
      d.className = 'ctrl-seitensuche-hinweis';
      d.textContent = text;
      return d;
    }
    async function seitenSuche(v) {
      clearTimeout(suchZeit);
      const q = v.trim();
      const lauf = ++suchLauf;
      if (!q || q === cfg.pfad) { listeZeigen(false); return; }
      suchZeit = setTimeout(async () => {
        liste.replaceChildren();
        let r;
        try {
          if (!window.menuSuche) throw new Error('Menue-Suche (meta.js) nicht geladen');
          r = await window.menuSuche.suchen(q);
        } catch (e) {
          console.error('[1c0de] Seitensuche', e);
          if (lauf !== suchLauf) return;
          liste.replaceChildren(hinweis('Suche nicht verfügbar'));
          listeZeigen(true);
          return;
        }
        if (lauf !== suchLauf) return;
        const teile = [];
        for (const t of r.treffer) {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'ctrl-select-option';
          b.setAttribute('role', 'option');
          b.dataset.href = t.href;
          const l = document.createElement('span');
          t.fuellen(l);
          b.append(l);
          const z = document.createElement('span');
          z.className = 'ctrl-seitensuche-zeile';
          if (t.ausschnitt) t.ausschnitt(z); else z.textContent = t.dir;
          if (z.textContent) b.append(z);
          b.addEventListener('click', e => { e.stopPropagation(); seiteWaehlen(t.href); });
          teile.push(b);
        }
        if (r.mehr) teile.push(hinweis('+' + r.mehr + ' weitere'));
        if (r.fehler) teile.push(hinweis('Volltext nicht verfügbar'));
        if (!r.treffer.length && r.fertig) teile.push(hinweis('nichts gefunden'));
        liste.replaceChildren(...teile);
        listeZeigen(teile.length > 0);
        markieren(0);
        setTimeout(() => {
          const kb = panel.bodyEl, k = kb.getBoundingClientRect(), l = liste.getBoundingClientRect();
          const unten = Math.min(k.bottom, innerHeight);
          if (l.bottom > unten) kb.scrollTop += Math.min(l.bottom - unten, l.top - k.top);
        }, 350);
      }, 80);
    }

    let zoomInnen = false;
    let zoom = null;
    let panel = null;
    panel = Controls.createPanel({ position: 'left' });
    panel
      .addSelect('modus', { label: 'Form', value: cfg.modus,
        options: [{ value: 'text', label: 'Text' }, { value: '018', label: '018' }],
        onChange: v => {
          cfg.modus = v;
          if (v === 'text' && cfg.quelle === 'projekt') { cfg.quelle = 'seite'; panel.set('quelle', 'seite'); }
          sichtbar(); laden();
        } })
      .addSelect('quelle', { label: 'Quelle', value: cfg.quelle,
        options: [{ value: 'seite', label: 'Diese Seite' }, { value: 'projekt', label: 'Ganzes Projekt' }],
        onChange: v => {
          cfg.quelle = v;
          if (v === 'projekt' && cfg.modus !== '018') { cfg.modus = '018'; panel.set('modus', '018'); }
          sichtbar(); laden();
        } })
      .addInput('form', { label: 'Text', value: cfg.form, onChange: v => { cfg.form = v; aufbauen(); } })
      .addInput('pfad', { label: 'Seite', value: cfg.pfad, onChange: v => seitenSuche(v) })
      .addSlider('groesse', { label: 'Größe', min: 0, max: 4, step: 0.05, value: cfg.groesse, decimals: 2, grow: true,
        onChange: v => { if (zoomInnen) return; cfg.groesse = v; mitteHalten(v); } });

    const pfadZeile = panel.bodyEl.querySelector('[data-key="pfad"]');
    pfadZeile.after(liste);
    pfadZeile.querySelector('.ctrl-input').addEventListener('keydown', e => {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { if (listeAn) { e.preventDefault(); markieren(auswahl + (e.key === 'ArrowDown' ? 1 : -1)); } }
      else if (e.key === 'Enter') {
        e.preventDefault();
        const b = listeAn ? liste.querySelectorAll('.ctrl-select-option')[auswahl] : null;
        if (b) seiteWaehlen(b.dataset.href);
        else if (e.target.value.trim().startsWith('/')) seiteWaehlen(e.target.value.trim());
      } else if (e.key === 'Escape') { panel.set('pfad', cfg.pfad); listeZeigen(false); clearTimeout(suchZeit); suchLauf++; }
    });

    // Zoom um die Bildmitte, die Welt dort bleibt stehen (Schieberegler, Reset)
    function mitteHalten(v) {
      const sv = sicht(), st = zoom.getState();
      const wx = (sv.w / 2 - st.offsetX) / st.scale, wy = (sv.h / 2 - st.offsetY) / st.scale;
      zoom.setView({ scale: v, offsetX: sv.w / 2 - wx * v, offsetY: sv.h / 2 - wy * v }, false);
    }
    // Groessenaenderung des Fensters: Abstand der Bildmitte zur Bildschirmmitte bleibt
    let sichtAlt = sicht();
    function sichtGeaendert() {
      const sv = sicht(), st = zoom.getState();
      const dx = st.offsetX + (st.scale - 1) * sichtAlt.w / 2, dy = st.offsetY + (st.scale - 1) * sichtAlt.h / 2;
      sichtAlt = sv;
      zoom.setView({ scale: st.scale, offsetX: dx - (st.scale - 1) * sv.w / 2, offsetY: dy - (st.scale - 1) * sv.h / 2 }, false);
    }

    // Schwenk und Zoom wie in bibelaufdenpunkt.html: Rad 3 % je Schritt, Zoom unter Zeiger/Pinch-Mitte, Ziehen mit Maus und Finger, nach dem Pinch zieht der verbliebene Finger weiter. Das Panel bleibt aussen vor.
    const imPanel = e => !!(e.target.closest && e.target.closest('[class*="ctrl-"]'));
    const sv0 = sicht();
    zoom = Zoom2D.createZoom2D({
      container: document.body,
      minScale: 0,
      wheelSpeed: 0.03,
      shouldIgnoreWheel: imPanel,
      initialScale: panel.params.groesse,
      initialOffsetX: (1 - panel.params.groesse) * sv0.w / 2,
      initialOffsetY: (1 - panel.params.groesse) * sv0.h / 2,
      shouldIgnoreDrag: imPanel,
      shouldIgnoreTouchDrag: imPanel,
      onTransform: st => {
        ansicht.scale = st.scale; ansicht.ox = st.offsetX; ansicht.oy = st.offsetY;
        if (st.scale !== cfg.groesse) {
          cfg.groesse = st.scale;
          zoomInnen = true;
          try { panel.set('groesse', Number(st.scale.toFixed(2))); } finally { zoomInnen = false; }
        }
        if (cfg.quelle === 'projekt') projektNeuZeichnen(); else groesseSetzen();
      }
    });
    for (const ev of ['wheel', 'touchstart', 'touchmove']) panel.el.addEventListener(ev, e => e.stopPropagation(), { passive: true });

    cfg.modus = panel.params.modus;
    cfg.quelle = panel.params.quelle;
    if (cfg.quelle === 'projekt' && cfg.modus !== '018') { cfg.modus = '018'; panel.set('modus', '018'); }
    cfg.form = panel.params.form;
    cfg.pfad = panel.params.pfad;
    cfg.groesse = panel.params.groesse;
    sichtbar();
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(laden);
  })();
  </script>

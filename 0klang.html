<!DOCTYPE html>
<html lang="de">
<head>
  <!--#include virtual="/includes/something-in-the-head.html" -->
  <script src="/tools/math-notation.js" defer></script>
<meta charset="UTF-8">
<title>0klang</title>
<style>
#klang {
  display: flex;
  flex-direction: column;
  white-space: normal;
  touch-action: none;
}
#klang * { white-space: normal; text-shadow: none; }

#spektrum {
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  display: block;
  cursor: crosshair;
}

#akkorde {
  flex: 0 0 auto;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.75rem 0.5rem;
}
.pad {
  font-family: var(--font-family);
  font-size: 0.85rem;
  line-height: 1;
  min-width: 3.4rem;
  padding: 0.7rem 0.9rem;
  border: 1px solid color-mix(in srgb, var(--text-color) 30%, transparent);
  border-radius: 9999px;
  color: color-mix(in srgb, var(--text-color) 75%, transparent);
  text-align: center;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
.pad.an {
  background: var(--text-color);
  border-color: var(--text-color);
  color: var(--bg-color);
}

#tasten {
  flex: 0 0 auto;
  position: relative;
  height: clamp(7.5rem, 26vh, 13rem);
  display: flex;
}
.wt {
  flex: 1 1 0;
  position: relative;
  border: 1px solid color-mix(in srgb, var(--text-color) 28%, transparent);
  border-left-width: 0;
  border-radius: 0 0 6px 6px;
  background: color-mix(in srgb, var(--text-color) 4%, transparent);
  cursor: pointer;
}
.wt:first-child { border-left-width: 1px; }
.wt span {
  position: absolute;
  left: 0; right: 0; bottom: 0.6rem;
  text-align: center;
  font-family: var(--font-family);
  font-size: 0.7rem;
  line-height: 1;
  color: color-mix(in srgb, var(--text-color) 45%, transparent);
  pointer-events: none;
}
.st {
  position: absolute;
  top: 0;
  height: 60%;
  transform: translateX(-50%);
  background: color-mix(in srgb, var(--text-color) 26%, var(--bg-color));
  border-radius: 0 0 5px 5px;
  cursor: pointer;
  z-index: 1;
}
.wt.an, .st.an { background: var(--text-color); border-color: var(--text-color); }
.wt.an span { color: var(--bg-color); }
</style>
</head>
<body>

<div id="klang" class="_018-canvas">
  <canvas id="spektrum"></canvas>
  <div id="akkorde"></div>
  <div id="tasten"></div>
</div>

<script>
(() => {
'use strict';

// Noise sounds all the time. Holding a note does not add a tone: it pulls
// everything except that note's bands down. Per band the dry share (r) and the
// band path (1 - r) add up to 1 at the band centre, so the note keeps its level
// while the rest falls by "Tiefe".

const NAMEN = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const IST_WEISS = [1,0,1,0,1,1,0,1,0,1,0,1];
const LOW = 60;
const BEREICHE = [84, 79, 72];          // C6, G5, C5 as highest key
const MIN_TASTE_PX = 30;

const AKKORDE = [
  { name: 'C',     root: 60, iv: [0, 4, 7] },
  { name: 'Dm',    root: 62, iv: [0, 3, 7] },
  { name: 'Em',    root: 64, iv: [0, 3, 7] },
  { name: 'F',     root: 65, iv: [0, 4, 7] },
  { name: 'G',     root: 67, iv: [0, 4, 7] },
  { name: 'Am',    root: 69, iv: [0, 3, 7] },
  { name: 'G7',    root: 67, iv: [0, 4, 7, 10] },
  { name: 'Cmaj7', root: 60, iv: [0, 4, 7, 11] },
];

const cfg = {
  quelle: 'rosa', pegel: 0.55,
  tiefe: 30, breite: 40, ein: 0.08, aus: 0.4,
  oberMenge: 0.5, oberAnzahl: 2,
  halten: false, raster: false, a4: 440,
};

const tonFreq = semi => cfg.a4 * Math.pow(2, (semi - 69) / 12);
const restPegel = () => Math.pow(10, -Math.max(0, cfg.tiefe) / 20);

// -3 dB width of two cascaded identical bandpass stages is 0.6436 x the width of one stage
function stufenQ(){
  const c = Math.max(0, cfg.breite);
  const spanne = Math.pow(2, c / 2400) - Math.pow(2, -c / 2400);
  return spanne > 0 ? Math.min(3000, 0.6436 / spanne) : 3000;
}

// ---------- audio ----------
let ac = null, quellBus, trocken, mix, master;
let rauschGain = {}, micGain, micStream = null;
let anaSrc, anaOut, bufSrc, bufOut;
const aktive = new Set();               // voices that are held (not fading out)

function gleite(param, ziel, sek){
  const t = ac.currentTime;
  param.cancelScheduledValues(t);
  param.setValueAtTime(param.value, t);
  if (sek > 0) param.setTargetAtTime(ziel, t, sek / 3);
  else param.setValueAtTime(ziel, t);
}

function rauschPuffer(rosa){
  const sr = ac.sampleRate, n = sr * 6, f = 2048;
  const x = new Float32Array(n + f);
  let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
  for (let i = 0; i < n + f; i++){
    const w = Math.random() * 2 - 1;
    if (!rosa){ x[i] = w; continue; }
    b0 = 0.99886 * b0 + w * 0.0555179;
    b1 = 0.99332 * b1 + w * 0.0750759;
    b2 = 0.96900 * b2 + w * 0.1538520;
    b3 = 0.86650 * b3 + w * 0.3104856;
    b4 = 0.55000 * b4 + w * 0.5329522;
    b5 = -0.7616 * b5 - w * 0.0168980;
    x[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362;
    b6 = w * 0.115926;
  }
  // crossfade the tail into the head so the loop has no seam
  for (let i = 0; i < f; i++) x[i] = x[i] * (i / f) + x[n + i] * (1 - i / f);
  let s = 0;
  for (let i = 0; i < n; i++) s += x[i] * x[i];
  const k = 0.2 / Math.sqrt(s / n);
  const buf = ac.createBuffer(1, n, sr);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = x[i] * k;
  return buf;
}

function startAudio(){
  if (ac) { if (ac.state === 'suspended' && !document.hidden) ac.resume(); return; }
  ac = new (window.AudioContext || window.webkitAudioContext)();

  quellBus = ac.createGain();
  trocken = ac.createGain();
  mix = ac.createGain();
  master = ac.createGain(); master.gain.value = cfg.pegel;
  const limiter = ac.createDynamicsCompressor();
  limiter.threshold.value = -6; limiter.knee.value = 6; limiter.ratio.value = 12;
  limiter.attack.value = 0.003; limiter.release.value = 0.2;
  quellBus.connect(trocken); trocken.connect(mix);
  mix.connect(master); master.connect(limiter); limiter.connect(ac.destination);

  anaSrc = ac.createAnalyser(); anaOut = ac.createAnalyser();
  // 16384 points: about five bins per semitone at C4, so narrow bands read as narrow peaks
  for (const a of [anaSrc, anaOut]) { a.fftSize = 16384; a.smoothingTimeConstant = 0.7; }
  quellBus.connect(anaSrc);
  mix.connect(anaOut);
  bufSrc = new Float32Array(anaSrc.frequencyBinCount);
  bufOut = new Float32Array(anaOut.frequencyBinCount);

  for (const art of ['rosa', 'weiss']){
    const src = ac.createBufferSource();
    src.buffer = rauschPuffer(art === 'rosa'); src.loop = true;
    const g = ac.createGain(); g.gain.value = cfg.quelle === art ? 1 : 0;
    src.connect(g); g.connect(quellBus); src.start();
    rauschGain[art] = g;
  }
  micGain = ac.createGain(); micGain.gain.value = 0;
  micGain.connect(quellBus);

  spaltenRechnen();
  requestAnimationFrame(zeichnen);
}

function oberGewicht(k){ return k === 1 ? 1 : Math.pow(Math.max(0, cfg.oberMenge), k - 1); }

function teiltoeneBauen(v){
  for (const p of v.partials){ quellBus.disconnect(p.bp); p.bp.disconnect(); p.bp2.disconnect(); p.pg.disconnect(); }
  v.partials = [];
  const q = stufenQ(), f = tonFreq(v.semi);
  const anzahl = 1 + Math.max(0, Math.round(cfg.oberAnzahl));
  for (let k = 1; k <= anzahl; k++){
    if (f * k >= ac.sampleRate * 0.48) break;
    const bp = ac.createBiquadFilter(), bp2 = ac.createBiquadFilter();
    bp.type = bp2.type = 'bandpass';
    bp.frequency.value = bp2.frequency.value = Math.max(1, f * k);
    bp.Q.value = bp2.Q.value = q;
    const pg = ac.createGain(); pg.gain.value = oberGewicht(k);
    quellBus.connect(bp); bp.connect(bp2); bp2.connect(pg); pg.connect(v.gain);
    v.partials.push({ bp, bp2, pg, k });
  }
}

function stimmeAn(semi){
  const v = { semi, gain: ac.createGain(), partials: [] };
  v.gain.gain.value = 0;
  v.gain.connect(mix);
  teiltoeneBauen(v);
  aktive.add(v);
  const r = restPegel();
  gleite(v.gain.gain, 1 - r, cfg.ein);
  gleite(trocken.gain, r, cfg.ein);
  return v;
}

function stimmeAus(v){
  if (!aktive.delete(v)) return;
  gleite(v.gain.gain, 0, cfg.aus);
  if (!aktive.size) gleite(trocken.gain, 1, cfg.aus);
  setTimeout(() => {
    v.gain.disconnect();
    for (const p of v.partials){ quellBus.disconnect(p.bp); p.bp.disconnect(); p.bp2.disconnect(); p.pg.disconnect(); }
  }, (Math.max(0, cfg.aus) * 2.5 + 0.1) * 1000);
}

function stimmeTon(v, semi){
  v.semi = semi;
  const f = tonFreq(semi), t = ac.currentTime;
  for (const p of v.partials){
    const z = Math.min(ac.sampleRate * 0.49, Math.max(1, f * p.k));
    p.bp.frequency.setTargetAtTime(z, t, 0.008);
    p.bp2.frequency.setTargetAtTime(z, t, 0.008);
  }
}

function tiefeNachstellen(){
  if (!ac || !aktive.size) return;
  const r = restPegel();
  gleite(trocken.gain, r, 0.03);
  aktive.forEach(v => gleite(v.gain.gain, 1 - r, 0.03));
}
function filterNachstellen(){
  if (!ac) return;
  const q = stufenQ(), t = ac.currentTime;
  aktive.forEach(v => v.partials.forEach(p => {
    p.bp.Q.setTargetAtTime(q, t, 0.02);
    p.bp2.Q.setTargetAtTime(q, t, 0.02);
    p.pg.gain.setTargetAtTime(oberGewicht(p.k), t, 0.02);
  }));
}
function teiltoeneNeu(){ if (ac) aktive.forEach(teiltoeneBauen); }
function stimmungNachstellen(){
  if (!ac) return;
  aktive.forEach(v => stimmeTon(v, v.semi));
  spaltenRechnen();
}

async function quelleSetzen(art){
  const vorher = cfg.quelle;
  cfg.quelle = art;
  if (!ac) startAudio();
  if (art === 'mikro' && !micStream){
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio:
        { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    } catch (err) {
      console.error('0klang: Mikrofon nicht verfuegbar', err);
      cfg.quelle = vorher === 'mikro' ? 'rosa' : vorher;
      panel.set('quelle', cfg.quelle);
      return;
    }
    ac.createMediaStreamSource(micStream).connect(micGain);
  }
  const t = ac.currentTime;
  micGain.gain.setTargetAtTime(cfg.quelle === 'mikro' ? 1 : 0, t, 0.02);
  for (const k in rauschGain) rauschGain[k].gain.setTargetAtTime(cfg.quelle === k ? 1 : 0, t, 0.02);
}

// ---------- notes from keys and pads ----------
const tonStimmen = new Map();           // midi -> voice
const zaehler = new Map();              // midi -> how many holders press it

function noteOn(midi){
  const n = (zaehler.get(midi) || 0) + 1;
  zaehler.set(midi, n);
  if (n === 1){ tonStimmen.set(midi, stimmeAn(midi)); tasteZeigen(midi, true); }
}
function noteOff(midi){
  const n = (zaehler.get(midi) || 0) - 1;
  if (n > 0){ zaehler.set(midi, n); return; }
  zaehler.delete(midi);
  const v = tonStimmen.get(midi);
  tonStimmen.delete(midi);
  if (v) stimmeAus(v);
  tasteZeigen(midi, false);
}

// ---------- layout: keys, pads ----------
const stage = document.getElementById('klang');
const tastenEl = document.getElementById('tasten');
const akkordeEl = document.getElementById('akkorde');
let HIGH = 84, mitten = [], weissAnzahl = 0;

function tastenBauen(){
  const breite = tastenEl.clientWidth || stage.clientWidth || innerWidth;
  let high = BEREICHE[BEREICHE.length - 1];
  for (const h of BEREICHE){
    let w = 0; for (let m = LOW; m <= h; m++) w += IST_WEISS[m % 12];
    if (breite / w >= MIN_TASTE_PX){ high = h; break; }
  }
  if (high === HIGH && tastenEl.childElementCount) return;
  HIGH = high;
  tastenEl.textContent = '';
  mitten = [];
  let wi = 0;
  const schwarze = [];
  for (let m = LOW; m <= HIGH; m++){
    if (IST_WEISS[m % 12]){
      const k = document.createElement('div');
      k.className = 'wt'; k.dataset.midi = m;
      const l = document.createElement('span');
      l.textContent = m % 12 === 0 ? NAMEN[0] + (Math.floor(m / 12) - 1) : NAMEN[m % 12];
      k.appendChild(l);
      tastenEl.appendChild(k);
      mitten.push(wi + 0.5);
      wi++;
    } else {
      schwarze.push([m, wi]);
      mitten.push(wi);
    }
  }
  weissAnzahl = wi;
  for (const [m, slot] of schwarze){
    const b = document.createElement('div');
    b.className = 'st'; b.dataset.midi = m;
    b.style.left = (slot / weissAnzahl * 100) + '%';
    b.style.width = (0.6 / weissAnzahl * 100) + '%';
    tastenEl.appendChild(b);
  }
  zaehler.forEach((_, m) => tasteZeigen(m, true));
  spaltenRechnen();
}

function tasteZeigen(midi, an){
  const el = tastenEl.querySelector('[data-midi="' + midi + '"]');
  if (el) el.classList.toggle('an', an);
}

AKKORDE.forEach((c, i) => {
  const p = document.createElement('div');
  p.className = 'pad'; p.dataset.akkord = i;
  p.textContent = c.name;
  akkordeEl.appendChild(p);
});

// ---------- key axis <-> semitone ----------
function semitonAusX(xw){
  const n = mitten.length, last = n - 1;
  if (xw <= mitten[0]) return (xw - mitten[0]) * 12 / 7;
  if (xw >= mitten[last]) return last + (xw - mitten[last]) * 12 / 7;
  let i = 0;
  while (mitten[i + 1] < xw) i++;
  return i + (xw - mitten[i]) / (mitten[i + 1] - mitten[i]);
}
function xwAusSemiton(s){
  const last = mitten.length - 1;
  if (s <= 0) return mitten[0] + s * 7 / 12;
  if (s >= last) return mitten[last] + (s - last) * 7 / 12;
  const i = Math.floor(s);
  return mitten[i] + (s - i) * (mitten[i + 1] - mitten[i]);
}

// ---------- input: pointer (multi-touch, glide, latch) ----------
const halter = new Map();               // pointer id -> holder
const tastenHalter = new Map();         // key code -> holder
const gerastet = new Map();             // latched keys/pads: 'n'+midi | 'a'+index -> holder
const freie = new Set();                // free voices on the spectrum: { v, latched }

function greifen(ziel){
  if (ziel.dataset.akkord != null){
    const c = AKKORDE[+ziel.dataset.akkord];
    const notes = c.iv.map(iv => c.root + iv);
    notes.forEach(noteOn);
    ziel.classList.add('an');
    return { art: 'akkord', el: ziel, notes };
  }
  const midi = +ziel.dataset.midi;
  noteOn(midi);
  return { art: 'note', midi };
}
function loslassen(h){
  if (h.art === 'akkord'){ h.notes.forEach(noteOff); h.el.classList.remove('an'); }
  else if (h.art === 'note') noteOff(h.midi);
}
function rastSchluessel(ziel){
  return ziel.dataset.akkord != null ? 'a' + ziel.dataset.akkord : 'n' + ziel.dataset.midi;
}

function momentanLos(){
  tastenHalter.forEach(m => noteOff(m));
  tastenHalter.clear();
  halter.forEach(h => { if (h.art === 'frei') freiLos(h); else loslassen(h); });
  halter.clear();
}
function alleLos(){
  momentanLos();
  gerastet.forEach(loslassen);
  gerastet.clear();
  freie.forEach(f => stimmeAus(f.v));
  freie.clear();
}

const ZIELE = '[data-midi],[data-akkord]';
const cvs = document.getElementById('spektrum');

function semitonAmFinger(e){
  const r = cvs.getBoundingClientRect();
  const s = LOW + semitonAusX((e.clientX - r.left) / Math.max(1, r.width) * weissAnzahl);
  return cfg.raster ? Math.round(s) : s;
}
function xAmTon(semi){ return xwAusSemiton(semi - LOW) / weissAnzahl * cvs.clientWidth; }

function freiGreifen(e){
  const r = cvs.getBoundingClientRect();
  const x = e.clientX - r.left;
  if (cfg.halten){
    let nah = null, best = 16;
    freie.forEach(f => { const d = Math.abs(xAmTon(f.v.semi) - x); if (f.latched && d < best){ best = d; nah = f; } });
    if (nah){ nah.latched = false; return { art: 'frei', f: nah, x0: e.clientX, alt: true, bewegt: false }; }
  }
  const f = { v: stimmeAn(semitonAmFinger(e)), latched: false };
  freie.add(f);
  return { art: 'frei', f, x0: e.clientX, alt: false, bewegt: false };
}
function freiLos(h){
  if (cfg.halten && !(h.alt && !h.bewegt)){ h.f.latched = true; return; }
  freie.delete(h.f);
  stimmeAus(h.f.v);
}

stage.addEventListener('pointerdown', e => {
  if (e.target === cvs){
    e.preventDefault();
    startAudio();
    if (!weissAnzahl) return;
    cvs.setPointerCapture(e.pointerId);
    halter.set(e.pointerId, freiGreifen(e));
    return;
  }
  const ziel = e.target.closest(ZIELE);
  if (!ziel) return;
  e.preventDefault();
  startAudio();
  if (cfg.halten){
    const k = rastSchluessel(ziel);
    if (gerastet.has(k)){ loslassen(gerastet.get(k)); gerastet.delete(k); }
    else gerastet.set(k, greifen(ziel));
    return;
  }
  if (halter.has(e.pointerId)) loslassen(halter.get(e.pointerId));
  halter.set(e.pointerId, greifen(ziel));
});

stage.addEventListener('pointermove', e => {
  const h = halter.get(e.pointerId);
  if (!h) return;
  if (h.art === 'frei'){
    if (Math.abs(e.clientX - h.x0) > 4) h.bewegt = true;
    if (h.bewegt || !h.alt) stimmeTon(h.f.v, semitonAmFinger(e));
    return;
  }
  if (h.art !== 'note') return;
  const unter = document.elementFromPoint(e.clientX, e.clientY);
  const ziel = unter && unter.closest('[data-midi]');
  if (!ziel || +ziel.dataset.midi === h.midi) return;
  noteOff(h.midi);
  h.midi = +ziel.dataset.midi;
  noteOn(h.midi);
});

function pointerEnde(e){
  const h = halter.get(e.pointerId);
  if (!h) return;
  halter.delete(e.pointerId);
  if (h.art === 'frei') freiLos(h); else loslassen(h);
}
addEventListener('pointerup', pointerEnde);
addEventListener('pointercancel', pointerEnde);
stage.addEventListener('contextmenu', e => { if (e.target === cvs || e.target.closest(ZIELE)) e.preventDefault(); });

// iOS only unlocks audio on certain gesture types; resume on any of them
addEventListener('touchend', () => { if (ac && ac.state === 'suspended' && !document.hidden) ac.resume(); }, { passive: true });

// ---------- input: computer keyboard ----------
const QWERTZ = { KeyA:60, KeyW:61, KeyS:62, KeyE:63, KeyD:64, KeyF:65, KeyT:66,
                 KeyG:67, KeyY:68, KeyZ:68, KeyH:69, KeyU:70, KeyJ:71, KeyK:72 };

function tippenErlaubt(e){
  if (e.ctrlKey || e.metaKey || e.altKey) return false;
  if (document.body.classList.contains('menu-open') || document.body.classList.contains('meta-dialog-open')) return false;
  const t = e.target;
  return !(t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)));
}
addEventListener('keydown', e => {
  const m = QWERTZ[e.code];
  if (m == null || e.repeat || !tippenErlaubt(e) || tastenHalter.has(e.code)) return;
  startAudio();
  if (cfg.halten){
    const k = 'n' + m;
    if (gerastet.has(k)){ loslassen(gerastet.get(k)); gerastet.delete(k); }
    else { noteOn(m); gerastet.set(k, { art: 'note', midi: m }); }
    return;
  }
  noteOn(m);
  tastenHalter.set(e.code, m);
});
addEventListener('keyup', e => {
  const m = tastenHalter.get(e.code);
  if (m == null) return;
  tastenHalter.delete(e.code);
  noteOff(m);
});
addEventListener('blur', momentanLos);
document.addEventListener('visibilitychange', () => {
  if (!ac) return;
  if (document.hidden){ momentanLos(); ac.suspend(); }
  else ac.resume();
});

// ---------- settings panel ----------
const panel = Controls.createPanel({ position: 'left', mobileInitialOpenMode: 'peek' });
panel
  .addSelect('quelle', { label: 'Quelle', value: cfg.quelle,
      options: [{ value: 'rosa', label: 'rosa' }, { value: 'weiss', label: 'weiß' }, { value: 'mikro', label: 'Mikro' }],
      onChange: v => quelleSetzen(v) })
  .addSlider('pegel', { label: 'Pegel', min: 0, max: 1, step: 0.01, value: cfg.pegel, decimals: 2, onChange: v => {
      cfg.pegel = v; if (ac) master.gain.setTargetAtTime(Math.max(0, v), ac.currentTime, 0.02); } })
  .addDivider()
  .addSlider('tiefe',  { label: 'Tiefe dB',     min: 0, max: 60,  step: 0.5,  value: cfg.tiefe,  decimals: 1, onChange: v => { cfg.tiefe = v; tiefeNachstellen(); } })
  .addSlider('breite', { label: 'Breite ct',    min: 0, max: 200, step: 1,    value: cfg.breite, decimals: 0, onChange: v => { cfg.breite = v; filterNachstellen(); } })
  .addSlider('ein',    { label: 'Einblenden s', min: 0, max: 4,   step: 0.01, value: cfg.ein,    decimals: 2, onChange: v => { cfg.ein = v; } })
  .addSlider('aus',    { label: 'Ausblenden s', min: 0, max: 8,   step: 0.01, value: cfg.aus,    decimals: 2, onChange: v => { cfg.aus = v; } })
  .addDivider()
  .addSlider('oberMenge',  { label: 'Obertöne', min: 0, max: 1, step: 0.01, value: cfg.oberMenge,  decimals: 2, onChange: v => { cfg.oberMenge = v; filterNachstellen(); } })
  .addSlider('oberAnzahl', { label: 'Anzahl',   min: 0, max: 12, step: 1,   value: cfg.oberAnzahl, decimals: 0, onChange: v => { cfg.oberAnzahl = v; teiltoeneNeu(); } })
  .addDivider()
  .addToggle('halten', { label: 'Halten', value: cfg.halten, onChange: v => {
      cfg.halten = v;
      if (!v){ gerastet.forEach(loslassen); gerastet.clear(); freie.forEach(f => { if (f.latched){ freie.delete(f); stimmeAus(f.v); } }); } } })
  .addToggle('raster', { label: 'Raster', value: cfg.raster, onChange: v => { cfg.raster = v; } })
  .addButton('los', { label: 'alle los', onClick: alleLos })
  .addDivider()
  .addSlider('a4', { label: 'Stimmung A4', min: 415, max: 466, step: 0.1, value: cfg.a4, decimals: 1, onChange: v => { cfg.a4 = v; stimmungNachstellen(); } })
;
panel.el.addEventListener('pointerdown', () => startAudio());

function raumFuerPanel(){
  const r = panel.el.getBoundingClientRect();
  if (innerWidth <= 768){
    stage.style.paddingLeft = '';
    stage.style.height = Math.max(0, r.top - stage.getBoundingClientRect().top) + 'px';
  } else {
    stage.style.height = '';
    const unten = tastenEl.getBoundingClientRect().top - 1;
    const frei = innerWidth - r.right;
    stage.style.paddingLeft = (r.bottom > unten && r.left < 1 && frei >= 480) ? r.right + 'px' : '';
  }
}

// ---------- spectrum: one display, what you hear ----------
const ctx = cvs.getContext('2d');
let W = 0, H = 0, dpr = 1, spalten = 0;
let sVon = null, sBis = null, sPos = null, sKipp = null, pegelOut = null, pegelSrc = null;
const SPALTE_PX = 2;
const BAND = 0.78;                      // the noise floor sits at this height
const UNTER = 66;                       // dB shown below it
let ref = null, bild = 0;

function spaltenRechnen(){
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = Math.max(1, Math.round(cvs.clientWidth * dpr));
  H = Math.max(1, Math.round(cvs.clientHeight * dpr));
  cvs.width = W; cvs.height = H;
  spalten = Math.ceil(W / SPALTE_PX);
  if (!ac || !weissAnzahl) { sVon = null; zeichnenStill(); return; }
  const binHz = ac.sampleRate / anaOut.fftSize;
  const maxBin = anaOut.frequencyBinCount - 2;
  const fAus = px => tonFreq(LOW + semitonAusX(px / W * weissAnzahl));
  sVon = new Int32Array(spalten); sBis = new Int32Array(spalten);
  sPos = new Float32Array(spalten); sKipp = new Float32Array(spalten);
  pegelOut = new Float32Array(spalten); pegelSrc = new Float32Array(spalten);
  for (let c = 0; c < spalten; c++){
    const a = Math.max(0, fAus(c * SPALTE_PX) / binHz);
    const b = Math.max(0, fAus((c + 1) * SPALTE_PX) / binHz);
    const m = Math.max(1, fAus((c + 0.5) * SPALTE_PX));
    if (b - a < 1){
      sPos[c] = Math.min(maxBin, m / binHz);
      sVon[c] = -1;
    } else {
      sVon[c] = Math.min(maxBin, Math.round(a));
      sBis[c] = Math.min(maxBin, Math.max(sVon[c], Math.round(b) - 1));
    }
    // +3 dB per octave: pink noise reads flat across the keys
    sKipp[c] = 10 * Math.log10(m / 1000);
  }
}

function pegelLesen(buf, ziel){
  for (let c = 0; c < spalten; c++){
    let v;
    if (sVon[c] < 0){
      const p = sPos[c], i = p | 0, fr = p - i;
      v = Math.max(buf[i], -200) * (1 - fr) + Math.max(buf[i + 1], -200) * fr;
    } else {
      let s = 0;
      for (let b = sVon[c]; b <= sBis[c]; b++) s += Math.pow(10, Math.max(buf[b], -200) / 10);
      v = 10 * Math.log10(s / (sBis[c] - sVon[c] + 1));
    }
    ziel[c] = v + sKipp[c];
  }
}

function farbe(){
  return getComputedStyle(document.documentElement).getPropertyValue('--text-color').trim();
}

function zeichnenStill(){
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = ctx.strokeStyle = farbe();
  ctx.globalAlpha = 0.16;
  ctx.fillRect(0, H * (1 - BAND), W, H * BAND);
  ctx.globalAlpha = 0.8;
  ctx.lineWidth = 1.5 * dpr;
  ctx.beginPath(); ctx.moveTo(0, H * (1 - BAND)); ctx.lineTo(W, H * (1 - BAND)); ctx.stroke();
  ctx.globalAlpha = 1;
}

function zeichnen(){
  requestAnimationFrame(zeichnen);
  if (!sVon) return;
  if (ac.state !== 'running') return;

  if (bild++ % 6 === 0 || ref == null){
    anaSrc.getFloatFrequencyData(bufSrc);
    pegelLesen(bufSrc, pegelSrc);
    let s = 0; for (let c = 0; c < spalten; c++) s += pegelSrc[c];
    const mittel = s / spalten;
    ref = ref == null ? mittel : ref * 0.85 + mittel * 0.15;
  }
  anaOut.getFloatFrequencyData(bufOut);
  pegelLesen(bufOut, pegelOut);

  const r = Math.max(ref, -150);
  const unten = r - UNTER, spanne = UNTER / BAND;
  const y = v => H - Math.min(1, Math.max(0, (v - unten) / spanne)) * H;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = ctx.strokeStyle = farbe();
  ctx.beginPath();
  ctx.moveTo(0, y(pegelOut[0]));
  for (let c = 0; c < spalten; c++) ctx.lineTo((c + 0.5) * SPALTE_PX, y(pegelOut[c]));
  ctx.lineTo(W, y(pegelOut[spalten - 1]));
  ctx.lineWidth = 1.5 * dpr;
  ctx.lineJoin = 'round';
  ctx.globalAlpha = 0.9;
  ctx.stroke();
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
  ctx.globalAlpha = 0.16;
  ctx.fill();

  if (freie.size){
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = dpr;
    ctx.beginPath();
    freie.forEach(f => { const x = Math.round(xAmTon(f.v.semi) * dpr) + 0.5; ctx.moveTo(x, 0); ctx.lineTo(x, H); });
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// ---------- boot ----------
function layout(){ raumFuerPanel(); tastenBauen(); spaltenRechnen(); }
addEventListener('resize', layout);
stage.addEventListener('ctrl-panel-layout-change', layout);
document.addEventListener('ctrl-panel-layout-change', layout);
requestAnimationFrame(layout);

})();
</script>

<!DOCTYPE html>
<html lang="de">
<head>
  <!--#include virtual="/includes/something-in-the-head.html" -->
<meta charset="UTF-8">
<title>0klang</title>
<style>
#klang {
  display: flex;
  flex-direction: column;
  white-space: normal;
  touch-action: none;
}
#klang * { white-space: normal; text-shadow: none; }

#spektrum {
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  display: block;
}

#akkorde {
  flex: 0 0 auto;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.75rem 0.5rem;
}
.pad {
  font-family: var(--font-family);
  font-size: 0.85rem;
  line-height: 1;
  min-width: 3.4rem;
  padding: 0.7rem 0.9rem;
  border: 1px solid color-mix(in srgb, var(--text-color) 30%, transparent);
  border-radius: 9999px;
  color: color-mix(in srgb, var(--text-color) 75%, transparent);
  text-align: center;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
.pad.an {
  background: var(--text-color);
  border-color: var(--text-color);
  color: var(--bg-color);
}

#tasten {
  flex: 0 0 auto;
  position: relative;
  height: clamp(7.5rem, 26vh, 13rem);
  display: flex;
}
.wt {
  flex: 1 1 0;
  position: relative;
  border: 1px solid color-mix(in srgb, var(--text-color) 28%, transparent);
  border-left-width: 0;
  border-radius: 0 0 6px 6px;
  background: color-mix(in srgb, var(--text-color) 4%, transparent);
  cursor: pointer;
}
.wt:first-child { border-left-width: 1px; }
.wt span {
  position: absolute;
  left: 0; right: 0; bottom: 0.6rem;
  text-align: center;
  font-family: var(--font-family);
  font-size: 0.7rem;
  line-height: 1;
  color: color-mix(in srgb, var(--text-color) 45%, transparent);
  pointer-events: none;
}
.st {
  position: absolute;
  top: 0;
  height: 60%;
  transform: translateX(-50%);
  background: color-mix(in srgb, var(--text-color) 26%, var(--bg-color));
  border-radius: 0 0 5px 5px;
  cursor: pointer;
  z-index: 1;
}
.wt.an, .st.an { background: var(--text-color); border-color: var(--text-color); }
.wt.an span { color: var(--bg-color); }
</style>
</head>
<body>

<div id="klang" class="_018-canvas">
  <canvas id="spektrum"></canvas>
  <div id="akkorde"></div>
  <div id="tasten"></div>
</div>

<script>
(() => {
'use strict';

const NAMEN = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const IST_WEISS = [1,0,1,0,1,1,0,1,0,1,0,1];
const midiFreq = m => 440 * Math.pow(2, (m - 69) / 12);
const LOW = 60;
const BEREICHE = [84, 79, 72];          // C6, G5, C5 as highest key
const MIN_TASTE_PX = 30;

const AKKORDE = [
  { name: 'C',     root: 60, iv: [0, 4, 7] },
  { name: 'Dm',    root: 62, iv: [0, 3, 7] },
  { name: 'Em',    root: 64, iv: [0, 3, 7] },
  { name: 'F',     root: 65, iv: [0, 4, 7] },
  { name: 'G',     root: 67, iv: [0, 4, 7] },
  { name: 'Am',    root: 69, iv: [0, 3, 7] },
  { name: 'G7',    root: 67, iv: [0, 4, 7, 10] },
  { name: 'Cmaj7', root: 60, iv: [0, 4, 7, 11] },
];

const PARTIALE = [ { mult: 1, w: 1 }, { mult: 2, w: 0.6 }, { mult: 3, w: 0.35 } ];
const ZIEL_RMS = 0.08;
const MAX_AUSGLEICH = 60;

const cfg = { mic: false, q: 26, harm: 0.45, vol: 0.55 };

// ---------- audio ----------
let ac = null, sourceBus, voiceBus, master, noiseGain, micGain, micStream = null;
let anaSrc, anaOut, bufSrc, bufOut;
const stimmen = new Map();              // midi -> { gain, partials:[{bp, pg, mult, w}] }
const zaehler = new Map();              // midi -> how many holders press it

function ausgleich(freq){
  const q = Math.max(cfg.q, 0.01);
  const rms = 0.8 * 0.577 * Math.sqrt(1.57 * freq / (q * ac.sampleRate / 2));
  return Math.min(MAX_AUSGLEICH, ZIEL_RMS / Math.max(rms, 1e-6));
}

function startAudio(){
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  ac = new (window.AudioContext || window.webkitAudioContext)();

  sourceBus = ac.createGain();
  voiceBus = ac.createGain();
  master = ac.createGain(); master.gain.value = cfg.vol;
  const limiter = ac.createDynamicsCompressor();
  limiter.threshold.value = -10; limiter.knee.value = 6; limiter.ratio.value = 12;
  limiter.attack.value = 0.003; limiter.release.value = 0.2;
  voiceBus.connect(master); master.connect(limiter); limiter.connect(ac.destination);

  anaSrc = ac.createAnalyser(); anaOut = ac.createAnalyser();
  for (const a of [anaSrc, anaOut]) { a.fftSize = 8192; a.smoothingTimeConstant = 0.85; }
  sourceBus.connect(anaSrc);
  voiceBus.connect(anaOut);
  bufSrc = new Float32Array(anaSrc.frequencyBinCount);
  bufOut = new Float32Array(anaOut.frequencyBinCount);

  const len = ac.sampleRate * 2;
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const noise = ac.createBufferSource(); noise.buffer = buf; noise.loop = true;
  noiseGain = ac.createGain(); noiseGain.gain.value = cfg.mic ? 0 : 1;
  noise.connect(noiseGain); noiseGain.connect(sourceBus); noise.start();

  micGain = ac.createGain(); micGain.gain.value = 0;
  micGain.connect(sourceBus);

  spaltenRechnen();
  requestAnimationFrame(zeichnen);
}

function partialGain(p, freq){
  const amp = p.mult === 1 ? 1 : cfg.harm * p.w;
  return amp * ausgleich(freq * p.mult);
}

function stimmeAn(midi){
  const freq = midiFreq(midi);
  const gain = ac.createGain();
  gain.gain.value = 0;
  gain.connect(voiceBus);
  const partials = [];
  for (const p of PARTIALE){
    if (freq * p.mult >= ac.sampleRate / 2) continue;
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = freq * p.mult;
    bp.Q.value = cfg.q;
    // second identical stage: 12 dB/oct skirts instead of 6, so the carved band stands out
    const bp2 = ac.createBiquadFilter();
    bp2.type = 'bandpass';
    bp2.frequency.value = freq * p.mult;
    bp2.Q.value = cfg.q;
    const pg = ac.createGain();
    pg.gain.value = partialGain(p, freq);
    sourceBus.connect(bp); bp.connect(bp2); bp2.connect(pg); pg.connect(gain);
    partials.push({ bp, bp2, pg, mult: p.mult, w: p.w });
  }
  gain.gain.setTargetAtTime(0.9, ac.currentTime, 0.015);
  stimmen.set(midi, { gain, partials, freq });
}

function stimmeAus(midi){
  const s = stimmen.get(midi);
  if (!s) return;
  stimmen.delete(midi);
  s.gain.gain.setTargetAtTime(0, ac.currentTime, 0.05);
  setTimeout(() => {
    s.gain.disconnect();
    for (const p of s.partials){ sourceBus.disconnect(p.bp); p.bp.disconnect(); p.bp2.disconnect(); p.pg.disconnect(); }
  }, 400);
}

function stimmenNachstellen(){
  if (!ac) return;
  const t = ac.currentTime;
  stimmen.forEach(s => s.partials.forEach(p => {
    p.bp.Q.setTargetAtTime(cfg.q, t, 0.02);
    p.bp2.Q.setTargetAtTime(cfg.q, t, 0.02);
    p.pg.gain.setTargetAtTime(partialGain(p, s.freq), t, 0.02);
  }));
}

function noteOn(midi){
  const n = (zaehler.get(midi) || 0) + 1;
  zaehler.set(midi, n);
  if (n === 1){ stimmeAn(midi); tasteZeigen(midi, true); }
}
function noteOff(midi){
  const n = (zaehler.get(midi) || 0) - 1;
  if (n > 0){ zaehler.set(midi, n); return; }
  zaehler.delete(midi);
  stimmeAus(midi); tasteZeigen(midi, false);
}
function allesAus(){
  tastenHalter.forEach(m => noteOff(m));
  tastenHalter.clear();
  halter.forEach(h => loslassen(h));
  halter.clear();
}

async function micSetzen(on){
  cfg.mic = on;
  if (!ac) startAudio();
  if (on && !micStream){
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio:
        { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    } catch (err) {
      console.error('0klang: Mikrofon nicht verfuegbar', err);
      cfg.mic = false;
      panel.set('mic', false);
      return;
    }
    ac.createMediaStreamSource(micStream).connect(micGain);
  }
  const t = ac.currentTime;
  micGain.gain.setTargetAtTime(cfg.mic ? 1 : 0, t, 0.02);
  noiseGain.gain.setTargetAtTime(cfg.mic ? 0 : 1, t, 0.02);
}

// ---------- layout: keys, pads ----------
const stage = document.getElementById('klang');
const tastenEl = document.getElementById('tasten');
const akkordeEl = document.getElementById('akkorde');
let HIGH = 84, mitten = [], weissAnzahl = 0;

function tastenBauen(){
  const breite = tastenEl.clientWidth || stage.clientWidth || innerWidth;
  let high = BEREICHE[BEREICHE.length - 1];
  for (const h of BEREICHE){
    let w = 0; for (let m = LOW; m <= h; m++) w += IST_WEISS[m % 12];
    if (breite / w >= MIN_TASTE_PX){ high = h; break; }
  }
  if (high === HIGH && tastenEl.childElementCount) return;
  allesAus();
  HIGH = high;
  tastenEl.textContent = '';
  mitten = [];
  let wi = 0;
  const schwarze = [];
  for (let m = LOW; m <= HIGH; m++){
    if (IST_WEISS[m % 12]){
      const k = document.createElement('div');
      k.className = 'wt'; k.dataset.midi = m;
      const l = document.createElement('span');
      l.textContent = m % 12 === 0 ? NAMEN[0] + (Math.floor(m / 12) - 1) : NAMEN[m % 12];
      k.appendChild(l);
      tastenEl.appendChild(k);
      mitten.push(wi + 0.5);
      wi++;
    } else {
      schwarze.push([m, wi]);
      mitten.push(wi);
    }
  }
  weissAnzahl = wi;
  for (const [m, slot] of schwarze){
    const b = document.createElement('div');
    b.className = 'st'; b.dataset.midi = m;
    b.style.left = (slot / weissAnzahl * 100) + '%';
    b.style.width = (0.6 / weissAnzahl * 100) + '%';
    tastenEl.appendChild(b);
  }
  zaehler.forEach((_, m) => tasteZeigen(m, true));
  spaltenRechnen();
}

function tasteZeigen(midi, an){
  const el = tastenEl.querySelector('[data-midi="' + midi + '"]');
  if (el) el.classList.toggle('an', an);
}

AKKORDE.forEach((c, i) => {
  const p = document.createElement('div');
  p.className = 'pad'; p.dataset.akkord = i;
  p.textContent = c.name;
  akkordeEl.appendChild(p);
});

// ---------- input: pointer (multi-touch, glide) ----------
const halter = new Map();               // holder id -> { art:'note'|'akkord', midi?, el? , notes? }
const tastenHalter = new Map();         // key code -> holder

function greifen(ziel){
  if (ziel.dataset.akkord != null){
    const c = AKKORDE[+ziel.dataset.akkord];
    const notes = c.iv.map(iv => c.root + iv);
    notes.forEach(noteOn);
    ziel.classList.add('an');
    return { art: 'akkord', el: ziel, notes };
  }
  const midi = +ziel.dataset.midi;
  noteOn(midi);
  return { art: 'note', midi };
}
function loslassen(h){
  if (h.art === 'akkord'){ h.notes.forEach(noteOff); h.el.classList.remove('an'); }
  else noteOff(h.midi);
}

const ZIELE = '[data-midi],[data-akkord]';

stage.addEventListener('pointerdown', e => {
  const ziel = e.target.closest(ZIELE);
  if (!ziel) return;
  e.preventDefault();
  startAudio();
  if (halter.has(e.pointerId)) loslassen(halter.get(e.pointerId));
  halter.set(e.pointerId, greifen(ziel));
});

stage.addEventListener('pointermove', e => {
  const h = halter.get(e.pointerId);
  if (!h || h.art !== 'note') return;
  const unter = document.elementFromPoint(e.clientX, e.clientY);
  const ziel = unter && unter.closest('[data-midi]');
  if (!ziel || +ziel.dataset.midi === h.midi) return;
  noteOff(h.midi);
  h.midi = +ziel.dataset.midi;
  noteOn(h.midi);
});

function pointerEnde(e){
  const h = halter.get(e.pointerId);
  if (!h) return;
  halter.delete(e.pointerId);
  loslassen(h);
}
addEventListener('pointerup', pointerEnde);
addEventListener('pointercancel', pointerEnde);
stage.addEventListener('contextmenu', e => { if (e.target.closest(ZIELE)) e.preventDefault(); });

// iOS only unlocks audio on certain gesture types; resume on any of them
addEventListener('touchend', () => { if (ac && ac.state === 'suspended') ac.resume(); }, { passive: true });

// ---------- input: computer keyboard ----------
const QWERTZ = { KeyA:60, KeyW:61, KeyS:62, KeyE:63, KeyD:64, KeyF:65, KeyT:66,
                 KeyG:67, KeyY:68, KeyZ:68, KeyH:69, KeyU:70, KeyJ:71, KeyK:72 };

function tippenErlaubt(e){
  if (e.ctrlKey || e.metaKey || e.altKey) return false;
  if (document.body.classList.contains('menu-open') || document.body.classList.contains('meta-dialog-open')) return false;
  const t = e.target;
  return !(t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)));
}
addEventListener('keydown', e => {
  const m = QWERTZ[e.code];
  if (m == null || e.repeat || !tippenErlaubt(e) || tastenHalter.has(e.code)) return;
  startAudio();
  noteOn(m);
  tastenHalter.set(e.code, m);
});
addEventListener('keyup', e => {
  const m = tastenHalter.get(e.code);
  if (m == null) return;
  tastenHalter.delete(e.code);
  noteOff(m);
});
addEventListener('blur', allesAus);
document.addEventListener('visibilitychange', () => { if (document.hidden) allesAus(); });

// ---------- settings panel ----------
const panel = Controls.createPanel({ position: 'left', mobileInitialOpenMode: 'peek' });
panel
  .addToggle('mic',  { label: 'Mikro',    value: cfg.mic, onChange: v => micSetzen(v) })
  .addDivider()
  .addSlider('q',    { label: 'Schärfe',  min: 0, max: 100, step: 0.1,  value: cfg.q,    decimals: 1, onChange: v => { cfg.q = v; stimmenNachstellen(); } })
  .addSlider('harm', { label: 'Obertöne', min: 0, max: 1,   step: 0.01, value: cfg.harm, decimals: 2, onChange: v => { cfg.harm = v; stimmenNachstellen(); } })
  .addSlider('vol',  { label: 'Pegel',    min: 0, max: 1,   step: 0.01, value: cfg.vol,  decimals: 2, onChange: v => {
      cfg.vol = v; if (ac) master.gain.setTargetAtTime(v, ac.currentTime, 0.02); } })
;

function raumFuerPanel(){
  const r = panel.el.getBoundingClientRect();
  if (innerWidth <= 768){
    stage.style.paddingLeft = '';
    stage.style.height = Math.max(0, r.top - stage.getBoundingClientRect().top) + 'px';
  } else {
    stage.style.height = '';
    const unten = tastenEl.getBoundingClientRect().top - 1;
    const frei = innerWidth - r.right;
    stage.style.paddingLeft = (r.bottom > unten && r.left < 1 && frei >= 480) ? r.right + 'px' : '';
  }
}

// ---------- spectrum ----------
const cvs = document.getElementById('spektrum');
const ctx = cvs.getContext('2d');
let W = 0, H = 0, spalten = 0, binVon, binBis;
const SPALTE_PX = 2;
let ref = null;

function semitonAusX(xw){
  const n = mitten.length, last = n - 1;
  if (xw <= mitten[0]) return (xw - mitten[0]) * 12 / 7;
  if (xw >= mitten[last]) return last + (xw - mitten[last]) * 12 / 7;
  let i = 0;
  while (mitten[i + 1] < xw) i++;
  return i + (xw - mitten[i]) / (mitten[i + 1] - mitten[i]);
}

function spaltenRechnen(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = Math.max(1, Math.round(cvs.clientWidth * dpr));
  H = Math.max(1, Math.round(cvs.clientHeight * dpr));
  cvs.width = W; cvs.height = H;
  spalten = Math.ceil(W / SPALTE_PX);
  if (!ac || !weissAnzahl) { zeichnenStill(); return; }
  const binHz = ac.sampleRate / anaSrc.fftSize;
  const maxBin = anaSrc.frequencyBinCount - 1;
  binVon = new Int32Array(spalten); binBis = new Int32Array(spalten);
  const fAus = px => midiFreq(LOW + semitonAusX(px / W * weissAnzahl));
  for (let c = 0; c < spalten; c++){
    const a = Math.round(fAus(c * SPALTE_PX) / binHz);
    const b = Math.round(fAus((c + 1) * SPALTE_PX) / binHz);
    binVon[c] = Math.min(maxBin, Math.max(0, a));
    binBis[c] = Math.min(maxBin, Math.max(binVon[c], b));
  }
}

function farbe(){
  return getComputedStyle(document.documentElement).getPropertyValue('--text-color').trim();
}

const BAND = 0.62;

function zeichnenStill(){
  ctx.clearRect(0, 0, W, H);
  ctx.globalAlpha = 0.14;
  ctx.fillStyle = farbe();
  ctx.fillRect(0, H * (1 - BAND), W, H * BAND);
  ctx.globalAlpha = 1;
}

function flaeche(buf, unten, oben){
  const spanne = oben - unten;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let c = 0; c < spalten; c++){
    let m = -Infinity;
    for (let b = binVon[c]; b <= binBis[c]; b++) if (buf[b] > m) m = buf[b];
    const v = Math.min(1, Math.max(0, (m - unten) / spanne));
    const y = H - v * H;
    ctx.lineTo(c * SPALTE_PX, y);
    ctx.lineTo((c + 1) * SPALTE_PX, y);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
}

function zeichnen(){
  requestAnimationFrame(zeichnen);
  if (!binVon) return;
  anaSrc.getFloatFrequencyData(bufSrc);
  anaOut.getFloatFrequencyData(bufOut);

  let summe = 0, n = 0;
  for (let c = 0; c < spalten; c++){
    const v = bufSrc[binVon[c]];
    if (v > -200) { summe += v; n++; }
  }
  const mittel = n ? summe / n : -140;
  ref = ref == null ? mittel : ref * 0.96 + mittel * 0.04;
  const r = Math.max(ref, -140);
  // band of the source sits at BAND height; 45 dB below that is the floor
  const unten = r - 45, oben = unten + 45 / BAND;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = farbe();
  ctx.globalAlpha = 0.14;
  flaeche(bufSrc, unten, oben);
  ctx.globalAlpha = 1;
  flaeche(bufOut, unten, oben);
}

// ---------- boot ----------
function layout(){ raumFuerPanel(); tastenBauen(); spaltenRechnen(); }
addEventListener('resize', layout);
stage.addEventListener('ctrl-panel-layout-change', layout);
document.addEventListener('ctrl-panel-layout-change', layout);
requestAnimationFrame(layout);

})();
</script>

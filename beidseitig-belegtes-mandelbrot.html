<!DOCTYPE html>
<html lang="de">
<head>

<style>
html, body { touch-action: pan-x pan-y; }
#feld { touch-action: none; cursor: grab; }
#feld:active { cursor: grabbing; }
#feld canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
#feld #lupe {
  inset: auto;
  /* below the menu and back buttons in the top corners */
  top: 64px;
  right: 12px;
  width: 132px;
  height: 132px;
  border-radius: 50%;
  border: 1px solid var(--text-color);
  background: var(--bg-color);
  touch-action: none;
  cursor: grab;
}
#feld #lupe:active { cursor: grabbing; }
#feld #lupe.links { right: auto; left: 12px; }
#feld #lupe[hidden] { display: none; }

#wert {
  margin: 0 0 0.3rem;
  text-align: center;
  font-family: var(--font-libertinus-math);
  font-size: 1.125rem;
  line-height: 1.6;
  font-variant-numeric: tabular-nums;
  color: var(--text-color);
  white-space: nowrap;
  text-shadow: none;
}

#fehler {
  position: fixed;
  top: 5rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  margin: 0;
  padding: 0.4rem 0.75rem;

  background: var(--ui-surface-strong);

}
#fehler[hidden] { display: none; }

@media (max-width: 420px) {
  #wert { font-size: 1rem; }
}
/* 𝑟 and the speed slider 𝑧 are one pair, line for line: the label column only as wide as the
   letter, both tracks over the whole width, both numbers in a box of one width */
.ctrl-panel:not(.bar-mode) .ctrl-row:is([data-key="r"], [data-key="tempo"]) { grid-template-columns: 1em minmax(0, 1fr); }
.ctrl-row:is([data-key="r"], [data-key="tempo"]) .ctrl-value-input { min-width: calc(6ch + 0.4em); }
/* the frame rate the device shows while the ride runs, small under the speed number; out of the
   flow so it moves nothing when it comes and goes */
#hz { position: absolute; right: 2.1em; bottom: -0.55em; font-size: 9px; line-height: 1; letter-spacing: .02em;
  color: var(--t-50, rgba(255,255,255,.5)); font-variant-numeric: tabular-nums; pointer-events: none; }
#hz[hidden] { display: none; }
</style>

<body>
<div id="feld" class="_018-canvas">
  <canvas id="bild" aria-label="Mandelbrot-Menge, innen echt, außen am Kreis gespiegelt; Spiegelpunkt verschiebbar"></canvas>
  <canvas id="lupe" aria-hidden="true" hidden></canvas>
</div>
<p id="wert" aria-live="off"></p>
<p id="fehler" role="alert" hidden></p>
<script src="/tools/workers/gespiegeltes-mandelbrot-bahn.js"></script>
<script>
"use strict";
(() => {
  const feld = document.getElementById("feld");
  const bild = document.getElementById("bild");
  const lupe = document.getElementById("lupe");
  const lctx = lupe.getContext("2d");
  const wert = document.getElementById("wert");
  const fehler = document.getElementById("fehler");

  const fail = (msg) => {
    console.error(msg);
    fehler.textContent = msg;
    fehler.hidden = false;
  };

  // the start: a Misiurewicz point from the Forschungsheft, section (h)
  // Further mirrors from Forschungsheft (i), chosen by URL only: ?spiegel=a2 | b1 | c2.
  // Without it kind stays 0 and nothing below this line changes (the shader is the same text).
  const KINDS = { a2: 2, b1: 3, c2: 4 };
  const SPIEGEL = new URLSearchParams(location.search).get("spiegel");
  const kind = SPIEGEL ? KINDS[SPIEGEL] || 0 : 0;
  if (SPIEGEL && !kind) console.error("spiegel: unbekannter Wert " + SPIEGEL);
  const START = kind === 2 ? { c: [-0.75, 0], r: 1.2 }
    : kind === 3 ? { c: [0.37458872600429492, 0.08835724479480638], r: 0.0045 }
    : kind === 4 ? { c: [0, 1], r: 0.05 }
    : { c: [-0.7214150803581202, 0.25918596703287955], r: 1.5 };

  // state: mirror point cM, radius r; view in the w-plane: center vH (exact, below), scale ls.
  // cMx/cMy are double shadows of the exact cH. The view center is known as log2|v| (lv)
  // and direction (vnx, vny), so far out, where |v| is no double any more, nothing overflows.
  let cMx = START.c[0], cMy = START.c[1], r = START.r;
  let lv = -Infinity, vnx = 0, vny = 0;
  // ls = log2(sw), sw = w units per CSS pixel. The zoom lives in ls: here the 1 is the 0,
  // and 0 and ∞ are the two ends of the same line, both out of reach, neither a wall.
  // sw itself is only a shadow and may round to 0 or ∞.
  let ls = NaN, sw = NaN;
  let zoomZeit = 0;
  const setS = (l) => { ls = l; sw = 2 ** l; if (typeof zoomLauf === "function" && !zoomZeit) zoomZeit = requestAnimationFrame(zoomLauf); };
  let snapOn = true;
  // what happened when (bands begun and done; anchors swapped in; old pictures
  // stretched while an orbit is missing), the last 400, for hunting phone-only glitches: kept
  // always, so a recording (tools/aufnahme.js) brings them along without ?diag
  const ereignisse = [];
  function ereignis(art, x) {
    ereignisse.push({ t: performance.now(), art, ls, ...x });
    if (ereignisse.length > 400) ereignisse.shift();
  }
  let cssW = 1, cssH = 1, dpr = 1;

  // ---- exact numbers: BigInt fixed point, value = b / 2^PB ----
  // Deep views need the view center and the reference orbit far below double resolution.
  let PB = 128, PBn = 128n;
  const bitLen = (b) => (b < 0n ? -b : b).toString(16).length * 4;
  function ldexp(x, n) {
    while (n > 1000) { x *= 2 ** 1000; n -= 1000; }
    while (n < -1000) { x *= 2 ** -1000; n += 1000; }
    return x * 2 ** n;
  }
  // double times 2^sh -> fixed point (exact)
  function H(x, sh = 0) {
    if (x === 0 || !Number.isFinite(x)) return 0n;
    const e = Math.floor(Math.log2(Math.abs(x))) - 60;
    const m = BigInt(Math.round(ldexp(x, -e)));
    const k = e + PB + sh;
    return k >= 0 ? m << BigInt(k) : m >> BigInt(-k);
  }
  // x 2^l -> fixed point, l need not be whole
  const Hl = (x, l) => { const li = Math.floor(l); return H(x * 2 ** (l - li), li); };
  // fixed point -> double, divided by 2^e (e need not be whole); 0 or ±∞ where doubles end
  function N(b, e = 0) {
    if (b === 0n) return 0;
    const drop = Math.max(0, bitLen(b) - 64);
    return ldexp(Number(drop ? b >> BigInt(drop) : b), drop - PB - e);
  }
  // log2 |b|, for any size
  function lg2(b) {
    if (b === 0n) return -Infinity;
    if (b < 0n) b = -b;
    const drop = Math.max(0, bitLen(b) - 64);
    return Math.log2(Number(b >> BigInt(drop))) + drop - PB;
  }
  const logadd = (a, b) => {
    const m = Math.max(a, b);
    return m === -Infinity ? m : m + Math.log2(2 ** (a - m) + 2 ** (b - m));
  };
  // b from fixed point with `from` bits to the current PB
  const zuPB = (b, from) => (PB >= from ? b << BigInt(PB - from) : b >> BigInt(from - PB));
  const mul = (a, b) => (a * b) >> PBn;
  // decimal string (also 1.5e-7) -> fixed point
  function fromDec(str) {
    const m = /^\s*([+-]?)(\d*)\.?(\d*)(?:e([+-]?\d+))?\s*$/i.exec(str);
    if (!m || !(m[2] + m[3])) return null;
    const ex = (Number(m[4]) || 0) - m[3].length;
    let b = BigInt(m[2] + m[3]) << PBn;
    b = ex >= 0 ? b * 10n ** BigInt(ex) : b / 10n ** BigInt(-ex);
    return m[1] === "-" ? -b : b;
  }
  // fixed point -> decimal string with n fraction digits
  function toDec(b, n) {
    const neg = b < 0n;
    if (neg) b = -b;
    const ip = b >> PBn;
    const fp = (((b - (ip << PBn)) * 10n ** BigInt(n)) >> PBn).toString().padStart(n, "0").replace(/0+$/, "");
    return (neg ? "-" : "") + ip + (fp ? "." + fp : "");
  }
  // fixed point (|b| >= 1) -> decimal with n significant digits, exponent of any size
  function toSci(b, n) {
    const neg = b < 0n;
    if (neg) b = -b;
    const ip = (b >> PBn).toString(), fp = ip.slice(1, n).replace(/0+$/, "");
    return (neg ? "-" : "") + ip[0] + (fp ? "." + fp : "") + "e" + (ip.length - 1);
  }

  let cH = [0n, 0n], vH = [0n, 0n];
  // cM as an exact Misiurewicz point: preperiod k, period p (null when cM is just where the finger left it)
  let mis = null;

  // Fewer bits cut the centre (and c) off at the new width. Zoomed back in, those bits are
  // what the view stood on: out and in again must land on the same spot. So the values from
  // before the cut are kept while the centre (c) is still the cut version of them, and put
  // back when the width grows again.
  let verlust = null;
  const schnitt = (b, von, auf) => (auf > von ? b << BigInt(auf - von) : b >> BigInt(von - auf));
  function setPB(n) {
    if (n === PB) return;
    const sh = (b) => schnitt(b, PB, n);
    let nv = vH.map(sh), nc = cH.map(sh);
    if (n < PB) {
      const treu = verlust && vH.every((b, i) => b === schnitt(verlust.vH[i], verlust.PB, PB))
        && (mis || cH.every((b, i) => b === schnitt(verlust.cH[i], verlust.PB, PB)));
      if (!treu) verlust = { PB, vH, cH };
    } else if (verlust) {
      const vP = verlust.PB;
      if (vH.every((b, i) => b === schnitt(verlust.vH[i], vP, PB))) nv = verlust.vH.map((b) => schnitt(b, vP, n));
      if (!mis && cH.every((b, i) => b === schnitt(verlust.cH[i], vP, PB))) nc = verlust.cH.map((b) => schnitt(b, vP, n));
      if (n >= vP) verlust = null;
    }
    vH = nv;
    cH = nc;
    PB = n;
    PBn = BigInt(n);
    if (mis) cRoh = true;
  }
  // cH only cut or widened, not yet refined at the new width: frames from the band need no more
  let cRoh = false;
  function cFein() {
    cRoh = false;
    if (mis) cH = misRefine(cH[0], cH[1], mis.k, mis.p) || cH;
  }
  // bits for the finest c-pixel of the current view, plus 64 to spare. nurV: only the bits the
  // view centre needs, upwards only. Moving the view asks just that; the c-pixel's bits wait
  // until a frame is really computed. Lookups in the band need none of them, and outside the
  // mirror every octave out wanted two more: each new width cost a Newton run along the whole
  // orbit of the mirror point (993 steps at Tim's), up to 100 ms, five times a second.
  function ensurePB(nurV) {
    if (nurV) {
      const need = Math.max(128, Math.ceil((64 + Math.max(0, -ls)) / 64) * 64);
      if (need > PB) setPB(need);
      return;
    }
    const lw = logadd(lv, Math.log2(Math.hypot(cssW, cssH) / 2) + ls);
    const lpc = Math.log2(Math.max(r, 1e-9)) + ls - (kind || !spiegelOn ? 0 : 2 * Math.max(0, lw));
    const need = Math.max(128, Math.ceil((64 + Math.max(0, -lpc, -ls)) / 64) * 64);
    if (need > PB || need < PB - 128) setPB(need);
  }
  function setV(hx, hy) {
    vH = [hx, hy];
    const lx = lg2(hx), ly = lg2(hy), m = Math.max(lx, ly);
    if (m === -Infinity) { lv = -Infinity; vnx = vny = 0; return; }
    const ax = 2 ** (lx - m), ay = 2 ** (ly - m), h = Math.hypot(ax, ay);
    lv = m + Math.log2(h);
    vnx = (hx < 0n ? -ax : ax) / h;
    vny = (hy < 0n ? -ay : ay) / h;
  }
  // move the view by (px, py) CSS pixels, y up
  const panPx = (px, py) => setV(vH[0] + Hl(px, ls), vH[1] + Hl(py, ls));
  // exact: look for the Misiurewicz point this double is the rounding of (start, URL)
  function setC(x, y, exact) {
    cMx = x;
    cMy = y;
    mis = null;
    cGenau = false;
    cH = [H(x), H(y)];
    if (!exact) return;
    const m = misFind(x, y, 1e-12 * (1 + Math.hypot(x, y)));
    if (m) {
      mis = { k: m.k, p: m.p };
      cH = m.e;
    }
  }

  // c exactly at h, below what a double resolves (dragged deep down); m: Misiurewicz point
  let cGenau = false;
  function setCH(h, m) {
    cH = h;
    mis = m;
    cMx = N(h[0]);
    cMy = N(h[1]);
    cGenau = true;
  }

  // ---- Misiurewicz points: z_{k+p} = z_k for the orbit of 0, k >= 1 ----
  // Only these mirror into a pattern without end; any other point closes up when zoomed out far enough.
  function misNewton(cx, cy, k, p) {
    for (let it = 0; it < 40; it++) {
      let zx = 0, zy = 0, dx = 0, dy = 0, ax = 0, ay = 0, bx = 0, by = 0;
      for (let n = 1; n <= k + p; n++) {
        const t = 2 * (zx * dx - zy * dy) + 1;
        dy = 2 * (zx * dy + zy * dx);
        dx = t;
        const u = zx * zx - zy * zy + cx;
        zy = 2 * zx * zy + cy;
        zx = u;
        if (n === k) { ax = zx; ay = zy; bx = dx; by = dy; }
      }
      const gx = zx - ax, gy = zy - ay, hx = dx - bx, hy = dy - by;
      const h2 = hx * hx + hy * hy;
      if (!(h2 > 0)) return null;
      const sx = (gx * hx + gy * hy) / h2, sy = (gy * hx - gx * hy) / h2;
      cx -= sx;
      cy -= sy;
      if (!(Math.abs(cx) < 4 && Math.abs(cy) < 4)) return null;
      if (Math.hypot(sx, sy) < 1e-14 * (1 + Math.hypot(cx, cy))) return [cx, cy];
    }
    return null;
  }
  // pairs (k, p) whose Newton step from c is shorter than R: near c lies a root of
  // z_{k+p} = z_k about that far away. Smallest k first.
  function misCandidates(cx, cy, R) {
    const zs = [], ds = [];
    let zx = 0, zy = 0, dx = 0, dy = 0;
    for (let n = 1; n <= 2000; n++) {
      const t = 2 * (zx * dx - zy * dy) + 1;
      dy = 2 * (zx * dy + zy * dx);
      dx = t;
      const u = zx * zx - zy * zy + cx;
      zy = 2 * zx * zy + cy;
      zx = u;
      if (!(zx * zx + zy * zy < 1e6 && Math.abs(dx) + Math.abs(dy) < 1e150)) break;
      zs.push(zx, zy);
      ds.push(dx, dy);
    }
    const L = zs.length / 2, out = [];
    for (let k = 1; k < L; k++)
      for (let p = 1; p <= 8 && k + p <= L; p++) {
        const i = 2 * (k - 1), j = 2 * (k + p - 1);
        const gx = zs[j] - zs[i], gy = zs[j + 1] - zs[i + 1], hx = ds[j] - ds[i], hy = ds[j + 1] - ds[i + 1];
        const h2 = hx * hx + hy * hy;
        if (h2 > 0 && (gx * gx + gy * gy) / h2 < R * R) out.push({ k, p });
      }
    return out;
  }
  const ab = (b) => (b < 0n ? -b : b);
  // exact check of a refined root: the next Newton step is below half the working
  // precision, and the cycle repels (a centre has 0 on its cycle and attracts: finite).
  // Barely repelling cycles are endless too, but grow so slowly per turn that far out
  // the iteration limit runs out first and the view goes flat: at least 1/16 bit per step.
  function misVerify(cx, cy, k, p) {
    const one = 1n << PBn, s1 = PBn - 1n;
    let zx = 0n, zy = 0n, dx = 0n, dy = 0n, ax = 0n, ay = 0n, bx = 0n, by = 0n, lam = 0;
    for (let n = 1; n <= k + p; n++) {
      if (n > k) lam += Math.log2(2 * Math.hypot(N(zx), N(zy)));
      const t = ((zx * dx - zy * dy) >> s1) + one;
      dy = (zx * dy + zy * dx) >> s1;
      dx = t;
      const u = ((zx * zx - zy * zy) >> PBn) + cx;
      zy = ((zx * zy) >> s1) + cy;
      zx = u;
      if (ab(zx) + ab(zy) > 8n << PBn) return false;
      if (n === k) { ax = zx; ay = zy; bx = dx; by = dy; }
    }
    const gx = zx - ax, gy = zy - ay, hx = dx - bx, hy = dy - by;
    const h2 = (hx * hx + hy * hy) >> PBn;
    if (h2 === 0n || !(lam >= p / 16)) return false;
    const sx = ((gx * hx + gy * hy) >> PBn << PBn) / h2, sy = ((gy * hx - gx * hy) >> PBn << PBn) / h2;
    // in log2: 2^(-PB/2) itself is 0 as a double from PB = 2150 on
    return lg2(ab(sx) + ab(sy)) < -PB / 2;
  }
  // a verified Misiurewicz point within R of c (double in, exact out), smallest preperiod first
  function misFind(cx, cy, R) {
    const h0 = [H(cx), H(cy)];
    let tries = 0;
    for (const { k, p } of misCandidates(cx, cy, R)) {
      if (++tries > 64) break;
      const c = misNewton(cx, cy, k, p) || [cx, cy];
      if (Math.hypot(c[0] - cx, c[1] - cy) > 2 * R) continue;
      const e = misRefine(H(c[0]), H(c[1]), k, p);
      if (!e || Math.hypot(N(e[0] - h0[0]), N(e[1] - h0[1])) > R || !misVerify(e[0], e[1], k, p)) continue;
      return { c: [N(e[0]), N(e[1])], e, k, p };
    }
    return null;
  }
  // Newton in fixed point, quadratic from the double root; null if the orbit escapes
  function misRefine(cx, cy, k, p) {
    const one = 1n << PBn, s1 = PBn - 1n, esc = 8n << PBn;
    for (let it = 0; it < 40; it++) {
      let zx = 0n, zy = 0n, dx = 0n, dy = 0n, ax = 0n, ay = 0n, bx = 0n, by = 0n;
      for (let n = 1; n <= k + p; n++) {
        const t = ((zx * dx - zy * dy) >> s1) + one;
        dy = (zx * dy + zy * dx) >> s1;
        dx = t;
        const u = ((zx * zx - zy * zy) >> PBn) + cx;
        zy = ((zx * zy) >> s1) + cy;
        zx = u;
        if (ab(zx) + ab(zy) > esc) return null;
        if (n === k) { ax = zx; ay = zy; bx = dx; by = dy; }
      }
      const gx = zx - ax, gy = zy - ay, hx = dx - bx, hy = dy - by;
      const h2 = (hx * hx + hy * hy) >> PBn;
      if (h2 === 0n) break;
      const sx = ((gx * hx + gy * hy) >> PBn << PBn) / h2, sy = ((gy * hx - gx * hy) >> PBn << PBn) / h2;
      cx -= sx;
      cy -= sy;
      if ((sx < 0n ? -sx : sx) + (sy < 0n ? -sy : sy) < 256n) break;
    }
    return [cx, cy];
  }

  // ---- WebGL ----
  const gl = bild.getContext("webgl2", { antialias: false, preserveDrawingBuffer: true });
  if (!gl) { fail("WebGL 2 fehlt in diesem Browser."); return; }

  const VS = `#version 300 es
in vec2 p;
void main() { gl_Position = vec4(p, 0.0, 1.0); }`;

  // Perturbation around an exact reference orbit (texture), with rebasing (Zhuoran):
  // pixels iterate only dz = z - Z. Inside |w| <= 1: c = cM + r w; outside:
  // c = cM + r / conj(w) (circle inversion, continuous on |w| = 1).
  // Every pixel gets its dc as mantissa * 2^ec. While dz is below float range it is
  // carried the same way (dz = w 2^E, the exponent an int without bound), so depth is not
  // bound by float32; once |dz| > 2^-100 the loop runs on plain floats.
  // BLA: where dz is small enough, 2^l steps of the orbit at once as dz -> A dz + B dc
  // (tables per reference, built below); the loop counts n in orbit steps either way.
  // Mode 0 (origin near the view): reference cM, u = w / s.
  // Mode 1: reference near the view center vc; pixel offsets relative to vc, with
  // D0I / D0O = c(vc) - cRef on the inner / outer branch, done exactly in JS.
  const FS = `#version 300 es
precision highp float;
precision highp int;
uniform sampler2D uRef;
uniform sampler2D uBlaAB;
uniform sampler2D uBlaR;
uniform int uBlaOff[28];
uniform int uBlaCnt[28];
uniform int uBlaTop;
uniform float uLc;
uniform int uRefLen;
uniform int uMaxit;
// the band (der Häck, below): 1 computes it, 2 looks the view up in it where it serves
uniform int uBand;
uniform highp sampler2D uBandT;
uniform float uBandRb;
uniform vec2 uBandN;
uniform float uBandLam;
uniform float uBandTh;
uniform float uBandP;
uniform vec4 uBandI;
uniform vec4 uBandO;
uniform vec2 uRes;
uniform int uMode;
uniform vec2 uU0;
uniform float uInvS2;
uniform float uKI;
uniform int uEI;
uniform float uKO;
uniform int uEO;
uniform float uH;
uniform vec2 uVn;
uniform float uEps;
uniform vec2 uE;
uniform vec2 uA;
uniform vec2 uD0I;
uniform vec2 uD0O;
uniform vec2 uMu0;
uniform vec2 uMp0;
uniform vec2 uS0;
uniform float uEb;
#ifdef KIND
uniform vec4 uSt[82];
uniform vec2 uBe, uXs, uJw, uUW;
uniform vec3 uW0, uUc;
uniform float uRE, uIEs, uEsc, uA0;
#endif
out vec4 o;

vec2 cmul(vec2 a, vec2 b) { return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x); }
vec2 cdiv(vec2 a, vec2 b) {
  float m = max(abs(b.x), abs(b.y));
  vec2 bb = b / m;
  return vec2(a.x * bb.x + a.y * bb.y, a.y * bb.x - a.x * bb.y) / (dot(bb, bb) * m);
}
vec2 invConj(vec2 w) {
  float m = max(abs(w.x), abs(w.y));
  vec2 u = w / m;
  return u / (dot(u, u) * m);
}
#ifdef KIND
// principal square root, without the cancellation of the textbook form
vec2 csqrt(vec2 z) {
  float m = length(z);
  if (z.x >= 0.0) {
    float a = sqrt(0.5 * (m + z.x));

    // marker's step on screen from frame to frame (full bar 8 px)
    const BALKEN = "▁▂▃▄▅▆▇█";
    const balken = (xs, voll) => xs.map((x) => BALKEN[Math.max(0, Math.min(7, Math.round((x / voll) * 7)))]).join("");
    const rahmenZeilen = () => {
      const L = rahmenLog.slice(-60);
      if (!L.length) return ["frames -"];
      const z = L[L.length - 1];
      const schritt = L.map((f, i) => (i ? Math.hypot(f.ox - L[i - 1].ox, f.oy - L[i - 1].oy) : 0));
      return [
        `q  ${balken(L.map((f) => f.q), 1)}`,
        `dt ${balken(L.map((f) => f.dt), 50)}`,
        `mk ${balken(schritt, 8)}`,
        // the way each frame came about: b from the band, s moved anchor, n drawn whole, a old picture stretched
        `way ${L.map((f) => (!f.ok ? "a" : f.br === "band" ? "b" : f.k === 1 ? "n" : "s")).join("")}`,
        `last dt ${z.dt.toFixed(1)} q ${z.q.toFixed(2)} k ${z.k == null ? "-" : z.k.toFixed(3)} edge ${z.rand == null ? "-" : (100 * z.rand).toFixed(0) + "%"} @${z.qr == null ? "-" : z.qr.toFixed(2)} mk ${z.ox.toFixed(1)},${z.oy.toFixed(1)} nach ${nach ? (100 - 100 * nach.y / nach.Hc).toFixed(0) + "%" : "-"}`,
      ];
    };
    const bandZeile = () => (band ? `band ${band.Nx + 2}x${band.Ny} ${band.fertig ? "ok" : (100 * band.y / band.Ny).toFixed(0) + "%"} lam ${band.lam.toFixed(5)} th ${band.th.toFixed(5)}` : "band -");
    const modus = () => (dragging ? (dragging.lupe ? "lupe" : "punkt") : pts.size >= 2 ? "pinch" : pts.size === 1 ? "pan" : lupeZug ? "lupe" : "-");
    const zeilen = () => {
      const vv = window.visualViewport;
      return [
        `mode ${modus()} fingers ${pts.size}`,
        `dpr ${window.devicePixelRatio} used ${dpr}`,
        `canvas ${bild.width}x${bild.height} px, css ${cssW.toFixed(1)}x${cssH.toFixed(1)}`,
        `inner ${window.innerWidth}x${window.innerHeight} vv ${vv ? vv.width.toFixed(1) + "x" + vv.height.toFixed(1) + " scale " + vv.scale : "-"}`,
        `resize #${resizeN} ${resizeN ? ((performance.now() - resizeT) / 1000).toFixed(1) + "s ago" : "-"}`,
        `ls ${ls.toFixed(4)} sw ${sw} c ${cMx.toFixed(6)},${cMy.toFixed(6)}`,
        `v ${N(vH[0])},${N(vH[1])}`,
        `tempo ${tempoV} cost ${pxMs.toExponential(2)} ms/px gpu timer ${tqExt ? "yes" : "no"}`,
        ...rahmenZeilen(),
        bandZeile(),
      ].join("\n");
    };
    // read by tools/aufnahme.js (recording trace, and sent along on unlocked pages)
    const dbg = gl.getExtension("WEBGL_debug_renderer_info");
    // the big lines, readable on a phone when filmed: how deep, how this frame came about, how
    // long it took, why the band serves or not, and the device
    const art = (f) => {
      if (!f) return "-";
      if (!f.ok) return "old picture stretched";
      if (f.br === "band") return "BAND (no iterations)";
      if (f.k === -1) return "WAIT for band: last picture turned";
      if (f.k === 1) return f.qr >= 1 ? "LIVE whole, sharp" : "LIVE whole, q " + f.qr.toFixed(2);
      return "LIVE shifted, edge " + (100 * f.rand).toFixed(0) + "% q " + (f.qr == null ? "-" : f.qr.toFixed(2));
    };
    const gross = () => {
      const L = rahmenLog.slice(-60), z = L[L.length - 1];
      const dts = L.slice(1).map((f) => f.dt);
      const tief = Math.log2(fitSw()) - ls;
      // measured frame rate over the last second, and the zoom per shown frame in octaves (0 = a step shown twice)
      const jung = z ? L.filter((f) => z.t - f.t <= 1000) : [];
      const fps = jung.length > 1 ? (1000 * (jung.length - 1) / (z.t - jung[0].t)).toFixed(0) : "-";
      const zoomSchritt = L.length > 1 ? Math.abs(z.ls - L[L.length - 2].ls).toPrecision(3) : "-";
      return [
        `depth ${tief.toFixed(2)} oct (x10^${(tief * Math.log10(2)).toFixed(1)})  tempo ${tempoV}`,
        `frame ${art(z)}`,
        `q ${gezeigt ? gezeigt.q.toFixed(2) : "-"}  dt ${z ? z.dt.toFixed(1) : "-"} ms  max60 ${dts.length ? Math.max(...dts).toFixed(1) : "-"} ms`,
        `fps ${fps}  zoom step ${zoomSchritt}`,
        `cost ${pxMs.toExponential(2)} ms/px  timer query ${tqExt ? "YES" : "NO"}`,
        `band ${band ? (band.fertig ? "ready" : "building " + (100 * band.y / band.Ny).toFixed(0) + "%") + " " + (band.Nx + 2) + "x" + band.Ny : "-"}`,
        `why ${bandGrund}`,
        `mirror ${spiegelOn ? "on" : "off"}`,
        `dpr ${window.devicePixelRatio} used ${dpr}  canvas ${bild.width}x${bild.height}`,
        `gpu ${geraet.renderer}`,
      ].join("\n");
    };
    if (new URLSearchParams(location.search).has("diag")) {
      const box = document.createElement("div");
      box.id = "diag";
      box.style.cssText = "position:fixed;left:4px;top:4px;right:4px;max-height:60vh;overflow:hidden;pointer-events:none;z-index:99999;text-align:left";
      const gr = document.createElement("pre");
      gr.style.cssText = "margin:0;padding:4px 6px;font:12px/1.3 ui-monospace,monospace;color:#f2f2f2;background:rgba(10,10,12,.78);border-radius:4px;white-space:pre-wrap;word-break:break-all;width:max-content;max-width:100%";
      const dg = document.createElement("pre");
      dg.style.cssText = "margin:2px 0 0;padding:2px 4px;font:9px/1.15 monospace;color:#cfcfcf;background:rgba(0,0,0,.55);white-space:pre;width:max-content";
      box.append(gr, dg);
      document.body.appendChild(box);
      const tick = () => {
        gr.textContent = gross();
        dg.textContent = zeilen();
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }
    const geraet = {
      renderer: gl.getParameter(dbg ? dbg.UNMASKED_RENDERER_WEBGL : gl.RENDERER),
      maxTex: gl.getParameter(gl.MAX_TEXTURE_SIZE), maxViewport: [...gl.getParameter(gl.MAX_VIEWPORT_DIMS)],
      maxRb: gl.getParameter(gl.MAX_RENDERBUFFER_SIZE), floatZiel: !!gl.getExtension("EXT_color_buffer_float"),
      hp: gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT).precision,
    };
    window.__diag = () => ({
      text: gross() + "\n" + zeilen(), grund: bandGrund, geraet, rahmen: rahmenLog.slice(-120), ereignisse: ereignisse.slice(),
      band: band && { lam: band.lam, th: band.th, Nx: band.Nx, Ny: band.Ny, Rb: band.Rb, S0: band.S0, y: band.y, fertig: band.fertig },
      fahrt: { tempo: tempoV, pxMs, gpuTimer: !!tqExt, dpr, dprGeraet: window.devicePixelRatio, canvas: [bild.width, bild.height] },
    });
  }

  bild.addEventListener("webglcontextlost", (e) => { e.preventDefault(); fail("Grafikkontext verloren, Seite neu laden."); });

  const b0 = feld.getBoundingClientRect();
  cssW = Math.max(1, b0.width);
  cssH = Math.max(1, b0.height);
  dpr = Math.min(1.5, window.devicePixelRatio || 1);
  fitView();
  // URL > page defaults (control-defaults) > code values; the panel holds the latter two
  r = panel.get("r");
  snapOn = !!panel.get("rasten");
  lupeOn = !!panel.get("lupe");
  setLupeG(panel.get("lupeG"));
  setC(cMx, cMy, true);
  loadUrl();
  showValues();
  request(false);
  requestAnimationFrame(() => setTimeout(ladeRasten, 0));
})();
</script>

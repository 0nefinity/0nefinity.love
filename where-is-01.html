<!DOCTYPE html>
<!-- where-is-01.html -->
<html lang="de">

<head>
  <!--#include virtual="/includes/something-in-the-head.html" -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script src="/tools/editor-symbole.js?v=<!--#flastmod virtual="/tools/editor-symbole.js" -->"></script>


  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
    }

    body {
      cursor: none;
    }

    .cursor-loupe {
      position: fixed;
      width: 10rem;
      height: 10rem;
      pointer-events: none;
      z-index: 2000;
      /* Für stufenlosen Zoom; Origin = Linsenmitte im SVG, folgt dem Cursor */
      --scale: 1;
      transform: translate(-36%, -31%) scale(var(--scale));
      transform-origin: 36% 31%;
    }
  </style>
</head>

<body>
  <h1>where is 0 1 ?</h1>
  <p>can you find it in the infinite?</p>
  <p>maybe the magnifying glass will help you</p>

  <script>
    (function () {
      const loupe = document.createElement('div');
      loupe.className = 'cursor-loupe';
      loupe.innerHTML = window.oneSymbolSvg('lupe', 'class="meta-loupe" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false"');
      document.body.appendChild(loupe);

      const zoom = Zoom2D.createZoom2D({
        container: document.body,
        content: loupe,
        mode: 'relative',
        hoverFollowsPointer: true,
        minScale: 0,
        maxScale: Infinity,
        initialScale: 1,
        initialOffsetX: window.innerWidth / 2,
        initialOffsetY: window.innerHeight / 2,
        onTransform: ({ scale, offsetX, offsetY }) => {
          loupe.style.left = offsetX + 'px';
          loupe.style.top = offsetY + 'px';
          loupe.style.setProperty('--scale', scale);
        }
      });
    })();
  </script>
<!--#include virtual="/includes/something-in-the-body.html" -->
</body>

</html>

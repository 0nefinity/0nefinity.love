<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Irrational harness</title>
<script src="/tools/irrational.js"></script>
</head>
<body>
<pre id="out">harness</pre>
<script>
// Testseite: holt n Stellen einer Konstante ueber Irrational.open und vergleicht mit ref/<id>.txt (mpmath).
window.runCheck = async function (id, n) {
    const ref = (await (await fetch('/tests/irrational/ref/' + id + '.txt?raw=1')).text()).trim();
    return new Promise((resolve) => {
        const buf = new Uint8Array(n + 100000);
        let got = 0, done = false;
        const finish = (extra) => {
            if (done) return;
            done = true;
            h.close();
            let bad = -1;
            const m = Math.min(got, n);
            for (let i = 0; i < m; i++) if (buf[i] !== ref.charCodeAt(i)) { bad = i; break; }
            resolve(Object.assign({ id, got, refLen: ref.length, mismatchAt: bad, ok: bad < 0 && got >= n, state: h.state() }, extra));
        };
        const h = Irrational.open(id, {
            onDigits(u8, off) {
                buf.set(u8.subarray(0, Math.max(0, Math.min(u8.length, buf.length - off))), off);
                got = Math.max(got, off + u8.length);
                if (got >= n) finish({});
            },
            onLimit(l) { finish({ limit: l }); },
            onError(e) { finish({ error: String(e.message) }); },
        });
        h.want(n);
    });
};
document.getElementById('out').textContent = 'ready';
</script>
</body>
</html>

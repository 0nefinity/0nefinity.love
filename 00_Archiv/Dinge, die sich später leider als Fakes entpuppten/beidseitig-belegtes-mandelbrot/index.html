<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>beidseitig belegtes Mandelbrot</title>
<style>
  :root {
    --bg-color: #000000;
    --text-color: #d8d8d8;
    --text-dim: #8e8e8e;
    --ui-surface: rgba(8, 8, 8, 0.8);
    --ui-border-soft: rgba(255, 255, 255, 0.1);
    --accent: #e8e8e8;
    color-scheme: dark;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg-color);
    color: var(--text-color);
    font: 0.875rem/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #bild {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
    display: block;
  }
  #bild:active { cursor: grabbing; }
  .feld {
    position: fixed;
    background: var(--ui-surface);
    border: 1px solid var(--ui-border-soft);
    border-radius: 6px;
    backdrop-filter: blur(6px);
  }
  h1 {
    top: 12px;
    left: 12px;
    margin: 0;
    padding: 6px 10px;
    font-size: 0.875rem;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  #status {
    display: inline-block;
    width: 6px;
    height: 6px;
    margin-left: 8px;
    border-radius: 50%;
    background: var(--accent);
    vertical-align: middle;
    opacity: 0;
    transition: opacity 200ms;
  }
  #status.an { opacity: 0.9; }
  #werte {
    left: 12px;
    right: 12px;
    bottom: 12px;
    padding: 8px 10px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 2px 16px;
    font-variant-numeric: tabular-nums;
  }
  .name { color: var(--text-dim); }
  .knoepfe {
    grid-column: 3;
    display: flex;
    gap: 6px;
  }
  button {
    min-height: 44px;
    min-width: 44px;
    padding: 0 14px;
    border: 0;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.07);
    color: var(--text-color);
    font: inherit;
    cursor: pointer;
    transition: background 150ms;
  }
  button:hover { background: rgba(255, 255, 255, 0.14); }
  button:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
  #grenze, #fehler {
    top: 12px;
    right: 12px;
    padding: 6px 10px;
  }
  #fehler { color: #e0a4a4; }
  button[aria-pressed="true"], button[aria-expanded="true"] { background: rgba(255, 255, 255, 0.2); }
  #farben {
    right: 12px;
    bottom: 76px;
    width: min(320px, calc(100% - 24px));
    box-sizing: border-box;
    padding: 14px;
    display: grid;
    gap: 2px;
  }
  #farben[hidden] { display: none; }
  #paletten { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
  #paletten button { padding: 0 12px; display: flex; align-items: center; gap: 10px; }
  .muster {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    border: 1px solid var(--ui-border-soft);
  }
  #farben label {
    display: grid;
    grid-template-columns: 4.5em 1fr;
    align-items: center;
    min-height: 44px;
  }
  input[type="range"] { width: 100%; height: 44px; margin: 0; accent-color: var(--accent); }
  @media (max-width: 560px) {
    #werte { grid-template-columns: auto 1fr; }
    .knoepfe { grid-row: auto; grid-column: 1 / span 2; justify-content: flex-end; }
    #farben { bottom: 124px; }
  }
</style>
</head>
<body>
<canvas id="bild" aria-label="beidseitig belegtes Mandelbrot, zoombar"></canvas>
<h1 class="feld">beidseitig belegtes Mandelbrot<span id="status"></span></h1>
<div id="grenze" class="feld" hidden>Grenze dieses Prototyps erreicht</div>
<div id="fehler" class="feld" hidden></div>
<div id="werte" class="feld">
  <span class="name">Zoom</span>
  <span><span id="zoom"></span> <span class="name">&middot; Ebene</span> <span id="ebene"></span> <span class="name">&middot; Welt</span> <span id="welt"></span></span>
  <div class="knoepfe">
    <button id="startknopf" type="button">Start</button>
    <button id="neuknopf" type="button">Neue Welt</button>
    <button id="farbknopf" type="button" aria-expanded="false" aria-controls="farben">Farbe</button>
  </div>
</div>
<div id="farben" class="feld" hidden>
  <div id="paletten" role="group" aria-label="Farbschema"></div>
  <label><span class="name">Bänder</span><input id="baender" type="range" min="0" max="8" step="0.1"></label>
  <label><span class="name">Linien</span><input id="linien" type="range" min="0" max="4" step="0.05"></label>
</div>
<script src="perturb.js"></script>
<script src="chain.js"></script>
<script src="app.js"></script>
</body>
</html>
